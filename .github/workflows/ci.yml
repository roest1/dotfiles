name: portability

# Proves "clone and get running" on fresh machines. Jobs that make a platform
# claim run in fedora/almalinux containers; the rest test repo logic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monday: everything, so drift in the images or upstream shows within a week.
  # Other days: the audit alone, so a new advisory against a pinned package
  # shows within a day. A failed scheduled run emails whoever last edited this.
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 0,2-6'

# mise resolves releases through the GitHub API; the token lifts the shared
# 60/hour anonymous limit that once failed the nvim floor job (issue #12).
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  # ── Docs-only PRs skip the heavy jobs ──────────────────────────────────────
  # Decided here, not by paths-ignore: a workflow that never starts never
  # reports `ci ok`. claude/* and nvim/README.md count as code: heavy jobs read them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      audit: ${{ steps.classify.outputs.audit }}
    steps:
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT" == schedule && "$SCHEDULE" != '0 6 * * 1' ]]; then
            echo "full=false" >>"$GITHUB_OUTPUT"; echo "audit=true" >>"$GITHUB_OUTPUT"
            echo "daily schedule: audit only"
            exit 0
          fi
          if [[ "$EVENT" != pull_request ]]; then
            echo "full=true" >>"$GITHUB_OUTPUT"
            echo "$EVENT: full run"
            exit 0
          fi
          # previous_filename too: renaming foo.sh to foo.md deletes a script.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
                    --jq '.[] | .filename, (.previous_filename // empty)')
          full=false
          [[ -z "$files" ]] && full=true
          while IFS= read -r f; do
            case "$f" in
              claude/* | nvim/README.md) full=true ;;
              *.md) ;;
              *) full=true ;;
            esac
          done <<<"$files"
          echo "$files" | sed 's/^/  /'
          echo "full=$full" >>"$GITHUB_OUTPUT"
          echo "full=$full"

  # ── Lint: the whole tree, on every PR ───────────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # tools/lint.sh is the one definition of what is linted. The pre-commit hook
      # runs it on staged files; this sweeps the tree, which a hook cannot.
      - name: Lint shell sources
        run: ./tools/lint.sh

      # The remote half of .githooks/pre-commit, which --no-verify skips.
      - name: No secret or machine-local files are tracked
        run: |
          patterns=$(grep -vE '^\s*(#|$)' .githooks/secret-patterns | paste -sd '|' -)
          echo "patterns: $patterns"
          if bad=$(git ls-files | grep -E "$patterns"); then
            echo ""
            echo "tracked files matching .githooks/secret-patterns:"
            echo "$bad"
            exit 1
          fi
          echo "ok: nothing matching is tracked"

      # Whether a LINE may be here (credentials, home paths), across every tracked file.
      - name: No credential-shaped content, no home paths in linked files
        run: tools/check-content.sh

      # ~/.gitconfig links here, so `gh auth setup-git` would write a credential
      # into the repo, and a bare github.com insteadOf breaks clones on keyless machines.
      - name: gitconfig stores no credentials and rewrites only owned repos
        run: |
          git config -f git/gitconfig --get-regexp '^credential' && {
            echo "git/gitconfig declares a credential helper; GitHub auth is SSH"
            exit 1
          }
          if git config -f git/gitconfig --get-regexp '^url\..*\.insteadof$' |
              grep -qE ' https://github\.com/?$'; then
            echo "git/gitconfig rewrites all of github.com; scope insteadOf to an owner"
            exit 1
          fi
          echo "ok: no credential helper, insteadOf scoped to owners"

  # ── engine: deps.conf, make, links, status ─────────────────────────────────
  # What every pillar runs through. Stays in this repo after any split.
  engine:
    name: engine
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # A target that shares a name with a path silently runs nothing.
      - name: Every Makefile target is .PHONY
        run: |
          set -uo pipefail
          phony=$(grep -E '^\.PHONY:' Makefile | sed 's/^\.PHONY://' | tr '\n' ' ')
          bad=0
          for t in $(grep -oE '^[a-z][a-z-]*:' Makefile | tr -d ':'); do
            case " $phony " in
              *" $t "*) ;;
              *) echo "target '$t' is not in .PHONY"; bad=1 ;;
            esac
          done
          if [ $bad -ne 0 ]; then
            echo ""
            echo "A target sharing a name with a file or directory silently does nothing."
            exit 1
          fi
          echo "ok: every Makefile target is declared .PHONY"

      # ARGS was once a blocklist whose stub rules silently overrode real targets.
      - name: No target overrides its own recipe
        run: |
          fail=0
          # Throwaway HOME: the target list includes `link`.
          tmphome=$(mktemp -d); export HOME="$tmphome"
          for t in help sections status check test sync link lint; do
            if make $t 2>&1 | grep -qE "warning: (overriding|ignoring old) recipe"; then
              echo "make $t triggers a recipe override"; fail=1
            fi
          done
          # section args must still be accepted, and still not warn
          if make check nvim 2>&1 | grep -qE "warning:"; then
            echo "make check nvim warns"; fail=1
          fi
          exit $fail

      # lib/sgr.sh's carriers (SGR 6, SGR 5) blink anywhere but a linked wezterm,
      # and are garbage in a pipe. Every direction, since the author never sees one.
      - name: make output carries escapes only on a wezterm tty
        run: |
          fail=0
          esc=$'\033['       # any escape at all
          carrier=$'\033[6'  # the carrier specifically: SGR 6, plain or bold
          for t in help status check; do
            if make $t 2>/dev/null | grep -qF "$esc"; then
              echo "make $t leaked escapes into a pipe"; fail=1
            fi
          done
          if ! command -v script >/dev/null 2>&1; then
            echo "no script(1) here; the tty cases below were skipped"; exit $fail
          fi

          # Each row gets its own fixture home, built by the real installer, so no
          # row depends on step order or on a hand-written link path.
          unlinked=$(mktemp -d)
          linked=$(mktemp -d)
          HOME="$linked" make link wezterm >/dev/null

          # $1 home, $2 TERM_PROGRAM, $3 pattern: true when $3 reaches the tty.
          # Sized pty and a real TERM: script(1) defaults to 80x24 and TERM=dumb,
          # and either one makes the banner decline for an unrelated reason.
          TERMED=TERM=xterm-256color
          on_tty() {
            env $TERMED HOME="$1" XDG_CONFIG_HOME= TERM_PROGRAM="$2" \
              script -qec "stty rows 50 cols 200; make help" /dev/null | grep -qF "$3"
          }

          # Off wezterm neither carrier may appear; lib/tty.sh's color is fine.
          slow=$'\033[5m'
          no_carrier() {   # $1 home, $2 TERM_PROGRAM, $3 what to say if it leaks
            if on_tty "$1" "$2" "$carrier"; then echo "SGR 6 $3"; fail=1; fi
            if on_tty "$1" "$2" "$slow";    then echo "SGR 5 $3"; fail=1; fi
          }
          no_carrier "$unlinked" WezTerm "on a wezterm tty before the config was linked"
          no_carrier "$linked"   xterm   "on a non-wezterm tty"

          # ...but the banner must still animate there. Probed by cursor-hide,
          # because script(1) writes CRLF and \r would pass vacuously.
          hide=$'\033[?25l'
          if ! on_tty "$linked" xterm "$hide"; then
            echo "the banner stopped animating on a non-wezterm tty -- lib/tty.sh"
            echo "has probably acquired lib/sgr.sh's three conditions by mistake"
            fail=1
          fi

          # The animation may hide characters but never drop one: its final
          # frame must equal the plain render.
          render=$(env $TERMED HOME="$linked" XDG_CONFIG_HOME= TERM_PROGRAM=WezTerm \
                     script -qec "stty rows 50 cols 200; make help" /dev/null | tr -d '\r')
          upline=$(printf '%s\n' "$render" | grep -n $'^\033\[[0-9]*A' | tail -1 | cut -d: -f1)
          if [ -z "$upline" ]; then
            echo "make help did not animate on a sized wezterm tty"; fail=1
          else
            final=$(printf '%s\n' "$render" | tail -n +"$upline" \
                    | sed $'s/\033\[[0-9;?]*[a-zA-Z]//g' | sed 's/[[:space:]]*$//' | grep -v '^$')
            plain=$(make help | sed 's/[[:space:]]*$//' | grep -v '^$')
            if [ "$final" != "$plain" ]; then
              echo "the animation's final frame does not match the plain render --"
              echo "a row is being truncated or dropped by the prefix walk"
              diff <(printf '%s\n' "$plain") <(printf '%s\n' "$final") | head -10
              fail=1
            fi
          fi

          # NO_COLOR (set, even empty) and TERM=dumb both mean plain. $TERMED goes
          # first so env's last assignment wins and the NO_COLOR rows keep a real
          # terminal; otherwise they pass vacuously.
          quiet() {   # $1 env assignment, $2 what to say if escapes survive
            if env $TERMED "$1" TERM_PROGRAM=xterm HOME="$linked" XDG_CONFIG_HOME= \
                 script -qec "stty rows 50 cols 200; make help" /dev/null \
               | grep -qF "$esc"; then
              echo "escapes survived $2"; fail=1
            fi
          }
          # ...and a positive control, so the rows below cannot pass because nothing emits.
          if ! env $TERMED TERM_PROGRAM=xterm HOME="$linked" XDG_CONFIG_HOME= \
                 script -qec "stty rows 50 cols 200; make help" /dev/null \
               | grep -qF "$esc"; then
            echo "the NO_COLOR rows are vacuous -- nothing decorates even when allowed"
            fail=1
          fi
          quiet NO_COLOR=1 "NO_COLOR=1"
          quiet NO_COLOR=  "NO_COLOR= (empty is still set, per the spec)"
          quiet TERM=dumb  "TERM=dumb"

          # ...and the menu is still all there when it declines to decorate.
          for e in NO_COLOR=1 TERM=dumb; do
            got=$(env $TERMED "$e" TERM_PROGRAM=xterm HOME="$linked" XDG_CONFIG_HOME= \
                    script -qec "stty rows 50 cols 200; make help" /dev/null \
                  | tr -d '\r' | sed 's/[[:space:]]*$//' | grep -v '^$')
            want=$(make help | sed 's/[[:space:]]*$//' | grep -v '^$')
            [ "$got" = "$want" ] || { echo "$e changed the OUTPUT, not just the styling"; fail=1; }
          done

          # All three hold: the carrier itself must appear, not just any escape.
          if ! on_tty "$linked" WezTerm "$carrier"; then
            echo "carrier missing on a linked wezterm tty"; fail=1
          fi
          # This row covers the XDG_CONFIG_HOME half of the guard.
          if ! env $TERMED HOME="$unlinked" XDG_CONFIG_HOME="$linked/.config" TERM_PROGRAM=WezTerm \
               script -qec "make help" /dev/null | grep -qF "$carrier"; then
            echo "carrier missing when XDG_CONFIG_HOME names the config"; fail=1
          fi
          exit $fail

      # Each row is a way ~/.config/dotfiles/sections could go wrong quietly.
      - name: A machine's section file narrows, and never widens
        run: |
          source lib/manifest.sh
          fail=0
          tmp=$(mktemp -d)

          # Absent is the normal case and must stay "everything".
          all=$(manifest_sections | tr '\n' ' ')
          got=$(DOTFILES_SECTIONS_FILE=$tmp/none manifest_scope | tr '\n' ' ')
          [ "$got" = "$all" ] || { echo "no file should mean every section: '$got'"; fail=1; }

          printf 'bash\n# nvim\n' > "$tmp/some"
          got=$(DOTFILES_SECTIONS_FILE=$tmp/some manifest_scope | tr '\n' ' ')
          [ "$got" = "bash " ] || { echo "expected 'bash ', got '$got'"; fail=1; }

          # Naming one always wins: opting out is a default, not a lock.
          got=$(DOTFILES_SECTIONS_FILE=$tmp/some manifest_scope nvim | tr '\n' ' ')
          [ "$got" = "nvim " ] || { echo "explicit args must win, got '$got'"; fail=1; }

          # A typo that installs nothing is the failure this file prevents.
          printf 'bash\nnvimm\n' > "$tmp/typo"
          # Captured, not piped to grep -q, which SIGPIPEs the writer under pipefail.
          warn=$(DOTFILES_SECTIONS_FILE=$tmp/typo manifest_scope 2>&1 >/dev/null)
          case "$warn" in
            *nvimm*) ;;
            *) echo "a name that is not a section must warn, got: '$warn'"; fail=1 ;;
          esac

          # A fully commented file must refuse, not fall through to "every section".
          printf '# bash\n# nvim\n' > "$tmp/empty"
          if DOTFILES_SECTIONS_FILE=$tmp/empty bash -c \
               'source lib/manifest.sh; manifest_scope_into' 2>/dev/null; then
            echo "an all-commented file must refuse, not fall through to all"; fail=1
          fi

          # ...and leave the scope empty, not merely return non-zero.
          n=$(DOTFILES_SECTIONS_FILE=$tmp/empty bash -c \
                'source lib/manifest.sh; manifest_scope_into >/dev/null 2>&1; echo ${#MANIFEST_SCOPE[@]}')
          [ "$n" = "0" ] || { echo "refused but left $n section(s) in MANIFEST_SCOPE"; fail=1; }

          # Takes a section name, not an array name; a variable name would read as a section.
          got=$(DOTFILES_SECTIONS_FILE=$tmp/empty bash -c \
                  'source lib/manifest.sh; manifest_scope_into bash >/dev/null 2>&1; echo "${MANIFEST_SCOPE[*]}"')
          [ "$got" = "bash" ] || { echo "expected scope 'bash', got '$got'"; fail=1; }

          exit $fail

      # Opting out is not drift: status reads the sections file too.
      - name: make status leaves an opted-out section alone
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          make sections | sed 's/^wezterm$/# wezterm/' > "$tmp/sections"
          fail=0

          out=$(DOTFILES_SECTIONS_FILE=$tmp/sections make status 2>&1)
          ! grep -q '^\[wezterm\]' <<<"$out" || { echo "opted-out [wezterm] still reported"; fail=1; }
          grep -q 'not selected here: wezterm' <<<"$out" || { echo "the skip must be named, not silent"; fail=1; }

          out=$(DOTFILES_SECTIONS_FILE=$tmp/sections make status wezterm 2>&1)
          grep -q '^\[wezterm\] links' <<<"$out" || { echo "naming a section must still check it"; fail=1; }

          out=$(DOTFILES_SECTIONS_FILE=$tmp/none make status 2>&1)
          grep -q '^\[wezterm\] links' <<<"$out" || { echo "no file must still mean every section"; fail=1; }
          ! grep -q 'not selected here' <<<"$out" || { echo "no file, nothing skipped"; fail=1; }

          [ $fail -eq 0 ] && echo "ok: status honors the sections file the way install does"
          exit $fail

      - name: Sections are discoverable
        run: |
          source lib/manifest.sh
          sections=$(manifest_sections | tr '\n' ' ')
          echo "sections: $sections"
          for want in bash nvim wezterm; do
            echo "$sections" | grep -qw "$want" || { echo "missing section: $want"; exit 1; }
          done

      - name: Every tool line has a known provider
        run: |
          source lib/manifest.sh
          bad=0
          while IFS=$'\t' read -r section provider cmd pkg; do
            for p in ${provider//||/ }; do
              case "$p" in
                pkg|uv|cargo|mise|manual) ;;
                *) echo "[$section] unknown provider '$p' for $cmd"; bad=1 ;;
              esac
            done
          done < <(manifest_lines tool)
          exit $bad

      - name: Every link source exists in the repo
        run: |
          source lib/manifest.sh
          bad=0
          while IFS=$'\t' read -r section src dest; do
            [ -e "$src" ] || { echo "[$section] missing link source: $src"; bad=1; }
          done < <(manifest_lines link)
          exit $bad

      # deps.conf, mise.toml and mise.lock must agree. Registry-free: no mise here.
      - name: mise.toml and mise.lock match deps.conf
        run: ./tools/gen-mise.sh --check

      # Assert the round trip: output the parser rejects is worse than none.
      - name: "tools/adopt.sh emits lines the parser accepts"
        run: |
          ./tools/adopt.sh git make tar > /tmp/adopt.txt
          grep -q '^tool ' /tmp/adopt.txt || { echo "adopt emitted no tool lines"; cat /tmp/adopt.txt; exit 1; }
          mkdir -p /tmp/rt
          { echo "[roundtrip]"; grep '^tool ' /tmp/adopt.txt; } > /tmp/rt/deps.conf
          source lib/manifest.sh
          n_in=$(grep -c '^tool ' /tmp/rt/deps.conf)
          n_out=$(MANIFEST_FILE=/tmp/rt/deps.conf manifest_lines tool | wc -l)
          echo "generated $n_in line(s), parsed back $n_out"
          [ "$n_in" -eq "$n_out" ] || { echo "round trip lost lines"; exit 1; }

      - name: Links report in sync right after `make link`
        run: |
          make link
          source lib/status.sh
          # Only the link half — tools legitimately aren't installed in this job.
          status_links
          if [ "$STATUS_DRIFT" -ne 0 ]; then
            echo "links drifted immediately after make link"; exit 1
          fi

      # A plugin links from its own clone, ignores the core's sections file, is
      # skipped if it cannot be cloned, and is left alone when a section is named.
      - name: Plugins run through the same engine, and the core needs none
        run: |
          set -euo pipefail
          # The runner sets XDG_CONFIG_HOME, so a throwaway HOME alone would miss these files.
          unset XDG_CONFIG_HOME XDG_DATA_HOME
          t=$(mktemp -d); export HOME="$t/home"; mkdir -p "$HOME/.config/dotfiles"
          git config --global user.name ci; git config --global user.email ci@example.invalid
          p="$t/plug"; mkdir -p "$p/cfg"; git -C "$p" init -q
          printf 'hello\n' > "$p/cfg/demo.conf"
          printf '[demo]\nlink  cfg/demo.conf  ~/.config/demo/demo.conf\npost  touch "$HOME/post-ran"\n' > "$p/deps.conf"
          git -C "$p" add -A; git -C "$p" commit -qm init
          printf 'demo  %s  ~/demo-plugin\nghost  https://invalid.example/none.git\n' "$p" > "$HOME/.config/dotfiles/plugins"
          printf 'bash\n' > "$HOME/.config/dotfiles/sections"
          source lib/plugins.sh
          plugins_fetch
          [ -d "$HOME/demo-plugin/.git" ] || { echo "demo plugin was not cloned"; exit 1; }
          [ ! -e "$HOME/.local/share/dotfiles/plugins/ghost" ] || { echo "a failed clone left a directory"; exit 1; }
          plugins_run install
          [ "$(readlink "$HOME/.config/demo/demo.conf")" = "$HOME/demo-plugin/cfg/demo.conf" ] \
            || { echo "plugin link does not point into the plugin clone"; exit 1; }
          [ -e "$HOME/post-ran" ] || { echo "plugin post step did not run"; exit 1; }
          plugins_run status >/dev/null || { echo "status reports drift on a correct plugin"; exit 1; }
          rm "$HOME/.config/demo/demo.conf"
          if plugins_run status >/dev/null; then echo "status missed a plugin link that is gone"; exit 1; fi
          out=$(make link bash); if grep -q 'plugin:' <<<"$out"; then echo "a named section ran plugins"; exit 1; fi
          rm "$HOME/.config/dotfiles/plugins"
          [ -z "$(plugins_list)" ] || { echo "no plugins file still listed plugins"; exit 1; }
          echo "ok: plugins link from their clone, skip what cannot be cloned, and stay out of named sections"

      # Without the guard, install.sh backed up the real file, linked nothing,
      # and pruning then deleted it.
      - name: A missing link source leaves the destination alone
        run: |
          set -euo pipefail
          unset XDG_CONFIG_HOME XDG_DATA_HOME
          t=$(mktemp -d); export HOME="$t/home"; mkdir -p "$HOME"
          m="$t/m"; mkdir -p "$m"
          printf '[demo]\nlink  nothere/conf  ~/.democonf\n' > "$m/deps.conf"
          echo keep > "$HOME/.democonf"
          out=$(MANIFEST_FILE="$m/deps.conf" DOTFILES_SECTIONS_FILE="" bash install.sh)
          [ -f "$HOME/.democonf" ] && [ ! -L "$HOME/.democonf" ] && [ "$(cat "$HOME/.democonf")" = keep ] \
            || { echo "the real file was moved or replaced"; echo "$out"; exit 1; }
          grep -q 'does not exist' <<<"$out" || { echo "no warning printed"; echo "$out"; exit 1; }
          echo "ok: destination untouched"

      # A wrong "not here" silently stops a tool installing.
      - name: tool_applies_here suppresses nothing but a dotnet-less roslyn
        run: |
          set -euo pipefail
          source lib/pkg.sh
          for t in wezterm rg fzf bat eza gh jq nvim bun uv; do
            tool_applies_here "$t" || { echo "$t must apply"; exit 1; }
          done
          echo "ok: every ordinary tool applies"

      # \b matches before a hyphen, so git-filter-repo once claimed /usr/bin/git.
      - name: A uv tool claims only its own name
        run: |
          set -euo pipefail
          source lib/status.sh
          bin=$(mktemp -d); printf '#!/bin/sh\n' > "$bin/ruff"; chmod +x "$bin/ruff"
          export PATH="$bin:$PATH"
          mise() { return 1; }
          uv() { printf '%s\n' 'git-filter-repo v2.47.0' '- git-filter-repo' 'ruff v0.14.0' '- ruff'; }
          got=$(provider_of git)
          [ "$got" != uv ] || { echo "git reported as uv because git-filter-repo is a uv tool"; exit 1; }
          got=$(provider_of ruff)
          [ "$got" = uv ] || { echo "ruff is a uv tool but reported as '$got'"; exit 1; }
          echo "ok: git is $(provider_of git), ruff is uv"

      # A Cellar path is brew, never pkg, and `manual` must not absorb it.
      - name: linuxbrew is never pkg
        run: |
          set -euo pipefail
          source lib/status.sh
          t=$(mktemp -d)
          mkdir -p "$t/Cellar/foo/1.0/bin" "$t/bin"
          printf '#!/bin/sh\n' > "$t/Cellar/foo/1.0/bin/foo"; chmod +x "$t/Cellar/foo/1.0/bin/foo"
          ln -s "$t/Cellar/foo/1.0/bin/foo" "$t/bin/foo"
          export PATH="$t/bin:$PATH"
          mise() { return 1; }; uv() { :; }
          PM=dnf; got=$(provider_of foo); [ "$got" = brew ] || { echo "Cellar copy reported '$got', want brew"; exit 1; }
          ! provider_satisfies 'pkg'         brew || { echo "pkg accepted brew"; exit 1; }
          ! provider_satisfies 'pkg||manual' brew || { echo "manual wildcard absorbed brew"; exit 1; }
          provider_satisfies 'pkg||manual' cargo  || { echo "manual wildcard no longer accepts other sources"; exit 1; }
          echo "ok: brew is its own provider, never pkg"

      # Two distinct copies are reported; a symlink to the active one is the same copy.
      - name: make status names shadowed copies, and only real ones
        run: |
          set -euo pipefail
          source lib/status.sh
          t=$(mktemp -d); mkdir -p "$t/a" "$t/b" "$t/c"
          printf '#!/bin/sh\necho a\n' > "$t/a/dup"; printf '#!/bin/sh\necho b\n' > "$t/b/dup"
          chmod +x "$t/a/dup" "$t/b/dup"
          ln -s "$t/a/dup" "$t/c/dup"
          printf '#!/bin/sh\n' > "$t/a/solo"; chmod +x "$t/a/solo"; ln -s "$t/a/solo" "$t/c/solo"
          export PATH="$t/a:$t/c:$t/b:$PATH"
          got=$(shadowed_copies dup)
          [ "$got" = "$t/b" ] || { echo "dup: want exactly '$t/b', got '$got'"; exit 1; }
          got=$(shadowed_copies solo)
          [ -z "$got" ] || { echo "a symlink to the active copy was reported as a second copy: '$got'"; exit 1; }
          got=$(shadowed_copies no-such-tool-xyz)
          [ -z "$got" ] || { echo "an absent tool reported copies: '$got'"; exit 1; }
          echo "ok: one real duplicate reported, a symlinked alias and an absent tool are not"

      # submodule.recurse moves a checked-out submodule but leaves one a pull
      # ADDS empty; .githooks/post-merge (also post-rewrite, post-checkout)
      # checks it out. Fails all three cases without the hook.
      - name: A pull, a rebase or a branch switch checks out a new submodule
        run: |
          set -euo pipefail
          src=$PWD
          t=$(mktemp -d)
          export GIT_CONFIG_GLOBAL=$t/gitconfig GIT_CONFIG_NOSYSTEM=1 # never the machine's own config
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always # local submodule URLs, this test only
          git config --global pull.rebase false

          for s in s1 s2 s3 s4; do
            git init -q "$t/$s" && git -C "$t/$s" commit -q --allow-empty -m "$s"
          done
          git init -q "$t/up"
          mkdir -p "$t/up/lib"
          cp -P "$src"/.githooks/post-merge "$src"/.githooks/post-checkout "$src"/.githooks/post-rewrite "$t/up/"
          mkdir "$t/up/.githooks" && mv "$t/up"/post-* "$t/up/.githooks/"
          cp "$src/lib/submodules.sh" "$t/up/lib/"
          git -C "$t/up" add -A && git -C "$t/up" commit -qm base
          git clone -q "$t/up" "$t/down"
          git -C "$t/down" config core.hooksPath .githooks
          git -C "$t/down" config submodule.recurse true

          add() { git -C "$t/up" submodule add -q "$t/$1" "$1" && git -C "$t/up" commit -qm "add $1"; }
          out() { [[ -e "$t/down/$1/.git" ]]; }
          check() { if out "$1"; then echo "ok   $2 checks out $1"; else echo "FAIL $2 left $1 empty"; fail=1; fi; }
          fail=0

          add s1
          git -C "$t/down" pull -q 2>/dev/null
          check s1 "pull (merge)"

          add s2
          git -C "$t/down" commit -q --allow-empty -m local # so the rebase rewrites something
          git -C "$t/down" pull -q --rebase 2>/dev/null
          check s2 "pull --rebase"

          git -C "$t/up" switch -q -c topic && add s3 && git -C "$t/up" switch -q main
          git -C "$t/down" fetch -q && git -C "$t/down" switch -q -c topic --track origin/topic 2>/dev/null
          check s3 "a branch switch"
          git -C "$t/down" switch -q main 2>/dev/null

          git -C "$t/down" config submodule.s4.update none
          add s4
          msg=$(git -C "$t/down" pull -q 2>&1)
          if out s4; then echo "FAIL s4 was opted out but got checked out"; fail=1
          elif grep -q 's4' <<<"$msg"; then echo "FAIL the opt-out is noisy: $msg"; fail=1
          else echo "ok   an opted-out submodule stays out, quietly"; fi

          rm -rf "$t"
          exit $fail

  # ── Links only: the locked-down-machine path ───────────────────────────────
  # No sudo, no network, nothing installed. Must work everywhere.
  link-only:
    # A literal name: an image tag in it would change under a required check.
    name: link only (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora 45
            container: fedora:45
          - name: rhel 9
            container: almalinux:9
          # The home server's release. The work box stays on 9, so both rows.
          - name: rhel 10
            container: almalinux:10
    steps:
      # git before checkout, so it makes a real clone; jq and diffutils for the claude checks.
      - name: Container prerequisites
        run: dnf install -y git make findutils jq diffutils

      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: make link
        run: make link
      - name: Config is symlinked into the repo
        run: |
          test -L "$HOME/.bashrc"
          # The prompt is a submodule: linked and resolving, or `submodules: true` was lost.
          test -f "$HOME/.bash_prompt" && test -L "$HOME/.bash_prompt"
          test -L "$HOME/.config/nvim"
          test -L "$HOME/.config/wezterm/wezterm.lua"
          test -L "$HOME/.claude/settings.json"

      # Plugins add shell code here; a drop-in loads last, after the core.
      - name: bashrc sources plugin drop-ins last
        run: |
          d="${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles/bashrc.d"; mkdir -p "$d"
          printf '%s\n' 'declare -F h >/dev/null && dropin_saw_core=1' 'h() { echo dropin; }' > "$d/ci.bash"
          out=$(bash -ic 'echo "saw=${dropin_saw_core:-0} h=$(h)"' 2>/dev/null)
          rm "$d/ci.bash"  # only ours: [git-autofetch] links a drop-in here too
          [ "$out" = "saw=1 h=dropin" ] || { echo "FAIL: drop-in not sourced last: '$out'"; exit 1; }
          echo "ok: drop-ins load after the core"

      # A malformed settings.json silently disables every setting, and a hook that
      # stops publishing claude_state leaves wezterm's tab glyph stuck.
      - name: Claude user settings parse and carry the wezterm hooks
        run: |
          jq -e . "$HOME/.claude/settings.json" >/dev/null \
            || { echo "FAIL: ~/.claude/settings.json is not valid JSON"; exit 1; }
          for ev in Notification PreToolUse UserPromptSubmit Stop; do
            jq -e --arg ev "$ev" \
              '[.hooks[$ev][].hooks[].command] | any(test("tab-state\\.sh"))' \
              "$HOME/.claude/settings.json" >/dev/null \
              || { echo "FAIL: $ev hook missing or no longer calls claude/tab-state.sh"; exit 1; }
          done

      # Esc skips Stop, so a new prompt and Claude's idle notification are what
      # retire a stale claim (#110). Each transition, on a fake tty.
      - name: claude/tab-state.sh retires a stale claim
        run: |
          t=$(mktemp -d); export XDG_RUNTIME_DIR=$t CLAUDE_TAB_TTY=$t/tty
          got() { : >"$t/tty"; echo "$2" | claude/tab-state.sh "$1"
                  sed -n 's/.*claude_state=\(.*\)\x07.*/\1/p' "$t/tty" | base64 -d; }
          j='{"session_id":"ci"}'; fail=0
          want() { [ "$1" = "$2" ] || { echo "FAIL: $3: got '$1', want '$2'"; fail=1; }; }
          want "$(got asking "$j")" asking "PreToolUse AskUserQuestion"
          want "$(got idle "$j")" complete "idle after asking"
          want "$(got waiting "$j")" waiting "permission prompt"
          want "$(got prompt "$j")" "" "a new prompt clears"
          want "$(got stop '{"session_id":"ci","background_tasks":[1]}')" background "stop with tasks"
          : >"$t/tty"; echo "$j" | claude/tab-state.sh idle
          [ -s "$t/tty" ] && { echo "FAIL: idle overwrote a background claim"; fail=1; }
          want "$(got stop "$j")" complete "stop"
          [ $fail -eq 0 ] && echo "ok: claims are made, and stale ones retired"
          exit $fail

      # Esc on a question or permission prompt fires no hook, but the transcript
      # gets that tool call's result, as an error. The watcher started by
      # asking/waiting turns that into complete, and nothing else.
      - name: claude/tab-state.sh retires a claim when Esc rejects the tool call
        run: |
          t=$(mktemp -d); export XDG_RUNTIME_DIR=$t CLAUDE_TAB_TTY=$t/tty
          tr=$t/transcript.jsonl; fail=0
          rej='{"type":"user","message":{"content":[{"type":"tool_result","content":"rejected","is_error":true}]}}'
          ok='{"type":"user","message":{"content":[{"type":"tool_result","content":"an answer"}]}}'
          claim() { : >"$tr"; : >"$t/tty"; echo "{\"session_id\":\"ci\",\"transcript_path\":\"$tr\"}" | claude/tab-state.sh "$1"; : >"$t/tty"; }
          sent() { sed -n 's/.*claude_state=\(.*\)\x07.*/\1/p' "$t/tty" | base64 -d; }
          settle() { for _ in 1 2 3 4 5 6; do [ -s "$t/tty" ] && return; sleep 1; done; }

          claim asking; echo "$rej" >>"$tr"; settle
          [ "$(sent)" = complete ] || { echo "FAIL: Esc on a question left '$(sent)', want complete"; fail=1; }
          claim waiting; echo "$rej" >>"$tr"; settle
          [ "$(sent)" = complete ] || { echo "FAIL: Esc on a permission prompt left '$(sent)', want complete"; fail=1; }
          claim asking; echo "$ok" >>"$tr"; sleep 3
          [ -s "$t/tty" ] && { echo "FAIL: an answered question was marked complete"; fail=1; }
          claim asking; echo '{"session_id":"ci"}' | claude/tab-state.sh prompt; : >"$t/tty"
          echo "$rej" >>"$tr"; sleep 3
          [ -s "$t/tty" ] && { echo "FAIL: the watcher wrote after a new prompt took over"; fail=1; }
          [ $fail -eq 0 ] && echo "ok: Esc on a question or permission prompt retires its claim"
          exit $fail

      # Claude Code runs hooks with no controlling terminal, where /dev/tty
      # fails, so the script finds the pane through its parent's stdout. setsid
      # drops the controlling tty the way Claude Code does.
      - name: claude/tab-state.sh reaches the pane without a controlling terminal
        run: |
          out=$(python3 -I -c 'import pty, sys; pty.spawn(sys.argv[1:])' setsid -w bash -c \
            'echo "{\"session_id\":\"ci\"}" | XDG_RUNTIME_DIR=$(mktemp -d) claude/tab-state.sh asking; :' </dev/null)
          grep -q "claude_state=$(printf asking | base64 -w0)" <<<"$out" \
            || { echo "FAIL: no SetUserVar reached the pty"; exit 1; }
          echo "ok: the claim reaches the pane through the parent's pty"

      # The sandbox enforces the Read denies at the OS level (#109). An excluded
      # command or a writable cache would each be a quiet way out of it; the
      # reasons are under [claude] in deps.conf.
      - name: The sandbox is on, and the escape hatch is the only way out
        run: |
          f=claude/settings.json; fail=0
          jq -e '.sandbox.enabled == true' "$f" >/dev/null \
            || { echo "FAIL: sandbox.enabled is not true"; fail=1; }
          jq -e '(.sandbox.excludedCommands // []) == []' "$f" >/dev/null \
            || { echo "FAIL: sandbox.excludedCommands is set; git, make and gh each run arbitrary code"; fail=1; }
          jq -e '(.sandbox.filesystem.allowWrite // []) == []' "$f" >/dev/null \
            || { echo "FAIL: sandbox.filesystem.allowWrite is set; a writable cache is a way out"; fail=1; }
          [ $fail -eq 0 ] && echo "ok: sandbox on, nothing excluded, nothing extra writable"
          exit $fail

      # Under .claude/ this repo would also load it as project settings, and every hook would fire twice.
      - name: Claude settings are not also project-scoped
        run: |
          if [ -e .claude/settings.json ]; then
            echo "FAIL: .claude/settings.json would double-load as project settings"
            echo "      move it to claude/settings.json (see [claude] in deps.conf)"
            exit 1
          fi

      # The global prompt lives in a private plugin; no CLAUDE.md under claude/
      # either (case-insensitive).
      - name: No personal prompt in the public repo
        run: |
          fail=0
          if find claude -maxdepth 1 \( -iname 'claude.md' -o -iname 'user-memory.md' \) | grep -q .; then
            echo "FAIL: a global prompt is back under claude/ — it belongs in a private plugin"; fail=1
          fi
          if source lib/manifest.sh && manifest_lines link | awk -F'\t' '{print $3}' | grep -qx "$HOME/.claude/CLAUDE.md"; then
            echo "FAIL: deps.conf links ~/.claude/CLAUDE.md"; fail=1
          fi
          [ $fail -eq 0 ] && echo "ok: no personal prompt here"
          exit $fail

      - name: Idempotent — second run changes nothing
        run: |
          make link | tee /tmp/second.txt
          if grep -qE "linked |backed up " /tmp/second.txt; then
            echo "second run was not idempotent"; exit 1
          fi

      # prune_orphans deletes files: a foreign dead link and a live link must survive.
      - name: Orphan pruning removes only this repo's dead links
        run: |
          ln -s "$PWD/bash/retired_name" "$HOME/.bash_orphan"       # dead, ours
          ln -s /nonexistent/elsewhere "$HOME/.unrelated_dead_link" # dead, not ours
          test -L "$HOME/.bashrc"                                   # live, ours

          make link

          fail=0
          if [ -L "$HOME/.bash_orphan" ]; then
            echo "FAIL: dead link into the repo was not pruned"; fail=1
          fi
          if [ ! -L "$HOME/.unrelated_dead_link" ]; then
            echo "FAIL: pruned a dead link that does not point into this repo"; fail=1
          fi
          if [ ! -L "$HOME/.bashrc" ]; then
            echo "FAIL: pruned a link whose target still exists"; fail=1
          fi
          rm -f "$HOME/.unrelated_dead_link"
          [ $fail -eq 0 ] && echo "ok: pruned exactly the repo's own dead link"
          exit $fail

  # ── Full install per platform ──────────────────────────────────────────────
  install:
    name: install (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The fleet's release, not `latest`; bump with the workstations.
          - name: fedora 45 / dnf5
            runs-on: ubuntu-latest
            container: fedora:45
          # AlmaLinux tracks RHEL's point release. EPEL on, CRB off, as on the real box.
          - name: rhel 9 / dnf4
            runs-on: ubuntu-latest
            container: almalinux:9
          # RHEL 10 is still dnf4, so it is its own row.
          - name: rhel 10 / dnf4
            runs-on: ubuntu-latest
            container: almalinux:10
    steps:
      - name: Enable EPEL (as on the RHEL box)
        if: startsWith(matrix.container, 'almalinux')
        run: dnf install -y epel-release

      - name: Bootstrap container prerequisites
        # curl for ensure_uv; the images ship curl-minimal, swapped with --allowerasing.
        run: dnf install -y --allowerasing git make sudo findutils curl

      - uses: actions/checkout@v7
        with:
          submodules: true

      # Before [bash], which sets dnf's one key.
      - name: Snapshot dnf.conf
        run: grep -v '^max_parallel_downloads' /etc/dnf/dnf.conf > /tmp/dnf.rest.before

      - name: Install the bash section
        run: make install bash

      - name: Verify the bash section
        run: |
          # `make check` exits 0 with tools missing; assert on its output.
          make check bash | tee /tmp/check.txt
          if grep -q MISSING /tmp/check.txt; then
            echo "bash section incomplete"; exit 1
          fi

      # dnf has a uv package, so a regression to pkg shows here. Provenance, not presence.
      - name: Install the uv section
        run: make install uv

      - name: The installed uv is the self-updatable one
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv >/dev/null || { echo "uv was not installed"; exit 1; }
          resolved=$(readlink -f "$(command -v uv)" 2>/dev/null || command -v uv)
          echo "uv: $resolved ($(uv --version))"

          if command -v rpm >/dev/null 2>&1 && rpm -qf "$resolved" >/dev/null 2>&1; then
            echo "uv came from rpm — ensure_uv preferred the distro package"; exit 1
          fi
          # uv self-updates only with the receipt Astral's installer writes; it
          # must name the directory of the uv that runs.
          receipt="${XDG_CONFIG_HOME:-$HOME/.config}/uv/uv-receipt.json"
          test -r "$receipt" || { echo "no $receipt — 'uv self update' will refuse"; exit 1; }
          prefix=$(sed -n 's/.*"install_prefix": *"\([^"]*\)".*/\1/p' "$receipt")
          [ "$prefix" = "$(dirname "$(command -v uv)")" ] \
            || { echo "receipt is for '$prefix', but uv runs from $(command -v uv)"; exit 1; }

          # uv.toml must be linked where uv reads it.
          test -L "$HOME/.config/uv/uv.toml" || { echo "uv.toml not linked"; exit 1; }
          grep -q 'python-preference' "$HOME/.config/uv/uv.toml"
          echo "ok: self-updatable uv, config linked"

      # bash/deps.sh owns one dnf.conf key: it lands, every other line survives,
      # and a re-run at the value never reaches sudo.
      - name: "[bash] sets one dnf key and nothing else"
        run: |
          set -euo pipefail
          source lib/pkg.sh
          got=$(dnf_max_parallel_downloads)
          [ "$got" = "$DNF_MAX_PARALLEL_DOWNLOADS" ] || { echo "dnf resolves $got, want $DNF_MAX_PARALLEL_DOWNLOADS"; exit 1; }
          grep -v '^max_parallel_downloads' /etc/dnf/dnf.conf > /tmp/dnf.rest.after
          # In bash, not cmp: neither image ships diffutils.
          [ "$(cat /tmp/dnf.rest.before)" = "$(cat /tmp/dnf.rest.after)" ] \
            || { echo "dnf.conf changed beyond the one key:"; cat /etc/dnf/dnf.conf; exit 1; }
          shim=$(mktemp -d); printf '#!/bin/sh\necho "$@" >> /tmp/sudo.log\n' > "$shim/sudo"; chmod +x "$shim/sudo"
          PATH="$shim:$PATH" ensure_dnf_parallel
          [ ! -s /tmp/sudo.log ] || { echo "a re-run reached sudo:"; cat /tmp/sudo.log; exit 1; }
          # Captured first: grep -q under pipefail SIGPIPEs make.
          st=$(make status bash || true)
          grep -q "✓ max_parallel_downloads=$DNF_MAX_PARALLEL_DOWNLOADS" <<<"$st" \
            || { echo "make status does not report the value"; echo "$st"; exit 1; }
          echo "ok: one key, effective value $got, idempotent without sudo"

  # ── [bash] ─────────────────────────────────────────────────────────────────
  bash:
    name: bash
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: the alias check compares against the merge base.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # The reverse of the check above: a path bashrc sources unguarded must be
      # declared, or every shell on a new machine errors. Guarded ones are machine-local.
      - name: Every unguarded source in bashrc is declared
        run: |
          source lib/manifest.sh
          declared=$(manifest_lines link | cut -f3 | xargs -r -n1 basename | sort -u)
          bad=0
          while read -r path; do
            base=$(basename "$path")
            echo "$declared" | grep -qx "$base" || {
              echo "bashrc sources $path with no link line in deps.conf"; bad=1; }
          done < <(grep -oE '^source[[:space:]]+~/\.[A-Za-z0-9_.-]+' bash/bashrc | awk '{print $2}')
          exit $bad

      # A line that lost its `#` parses fine and only shows up at runtime.
      - name: Bash configs source without emitting output
        run: |
          bad=0
          for f in bash/bash_theme ps1/ps1.bash bash/bash_productivity bash/bash_git \
                   bash/bash_github; do
            # expand_aliases: that is how an interactive shell parses these files.
            out=$(bash -c "shopt -s expand_aliases; source $f" 2>&1)
            [ -z "$out" ] || { echo "$f is noisy when sourced:"; echo "$out"; bad=1; }
          done
          exit $bad

      # `reload` re-sources into a live shell, where a stale alias turns `f() {`
      # into a syntax error. An alias that became a function needs `unalias` first.
      - name: Aliases turned into functions are unaliased first
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null) || base=""
          if [ -z "$base" ]; then echo "no merge base; skipping"; exit 0; fi

          old_aliases=$(for f in $(git ls-tree -r --name-only "$base" -- bash/); do
                          git show "$base:$f" 2>/dev/null
                        done | grep -hE '^[[:space:]]*alias ' | sed 's/.*alias //;s/=.*//' | sort -u)
          bad=0
          for fn in $(grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' bash/bash_* | tr -d '()' | sort -u); do
            echo "$old_aliases" | grep -qx -- "$fn" || continue
            grep -qE "^[[:space:]]*unalias .*\b${fn}\b" bash/bash_* || {
              echo "'$fn' was an alias and is now a function, with no 'unalias $fn' guard"
              echo "  a reload in a shell running the older config will fail to parse it"
              bad=1
            }
          done
          exit $bad

      # `h` is hand-maintained: it names every public command and nothing that is gone.
      - name: Every command is documented in h, and h documents nothing missing
        run: |
          source lib/manifest.sh

          defined=$( { grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         | tr -d '()'
                       grep -hE '^alias ' bash/bash_productivity bash/bash_git \
                         | sed 's/alias //;s/=.*//'
                     } | grep -vE '^_' | sort -u )
          hbody=$(sed -n '/^h() {/,/^}/p' bash/bash_productivity)
          bad=0
          for c in $defined; do
            echo "$hbody" | grep -qw -- "$c" || { echo "undocumented in h: $c"; bad=1; }
          done

          # ...and the reverse. Static against the sources: many commands sit behind
          # `command -v` guards, so a runner may lack them. A command counts if the
          # configs define it or deps.conf declares it.
          defines=$( { grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         | tr -d '()'
                       grep -hE '^[[:space:]]*alias ' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         | sed 's/.*alias //;s/=.*//'
                       manifest_lines tool | cut -f3
                     } | sort -u )

          # Quick reference only (the no-args heredoc); two spaces end a command name.
          quickref=$(sed -n '/^h() {/,/^    return$/p' bash/bash_productivity)
          listed=$(echo "$quickref" | sed -n 's/^    \([a-z][a-z0-9-]*\)  \+.*/\1/p' | sort -u)
          for c in $listed; do
            echo "$defines" | grep -qx -- "$c" \
              || { echo "h documents '$c', which nothing defines or declares"; bad=1; }
          done
          exit $bad

  # ── [uv] ───────────────────────────────────────────────────────────────────
  uv:
    name: uv
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The installer preference cannot live in a || chain (pkg would win, and
      # the distro's uv cannot self-update), so the declaration is asserted here.
      - name: '[uv] is installed by its own installer, never the distro''s'
        run: |
          set -euo pipefail
          source lib/manifest.sh
          bad=0

          # uv.toml carries the two settings from /etc/uv/uv.toml, which the RPM owns.
          manifest_lines link uv | awk -F'\t' '{print $2}' | grep -qx 'uv/uv.toml' || {
            echo "[uv] no longer links uv/uv.toml — removing the distro package"
            echo "     would revert python-downloads and python-preference"; bad=1; }

          # No section may declare uv through pkg, in any position of a chain.
          while IFS=$'\t' read -r section provider cmd _pkg; do
            [ "$cmd" = "uv" ] || continue
            for p in ${provider//||/ }; do
              if [ "$p" = "pkg" ]; then
                echo "[$section] declares uv via 'pkg'. That build cannot"
                echo "     'uv self update'. Let ensure_uv (lib/pkg.sh) choose —"
                echo "     it already falls back to pkg when astral.sh is down."
                bad=1
              fi
            done
          done < <(manifest_lines tool)

          # ensure_uv must still try the installer first.
          grep -q '^ensure_uv()' lib/pkg.sh || {
            echo "lib/pkg.sh no longer defines ensure_uv"; bad=1; }
          grep -q 'ensure_uv ||' lib/pkg.sh || {
            echo "uv_install no longer bootstraps uv through ensure_uv"; bad=1; }
          body=$(sed -n '/^ensure_uv()/,/^}/p' lib/pkg.sh)
          first=$(grep -n -E 'astral\.sh|pkg_install' <<<"$body" | head -1 || true)
          case "$first" in
            *astral.sh*) ;;
            *) echo "ensure_uv reaches pkg_install before the official installer:"
               echo "     $first"; bad=1 ;;
          esac

          [ $bad -eq 0 ] && echo "ok: uv comes from Astral's installer, with pkg as the fallback"
          exit $bad

  # ── [nvim] ─────────────────────────────────────────────────────────────────
  # The help matches the config, and the servers run under bun: nothing may
  # bring back node, npm, pip or a node shim.
  nvim:
    name: nvim (docs, servers under bun)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The editor's `h` check: <leader> keys and user commands, read from lua/.
      - name: nvim help names only mappings that exist, and every mapping and command is documented
        run: |
          set -uo pipefail
          bad=0
          docs="nvim/doc/*.txt nvim/README.md"

          # Quoted <leader> literals under lua/; comments are unquoted and do not count.
          defined=$(grep -rhoE "['\"]<leader>[^'\"]+['\"]" nvim/lua nvim/init.lua \
                    | tr -d "'\"" | sort -u)

          # A token ends at whitespace, a backtick, a pipe, or punctuation.
          token='<leader>[^[:space:]`|),.*]+'
          # shellcheck disable=SC2086
          named=$(grep -hoE "$token" $docs | sort -u)
          for k in $named; do
            echo "$defined" | grep -qxF -- "$k" \
              || { echo "docs name $k, which nothing under nvim/lua defines"; bad=1; }
          done

          # ...and the reverse, against the one file that claims to be complete.
          in_keymaps=$(grep -hoE "$token" nvim/doc/dotfiles.txt | sort -u)
          for k in $defined; do
            echo "$in_keymaps" | grep -qxF -- "$k" \
              || { echo "$k is defined but missing from nvim/doc/dotfiles.txt"; bad=1; }
          done

          # Every user command has a help page.
          cmds=$(grep -rhoE "nvim_create_user_command\(\s*'[A-Za-z]+'" nvim/lua nvim/init.lua \
                 | sed -E "s/.*'([A-Za-z]+)'/\1/" | sort -u)
          for c in $cmds; do
            grep -qE "(^|[[:space:]*]):$c([^A-Za-z]|$)" nvim/doc/*.txt \
              || { echo ":$c is defined but has no line in nvim/doc"; bad=1; }
          done

          [ $bad -eq 0 ] && echo "ok: $(echo "$defined" | wc -l) leader keys and $(echo "$cmds" | wc -l) commands, all documented, nothing stale"
          exit $bad

      # Same setup-bun as the audit job. bun lands outside ~/.bun/bin, so later steps use command -v.
      - id: bun
        run: |
          set -euo pipefail
          # Fail rather than default: an empty bun-version means latest.
          v=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$v" ]; then
            echo "mise.toml declares no bun version; deps.conf must keep bun" \
                 "on the mise lane, or this job needs another pin." >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: deps.conf declares no node, npm or pip
        run: |
          fail=0
          source lib/manifest.sh
          # provider column
          if manifest_lines tool | grep -qP '\tnpm\t'; then
            echo "npm provider reintroduced in deps.conf"; fail=1
          fi
          # command column — node itself, and pip under any provider
          while IFS=$'\t' read -r section provider cmd pkg; do
            case "$cmd" in
              node|npm|npx|pip|pip3) echo "[$section] '$cmd' reintroduced"; fail=1 ;;
            esac
          done < <(manifest_lines tool)
          [ $fail -eq 0 ] && echo "clean: no node, npm or pip in the manifest"
          exit $fail

      - name: No node shim anywhere in the repo
        run: |
          # A node->bun alias would blame the wrong tool for every incompatibility.
          if grep -rnE '(ln -s.*\bbun\b.*/node|exec bun "\$@")' \
               --include='*.sh' --include='*.lua' --include='*.conf' . ; then
            echo "a node->bun shim was introduced — see lsp_servers.lua for why not"
            exit 1
          fi
          echo "clean: no node shim"

      # Not Ubuntu's 0.9.5: this config needs 0.12. Pinned and sha256-verified;
      # bump the version and hash together.
      - name: Install neovim (pinned)
        env:
          NVIM_VERSION: v0.12.4
          NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
        run: |
          set -euo pipefail
          url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/nvim.tar.gz "$url"
          echo "${NVIM_SHA256}  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Also the two readers of theme.conf, nvim's and wezterm's: no file, a
      # valid one, a name that is gone, and the spelling from before the fonts
      # moved in. wezterm's runs here because nvim is the Lua it is run with.
      - name: Unit-test the language server definitions, the keymap counter and the theme.conf readers
        run: |
          nvim --version | head -1
          make test

      # A real LSP initialize handshake; --version and exit codes mislead for several servers.
      - name: LSP servers handshake under bun, with node/npm absent
        run: |
          bun install --cwd nvim/lsp-servers --frozen-lockfile
          MIN=$(mktemp -d)
          for b in sh bash env timeout bun; do ln -sf "$(command -v $b)" "$MIN/$b"; done
          ! PATH=$MIN command -v node
          ! PATH=$MIN command -v npm
          PATH=$MIN bun nvim/lsp-servers/verify.ts | tee /tmp/lsp.txt
          grep -q "ALL PASS" /tmp/lsp.txt

  # ── the neovim floor, on the platform that can't meet it ───────────────────
  # RHEL 9's EPEL neovim is too old, so mise is the whole answer. Drives the
  # real provider code; stops short of `make install nvim`, which proves nothing more.
  nvim-floor:
    name: neovim floor (${{ matrix.name }}, mise fallback)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # EPEL's neovim is 0.8, and this is the fleet's oldest glibc.
          - name: rhel 9
            container: almalinux:9
    steps:
      # util-linux for script(1).
      - name: Container prerequisites (EPEL on, as on the RHEL box)
        run: |
          dnf install -y epel-release
          dnf install -y --allowerasing git make sudo findutils curl util-linux

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Resolve nvim through the real provider chain
        run: |
          set -euo pipefail
          source lib/manifest.sh
          source lib/providers.sh
          pkg_detect
          # Spec read from the manifest, so flipping deps.conf fails here.
          spec=$(manifest_lines tool nvim | awk -F'\t' '$3=="nvim" {print $2}')
          echo "declared provider chain: $spec"
          [ "$spec" = "mise||pkg" ] || { echo "expected mise||pkg"; exit 1; }
          provider_install "$spec" nvim neovim
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exactly one nvim, and it meets the floor
        run: |
          set -euo pipefail
          command -v nvim
          nvim --version | head -1
          v=$(nvim --version | awk 'NR==1 { sub(/^v/,"",$2); print $2 }')
          maj=${v%%.*}; rest=${v#*.}; min=${rest%%.*}
          [ "$maj" -gt 0 ] || [ "$min" -ge 12 ] || { echo "nvim $v is below the 0.12 floor"; exit 1; }
          # `type -ap`: the EL image has no `which`.
          n=$(type -ap nvim | sort -u | wc -l)
          echo "nvim binaries on PATH: $n"
          type -ap nvim
          [ "$n" -eq 1 ] || { echo "expected exactly one nvim, found $n"; exit 1; }
          if command -v rpm >/dev/null 2>&1 && rpm -q neovim >/dev/null 2>&1; then
            echo "dnf's neovim got installed after all"; exit 1
          fi
          echo "one nvim, $v, no distro package — mise-first held"

      # A machine whose global mise config predates the pin must move onto it.
      - name: make install moves an existing mise tool onto the pin
        run: |
          set -euo pipefail
          source lib/pkg.sh
          cfg=$(_mise_global_config)
          spec=$(_mise_pin nvim neovim)
          echo "pin: $spec"
          case "$spec" in aqua:*) ;; *) echo "neovim is not pinned under aqua:"; exit 1 ;; esac
          sed -i 's|^"aqua:neovim[^"]*" = .*|neovim = "latest"|' "$cfg"
          cat "$cfg"
          out=$(mise_install nvim neovim); echo "$out"
          grep -q 'repo pins' <<<"$out" || { echo "the stale entry was not noticed"; exit 1; }
          cat "$cfg"
          grep -qx "\"${spec%@*}\" = \"${spec#*@}\"" "$cfg" || { echo "global config is not the pin"; exit 1; }
          if grep -q '^neovim = ' "$cfg"; then echo "the old entry survived"; exit 1; fi
          out=$(mise_install nvim neovim); echo "$out"
          [ "$out" = "  ✅ nvim" ] || { echo "second run did more than confirm"; exit 1; }
          if make status nvim | grep 'repo pins'; then echo "make status still reports pin drift"; exit 1; fi
          echo "ok: converged to $spec, idempotent, and make status agrees"

      # Runtime, not a grep: a blink highlight reaches the terminal through nvim's
      # TUI and terminfo. Off wezterm, SGR 5 blinks a whole file.
      - name: nvim emits the alternate-font carrier only under wezterm
        # Once is enough: it tests altfont.lua's guard, not the platform.
        if: matrix.name == 'rhel 9'
        run: |
          set -uo pipefail
          fail=0
          command -v script >/dev/null 2>&1 || { echo "no script(1) here"; exit 0; }

          # SGR 5 exactly; a looser pattern also matches ESC[25m (blink off).
          carrier=$'\033\\[([0-9;]*;)?5m'

          # Fixture homes built by the real installer, as in the sgr.sh table.
          linked=$(mktemp -d)
          unlinked=$(mktemp -d)
          HOME="$linked" make link wezterm >/dev/null

          # The real binary: mise's shim under a fixture HOME would download neovim@latest.
          nvim_bin=$(mise which nvim 2>/dev/null || command -v nvim)
          echo "nvim under test: $nvim_bin"

          work=$(mktemp -d)
          printf 'local x = 1\n' > "$work/probe.lua"
          # Only altfont, on the repo's runtimepath: the full config clones every plugin.
          printf "vim.opt.runtimepath:prepend('%s/nvim')\nrequire('external.altfont').setup()\n" \
            "$PWD" > "$work/init.lua"

          # $1 home, $2 TERM_PROGRAM: true when the carrier reaches the tty.
          # Captured, then grepped: grep -q under pipefail SIGPIPEs script.
          emits() {
            local out
            out=$(HOME="$1" XDG_CONFIG_HOME= TERM_PROGRAM="$2" \
              script -qec "'$nvim_bin' --clean -u '$work/init.lua' -c 'redraw!' -c 'sleep 300m' -c 'q!' '$work/probe.lua'" \
                /dev/null 2>/dev/null) || true
            grep -aqE "$carrier" <<<"$out"
          }

          if emits "$linked" xterm; then
            echo "carrier emitted outside wezterm — this is literally blinking text"; fail=1
          fi
          if emits "$unlinked" WezTerm; then
            echo "carrier emitted in wezterm before the config was linked"; fail=1
          fi
          if ! emits "$linked" WezTerm; then
            echo "carrier missing on a linked wezterm tty"; fail=1
          fi

          # oil is buftype=acwrite; assert it is excluded.
          {
            printf "vim.opt.runtimepath:prepend('%s/nvim')\n" "$PWD"
            printf "require('external.altfont').setup()\n"
            printf "local b = vim.api.nvim_create_buf(true, false)\n"
            printf "vim.api.nvim_buf_set_name(b, 'oil:///tmp/')\n"
            printf "vim.bo[b].buftype = 'acwrite'\n"
            printf "vim.api.nvim_buf_set_lines(b, 0, -1, false, { 'oilrow' })\n"
            printf "vim.api.nvim_set_current_buf(b)\n"
          } > "$work/oil.lua"
          oil_out=$(HOME="$linked" XDG_CONFIG_HOME= TERM_PROGRAM=WezTerm \
             script -qec "'$nvim_bin' --clean -u '$work/oil.lua' -c 'redraw!' -c 'sleep 300m' -c 'qa!'" \
               /dev/null 2>/dev/null) || true
          if grep -aqE "$carrier" <<<"$oil_out"; then
            echo "carrier reached an oil-style buffer — it must be files only"; fail=1
          fi
          exit $fail

  # ── transitive advisories: what Dependabot cannot see ──────────────────────
  # GitHub's dependency graph cannot parse bun.lock, so it misses the packages
  # under the declared servers; `bun audit` resolves the installed tree.
  # package.json's override forces minimatch 11 over editorconfig's ~10.2.4
  # (GHSA-g3hv-75wg-m249); drop it once editorconfig declares ^11.
  audit:
    name: bun audit (transitive advisories)
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # setup-bun (pinned, Dependabot-watched), not a curl-piped installer. Its
      # version comes from mise.toml: another bun rewrites yarn.lock's header.
      - id: bun
        run: |
          set -euo pipefail
          # Fail rather than default: an empty bun-version means latest.
          v=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$v" ]; then
            echo "mise.toml declares no bun version; deps.conf must keep bun" \
                 "on the mise lane, or this job needs another pin." >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # --frozen-lockfile: audit the committed tree, not today's resolution.
      - name: Install the language servers
        run: bun install --cwd nvim/lsp-servers --frozen-lockfile

      # Fails on any advisory; an unfixable one gets --ignore=<id> with its reason.
      # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3) has no fixed release and needs a
      # hostile glob in the editor's own config. Drop it once braces ships a fix.
      - name: No known advisories in the language server tree
        run: bun audit --cwd nvim/lsp-servers --ignore=GHSA-vfj7-8cjw-p6xm

      # yarn.lock exists only for GitHub's dependency graph; it must match bun.lock.
      - name: yarn.lock matches bun.lock
        run: |
          set -euo pipefail
          bun install --cwd nvim/lsp-servers --yarn --frozen-lockfile
          if ! git diff --exit-code -- nvim/lsp-servers/yarn.lock; then
            echo
            echo "yarn.lock is stale. Regenerate it:"
            echo "    bun install --cwd nvim/lsp-servers --yarn"
            exit 1
          fi

      # Socket blocks malicious packages during install. CI only: it fails closed
      # without network, and `make install` must work offline.
      - name: Scan for malicious packages (Socket, CI only)
        run: |
          set -euo pipefail
          cat > nvim/lsp-servers/bunfig.toml <<'TOML'
          [install.security]
          scanner = "@socketsecurity/bun-security-scanner"
          TOML
          # Free mode — no SOCKET_API_KEY, no account, no secret to leak.
          rm -rf nvim/lsp-servers/node_modules
          bun install --cwd nvim/lsp-servers --frozen-lockfile
          rm -f nvim/lsp-servers/bunfig.toml

  # ── [wezterm] ──────────────────────────────────────────────────────────────
  wezterm:
    name: wezterm
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # wezterm/MIN_VERSION stays retired: a version floor cannot fail safe.
      - name: The font lane check asks what it can prove
        run: |
          set -uo pipefail
          bad=0
          [ -e wezterm/MIN_VERSION ] \
            && { echo "wezterm/MIN_VERSION is back -- a build stamp cannot answer this; see status_fonts"; bad=1; }
          # Comments stripped first: the file explains why the floor is gone.
          grep -v '^[[:space:]]*#' wezterm/deps.sh | grep -q 'MIN_VERSION' \
            && { echo "wezterm/deps.sh reads MIN_VERSION again"; bad=1; }
          grep -q '^status_fonts()' lib/status.sh \
            || { echo "lib/status.sh no longer defines status_fonts"; bad=1; }
          grep -q 'status_fonts "\${scope\[@\]}"' lib/status.sh \
            || { echo "status_all no longer calls status_fonts with its scope"; bad=1; }
          # Only the provable half may count as drift; the carrier is unreadable off a wezterm tty.
          grep -q '_drift_font' lib/status.sh \
            || { echo "status_fonts records no drift at all -- the provable half should"; bad=1; }
          [ $bad -eq 0 ] && echo "ok: no floor, and status_fonts asks only answerable questions"
          exit $bad

      # The committed .ttf files must exist while the config names them; a
      # missing one silently falls back to another font.
      - name: Science Gothic Mono ships with the config that names it
        run: |
          fail=0
          for f in wezterm/fonts/ScienceGothicMono.ttf wezterm/fonts/ScienceGothicMono-Bold.ttf; do
            [ -s "$f" ] || { echo "missing or empty: $f"; fail=1; }
          done
          grep -q 'wezterm/fonts' deps.conf || { echo "deps.conf does not link wezterm/fonts"; fail=1; }
          # Any blink rate but exactly 0 animates.
          grep -q 'text_blink_rate_rapid = 0' wezterm/wezterm.lua \
            || { echo "wezterm.lua: SGR 6 would blink without text_blink_rate_rapid = 0"; fail=1; }
          grep -q 'text_blink_rate = 0' wezterm/wezterm.lua \
            || { echo "wezterm.lua: SGR 5 would blink without text_blink_rate = 0"; fail=1; }
          grep -q 'Science Gothic Mono' wezterm/wezterm.lua \
            || { echo "wezterm.lua: no font_rule for the SGR 6 carrier"; fail=1; }

          # Four rules, {bold, regular} x {italic, upright}: a missing one flattens
          # that style. Comments stripped first, since wezterm.lua quotes the pattern.
          n=$(grep -vE '^[[:space:]]*--' wezterm/wezterm.lua | grep -cE "blink = ['\"]Slow['\"]")
          [ "$n" -eq 4 ] \
            || { echo "wezterm.lua: expected 4 SGR 5 font_rules (bold/regular x italic/upright), found $n"; fail=1; }

          # deps.sh names families and roest1/fonts' install.sh fetches them, so
          # every name in FONTS has to be one its catalogue can install. A
          # misspelled family would otherwise only warn, on a user's machine.
          wanted=$(sed -n '/^FONTS=(/,/^)/p' wezterm/deps.sh | grep -oE "'[^']+'" | tr -d "'")
          [ -n "$wanted" ] || { echo "wezterm/deps.sh has no FONTS list"; fail=1; }
          installable=$(wezterm/fonts/install.sh)
          while IFS= read -r fam; do
            grep -qFx "  $fam" <<<"$installable" \
              || { echo "roest1/fonts' catalogue cannot install '$fam'"; fail=1; }
          done <<<"$wanted"

          # Every family wezterm.lua names (DEFAULT_FONTS and window_frame) must be
          # installed by deps.sh: a fallback that resolves is silent.
          {
            sed -n '/^local DEFAULT_FONTS = {/,/^}/p' wezterm/wezterm.lua
            sed -n '/config.window_frame = {/,/^\t}/p' wezterm/wezterm.lua
          } | grep -oE '"[^"]+"' | tr -d '"' | sort -u \
          | while IFS= read -r fam; do
              case "$fam" in
                # wezterm bundles these -- requiring an installer would be wrong.
                'JetBrains Mono'|'Noto Color Emoji'|'Symbols Nerd Font Mono'|Roboto) continue ;;
                # weight/style values caught by the same quote scrape.
                Bold|Regular|Medium|Italic|Normal|Light|Thin) continue ;;
                # Lane keys like ["nvim.ui"], not families; no family has a period.
                *.*) continue ;;
                '') continue ;;
              esac
              grep -qFx "$fam" <<<"$wanted" \
                || { echo "wezterm/deps.sh does not install '$fam'"; exit 1; }
              echo "  ok wezterm/deps.sh installs $fam"
            done || fail=1

          # The writer half: without it nothing emits into the lane.
          grep -q "require('external.altfont')" nvim/init.lua \
            || { echo "nvim/init.lua does not load external.altfont"; fail=1; }
          exit $fail

      # Named, not counted: a count misses a swap.
      - name: '[wezterm] still declares its links'
        run: |
          set -euo pipefail
          source lib/manifest.sh
          links=$(manifest_lines link wezterm | awk -F'\t' '{print $2}')
          bad=0
          # the config itself
          grep -qx 'wezterm/wezterm.lua' <<<"$links" || {
            echo "[wezterm] no longer links wezterm.lua"; bad=1; }
          # the fonts: font_dirs reads them, and lib/sgr.sh treats this link as "config is live"
          grep -qx 'wezterm/fonts' <<<"$links" || {
            echo "[wezterm] no longer links the fonts directory"; bad=1; }
          # the themes: wezterm.lua reads the picked one from beside itself, and
          # `font` lists the linked directory for what there is to pick
          grep -qx 'wezterm/themes' <<<"$links" || {
            echo "[wezterm] no longer links the themes directory"; bad=1; }
          [ $bad -eq 0 ] && echo "ok: [wezterm] links its config, fonts and themes"
          exit $bad

  # ── the Rust TUIs ──────────────────────────────────────────────────────────
  # fmt and clippy are gates: a warning nobody fails on is a warning nobody reads.
  tui:
    name: tui (rust)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        working-directory: tui
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: tui
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: tui
        run: cargo test --locked
      - name: Release build
        working-directory: tui
        run: cargo build --release --locked
      # The submodules run their own fmt and clippy; these prove each pinned
      # commit builds and passes its tests here, which is what a bump changes.
      # font's prompt-specimen test reads the ps1 submodule two levels up.
      - name: font builds and passes its tests at the pinned commit
        working-directory: tui/font
        run: cargo test --locked && cargo build --release --locked
      - name: github builds and passes its tests at the pinned commit
        working-directory: tui/github
        run: cargo test --locked && cargo build --release --locked

      # The same three-condition guard as lib/sgr.sh: off a linked wezterm tty,
      # SGR 6 and SGR 5 blink, and in a pipe they are garbage.
      - name: font show carries escapes only on a linked wezterm tty
        run: |
          fail=0
          esc=$'\033['
          carrier=$'\033[6'   # SGR 6, the `make` output lane
          slow=$'\033[5m'     # SGR 5, the nvim editor lane
          F=tui/font/target/release/font

          # A pipe is the case CI itself creates.
          if "$F" show | grep -qF "$esc"; then
            echo "font show leaked escapes into a pipe"; fail=1
          fi

          if ! command -v script >/dev/null 2>&1; then
            echo "no script(1) here; the tty rows were skipped"; exit $fail
          fi

          # Fixture homes, as in the make help truth table.
          unlinked=$(mktemp -d)
          linked=$(mktemp -d)
          HOME="$linked" make link wezterm >/dev/null

          on_tty() {
            HOME="$1" XDG_CONFIG_HOME= TERM_PROGRAM="$2" \
              script -qec "$PWD/$F show" /dev/null | grep -qF "$3"
          }

          if on_tty "$unlinked" WezTerm "$esc"; then
            echo "escapes on a wezterm tty before the config was linked"; fail=1
          fi
          if on_tty "$linked" xterm "$esc"; then
            echo "escapes on a non-wezterm tty -- SGR 6 there is rapid blink"; fail=1
          fi
          # Both lanes, by their exact attribute.
          if ! on_tty "$linked" WezTerm "$carrier"; then
            echo "SGR 6 missing on a linked wezterm tty"; fail=1
          fi
          if ! on_tty "$linked" WezTerm "$slow"; then
            echo "SGR 5 missing on a linked wezterm tty"; fail=1
          fi
          exit $fail

      # `font` on crates.io is someone else's crate, and cargo installs by name.
      - name: The tui section installs from a path, not from crates.io
        run: |
          source lib/manifest.sh
          fail=0
          while IFS=$'\t' read -r _section provider cmd _; do
            [ "$provider" = manual ] || { echo "[tui] $cmd is '$provider'; must be manual"; fail=1; }
          done < <(manifest_lines tool tui)
          grep -q -- '--path' tui/deps.sh \
            || { echo "tui/deps.sh does not install from a local path"; fail=1; }
          exit $fail

      # lib/pkg.sh is the only place that installs a tool, rustup included.
      - name: The tui section bootstraps cargo through lib/pkg.sh
        run: |
          fail=0
          grep -q '^ensure_cargo()' lib/pkg.sh \
            || { echo "lib/pkg.sh lost ensure_cargo"; fail=1; }
          grep -q 'ensure_cargo' tui/deps.sh \
            || { echo "tui/deps.sh does not require cargo"; fail=1; }
          if grep -q 'rustup.rs' tui/deps.sh; then
            echo "tui/deps.sh has its own rustup bootstrap; use ensure_cargo"
            fail=1
          fi
          source lib/manifest.sh
          manifest_lines tool tui | cut -f3 | grep -qx cargo \
            || { echo "[tui] does not declare cargo"; fail=1; }
          exit $fail

      # A bash function named after a tui binary would win over PATH. Derived
      # from [tui]'s tool lines, not a list: tui/github is a submodule outside
      # the workspace, so the members no longer name every binary.

      - name: No bash function shadows a tui binary
        run: |
          fail=0
          source lib/manifest.sh
          bins=$(manifest_lines tool tui | cut -f3 | grep -vx cargo)
          [ -n "$bins" ] || { echo "could not read [tui]'s tools from deps.conf"; exit 1; }
          echo "tui binaries: $(echo "$bins" | tr '\n' ' ')"
          for b in $bins; do
            if grep -qE "^$b\(\) \{" bash/*; then
              echo "a bash function named '$b' would shadow the tui binary"; fail=1
            fi
          done
          exit $fail

  # ── [claude] ───────────────────────────────────────────────────────────────
  claude:
    name: claude
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Git sees the defaults whatever a machine set, personal keys never reach
      # this public repo, other keys survive, and the committed file is already
      # the filter's output.
      - name: The claude settings filter swaps preferences for the defaults
        run: |
          set -euo pipefail
          want=$(jq -S '{model, modelSettings}' claude/model-defaults.json)
          out=$(printf '%s' '{"model":"sonnet","effortLevel":"low","modelSettings":{"claude-opus-5-5":{"effortLevel":"low"},"x":{}},"theme":"dark","skipAutoPermissionPrompt":true,"attribution":{"commit":""},"permissions":{"defaultMode":"auto","deny":["Read(~/.ssh/**)"]}}' \
                | tools/clean-claude-settings.sh)
          echo "$out"
          [ "$(jq -S '{model, modelSettings}' <<<"$out")" = "$want" ] \
            || { echo "filter let this machine's model/effort through"; exit 1; }
          jq -e 'has("effortLevel") | not' <<<"$out" >/dev/null \
            || { echo "filter kept the legacy top-level effortLevel"; exit 1; }
          jq -e '(has("theme") or has("skipAutoPermissionPrompt") or (.permissions | has("defaultMode"))) | not' <<<"$out" >/dev/null \
            || { echo "filter let a personal key into the public repo"; exit 1; }
          jq -e '.attribution == {"commit":""} and .permissions == {"deny":["Read(~/.ssh/**)"]}' <<<"$out" >/dev/null \
            || { echo "filter changed configuration it should keep"; exit 1; }

          committed=$(git show HEAD:claude/settings.json)
          [ "$(tools/clean-claude-settings.sh <<<"$committed")" = "$(jq -S . <<<"$committed")" ] || {
            echo "claude/settings.json is not what the filter produces —"
            echo "re-stage it: git add --renormalize claude/settings.json"; exit 1; }
          echo "ok: defaults committed, local preferences never reach git"

      # A filtered file differs in size from its blob, so git calls it modified
      # without running the filter. The refresh clears that only when the filtered
      # file equals the index; the dangerous direction is hiding a real change.
      - name: The settings refresh clears only the FALSE modified flag
        run: |
          set -euo pipefail
          # Link ~/.claude/settings.json into the clone, as `make link` would.
          mkdir -p "$HOME/.claude"
          ln -sfn "$PWD/claude/settings.json" "$HOME/.claude/settings.json"
          git add claude/settings.json          # baseline: stat recorded

          # 0. No filter registered: do nothing, or `git add` stages this machine's model.
          jq '.model = "claude-haiku-5-5"' claude/settings.json > t && mv t claude/settings.json
          tools/refresh-claude-settings.sh
          [ -z "$(git diff --cached --name-only claude/settings.json)" ] \
            || { echo "FAIL: refresh staged the raw file with no filter registered"; exit 1; }
          git checkout -- claude/settings.json

          # From here on, the filter as claude/deps.sh registers it.
          git config filter.claude-settings.clean "$PWD/tools/clean-claude-settings.sh"
          git add claude/settings.json

          # 1. A model change is volatile: the flag clears and nothing is staged.
          jq '.model = "claude-haiku-5-5"' claude/settings.json > t && mv t claude/settings.json
          [ -n "$(git status --porcelain claude/settings.json)" ] \
            || { echo "FAIL: a size change did not go stat-dirty — premise gone"; exit 1; }
          tools/refresh-claude-settings.sh
          [ -z "$(git status --porcelain claude/settings.json)" ] \
            || { echo "FAIL: refresh left the false modified flag in place"; exit 1; }
          [ -z "$(git diff --cached --name-only claude/settings.json)" ] \
            || { echo "FAIL: refresh staged content instead of just the stat"; exit 1; }

          # 2. A deny-rule change is real and must survive (theme is filtered out).
          jq '.permissions.deny += ["Read(~/x)"]' claude/settings.json > t && mv t claude/settings.json
          tools/refresh-claude-settings.sh
          [ -n "$(git status --porcelain claude/settings.json)" ] \
            || { echo "FAIL: refresh hid a real settings change"; exit 1; }
          git checkout -- claude/settings.json
          echo "ok: false flag cleared, real change left visible"

      # Named, not counted. SessionEnd does the work; SessionStart catches killed sessions.
      - name: Both refresh hooks are declared
        run: |
          set -euo pipefail
          for ev in SessionStart SessionEnd; do
            jq -e --arg ev "$ev" \
              '.hooks[$ev][0].hooks[0].command | test("refresh-claude-settings")' \
              claude/settings.json >/dev/null \
              || { echo "FAIL: $ev no longer calls tools/refresh-claude-settings.sh"; exit 1; }
          done
          echo "ok: SessionStart and SessionEnd both refresh the stat"

  # ── [git-autofetch] ────────────────────────────────────────────────────────
  git-autofetch:
    name: git-autofetch
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Fetch only: HEAD never moves, a clone behind is named, a busy one is skipped.
      - name: git-autofetch fetches and reports, never pulls
        run: |
          set -euo pipefail
          t=$(mktemp -d); export GIT_CONFIG_GLOBAL=$t/gitconfig  # safe to run on a real machine
          git config --global user.name ci; git config --global user.email ci@example.invalid
          # Run from a local clone: the script always fetches its own repo, and
          # this checkout's remote is not one the test should depend on.
          git clone -q "$PWD" "$t/core" 2>/dev/null; G=$t/core/git-autofetch/git-autofetch
          git init -q --bare -b main "$t/o.git"
          git clone -q "$t/o.git" "$t/a" 2>/dev/null
          git -C "$t/a" commit -q --allow-empty -m one && git -C "$t/a" push -q origin main
          git clone -q "$t/o.git" "$t/p"
          git -C "$t/a" commit -q --allow-empty -m two && git -C "$t/a" push -q
          printf 'p  file://%s/o.git  %s/p\n' "$t" "$t" > "$t/plugins"
          export DOTFILES_PLUGINS_FILE=$t/plugins GIT_AUTOFETCH_ROOT=$t/none
          before=$(git -C "$t/p" rev-parse HEAD)
          [ -z "$($G --report)" ] || { echo "reported before anything was fetched"; exit 1; }
          $G
          [ "$(git -C "$t/p" rev-parse HEAD)" = "$before" ] || { echo "the fetch moved HEAD"; exit 1; }
          $G --report | grep -q "$t/p is 1 commit(s) behind origin/main" \
            || { echo "a plugin one commit behind was not reported"; $G --report; exit 1; }
          touch "$t/p/.git/MERGE_HEAD"
          $G --dry-run | grep -q "skip  $t/p (MERGE_HEAD in progress)" \
            || { echo "a repo mid-merge was not skipped"; exit 1; }
          echo "ok: fetched without moving HEAD, reported the plugin, skipped the busy repo"

  # ── The one required check ─────────────────────────────────────────────────
  # main-ci requires only this job, so adding or renaming a job cannot desync
  # the ruleset. `if: always()`: a skipped required check counts as passing.
  ci-ok:
    name: ci ok
    if: always()
    needs: [changes, shellcheck, engine, link-only, install, bash, uv, nvim, nvim-floor, audit, wezterm, tui, claude, git-autofetch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A job missing from needs would run and gate nothing.
      - name: Every job is in needs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          declared=$(awk '/^jobs:/ { j = 1; next }
                          j && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ { sub(/^  /, ""); sub(/:.*/, ""); print }' \
                       .github/workflows/ci.yml | grep -vx 'ci-ok' | sort)
          needed=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          if [[ "$declared" != "$needed" ]]; then
            echo "ci-ok's needs differ from the jobs in ci.yml (< missing from needs, > not a job):"
            diff <(echo "$declared") <(echo "$needed") || true
            exit 1
          fi
          echo "ok: needs lists all $(wc -l <<<"$declared") jobs"

      # A skip passes only when `changes` succeeded and said docs-only.
      - name: Every job succeeded, or was skipped for a docs-only PR
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          if ! jq -e --arg full "$FULL" 'to_entries | all(
                 .value.result == "success"
                 or ($full == "false" and .value.result == "skipped"
                     and (.key | IN("changes", "shellcheck") | not)))' <<<"$NEEDS" >/dev/null; then
            echo "not every job succeeded (full=${FULL:-unknown})"
            exit 1
          fi
          echo "ok: full=$FULL"
