name: portability

# The point of this workflow is to make "clone and get running on any platform"
# provable rather than claimed. The previous Makefile promised WSL support in its
# README while `make deps` hard-exited on apt — a bug that survived because
# nothing ever ran it on Ubuntu.
#
# Every job is a fresh machine, which is the only honest test of a bootstrap.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # For the `audit` job below: an advisory published on a Tuesday is not
  # discovered by a workflow that only runs when someone pushes. A dotfiles repo
  # can sit untouched for a month, which is exactly how long the gap would be.
  # GitHub only runs schedules on the default branch, so this starts working
  # once this lands on main.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # No file list here. tools/lint.sh holds the one definition of what this
      # repo lints and how strictly, and .githooks/pre-commit calls that same
      # script with the staged files. A list in both places is a list that
      # drifts — the same reason .githooks/secret-patterns is a shared file
      # rather than a pattern copied into the step below.
      #
      # With no arguments it sweeps the whole tree, which is the half a hook
      # cannot do: hooks are skippable with --no-verify, absent until
      # install.sh has run once, and never run for a commit made through the
      # web UI. A whole-tree sweep also catches a file nobody touched failing
      # because shellcheck itself gained a rule.
      - name: Lint shell sources
        run: ./tools/lint.sh

      # The remote half of the secret guard. .githooks/pre-commit is the local
      # half and shares this pattern file, but a hook is bypassable with
      # --no-verify and absent entirely until install.sh has run once. This
      # catches what got through, before it reaches main.
      #
      # It cannot un-publish a secret that is already pushed — that is why the
      # real defence is keeping those files outside the work tree, where git
      # cannot see them at all.
      - name: No secret or machine-local files are tracked
        run: |
          patterns=$(grep -vE '^\s*(#|$)' .githooks/secret-patterns | paste -sd '|' -)
          echo "patterns: $patterns"
          if bad=$(git ls-files | grep -E "$patterns"); then
            echo ""
            echo "tracked files matching .githooks/secret-patterns:"
            echo "$bad"
            exit 1
          fi
          echo "ok: nothing matching is tracked"

      # Runs here rather than on the Windows runner so it fails in seconds,
      # but the reason is pure Windows PowerShell 5.1.
      - name: PowerShell sources are ASCII-only
        run: |
          # 5.1 reads a .ps1 with no BOM as ANSI (cp1252), not UTF-8. An em
          # dash (E2 80 94) then decodes as three cp1252 characters ending in
          # 0x94 — which in cp1252 is RIGHT DOUBLE QUOTATION MARK, and
          # PowerShell treats that as a string delimiter. One em dash inside a
          # COMMENT opened a string that swallowed the rest of the file, and
          # the reported error was a bogus "invalid variable reference" 200
          # lines further down.
          #
          # A UTF-8 BOM also fixes it. ASCII-only is the fix that survives an
          # editor helpfully stripping the BOM.
          if bad=$(grep -rnP '[^\x00-\x7F]' --include='*.ps1' . 2>/dev/null); then
            echo "non-ASCII in PowerShell sources:"
            echo "$bad"
            echo ""
            echo "Windows PowerShell 5.1 mis-parses these. Use ASCII punctuation."
            exit 1
          fi
          echo "ok: all .ps1 sources are ASCII"

  # ── Manifest sanity ────────────────────────────────────────────────────────
  # Cheap guard against a typo in deps.conf taking down every other job.
  manifest:
    name: manifest parses
    runs-on: ubuntu-latest
    steps:
      # Full history: the alias-to-function check below compares against the
      # merge base, which a shallow clone doesn't have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Regression guard: ARGS was once a blocklist, so any goal not in it got a
      # stub rule that silently overrode the real target — `make help` printed
      # "overriding recipe for target 'help'" and ran the wrong recipe.
      - name: No target overrides its own recipe
        run: |
          fail=0
          for t in help sections status check test sync link lint; do
            if make $t 2>&1 | grep -qE "warning: (overriding|ignoring old) recipe"; then
              echo "make $t triggers a recipe override"; fail=1
            fi
          done
          # section args must still be accepted, and still not warn
          if make check nvim 2>&1 | grep -qE "warning:"; then
            echo "make check nvim warns"; fail=1
          fi
          exit $fail

      - name: Sections are discoverable
        run: |
          source lib/manifest.sh
          sections=$(manifest_sections | tr '\n' ' ')
          echo "sections: $sections"
          for want in bash nvim wezterm; do
            echo "$sections" | grep -qw "$want" || { echo "missing section: $want"; exit 1; }
          done
      - name: Every tool line has a known provider
        run: |
          source lib/manifest.sh
          bad=0
          while IFS=$'\t' read -r section provider cmd pkg; do
            for p in ${provider//||/ }; do
              case "$p" in
                pkg|uv|cargo|mise|manual) ;;
                # No windows entry point reads this file any more, so winget
                # here would install nothing and report nothing. Name it
                # explicitly rather than letting it fall into "unknown".
                winget) echo "[$section] winget is not installable from this manifest — declare it in windows/install.ps1"; bad=1 ;;
                *) echo "[$section] unknown provider '$p' for $cmd"; bad=1 ;;
              esac
            done
          done < <(manifest_lines tool)
          exit $bad
      - name: Every link source exists in the repo
        run: |
          source lib/manifest.sh
          bad=0
          while IFS=$'\t' read -r section src dest; do
            [ -e "$src" ] || { echo "[$section] missing link source: $src"; bad=1; }
          done < <(manifest_lines link)
          # windows/install.ps1 declares its own payload, so manifest_lines
          # cannot see it. Read the Source values straight out of its $Links
          # table: without this, deleting wezterm-windows.lua would only be
          # caught on the windows runner, or by whoever next ran the bootstrap.
          while read -r src; do
            [ -n "$src" ] || continue
            [ -e "$src" ] || { echo "[windows] missing link source: $src"; bad=1; }
          done < <(grep -oP "Source\s*=\s*'\K[^']+" windows/install.ps1 | tr '\\' '/')
          exit $bad

      # The reverse of the check above, and the direction that breaks new
      # machines rather than CI. "Every declared link exists" catches a deleted
      # file; it cannot catch a file that exists, is sourced by bashrc, and was
      # never declared — that install links bashrc, bashrc sources a path that
      # was never created, and every interactive shell reports it.
      #
      # Only UNGUARDED sources are required to be declared. `~/.bash_local` and
      # `~/.bash_password_commands` are deliberately absent from the manifest
      # (they are machine-local and live outside the work tree), and they are
      # sourced behind a `[[ -f ... ]]` guard, which is exactly what makes them
      # distinguishable here.
      - name: Every unguarded source in bashrc is declared
        run: |
          source lib/manifest.sh
          declared=$(manifest_lines link | cut -f3 | xargs -r -n1 basename | sort -u)
          bad=0
          while read -r path; do
            base=$(basename "$path")
            echo "$declared" | grep -qx "$base" || {
              echo "bashrc sources $path with no link line in deps.conf"; bad=1; }
          done < <(grep -oE '^source[[:space:]]+~/\.[A-Za-z0-9_.-]+' bash/bashrc | awk '{print $2}')
          exit $bad

      # A stray line that lost its leading `#` parses fine and only shows up as
      # noise at runtime — bash_github_tui once ran `-` and `q` as commands from
      # inside a comment block, printing three "command not found" errors on
      # every interactive shell. `bash -n` cannot see this; only running it can.
      - name: Bash configs source without emitting output
        run: |
          bad=0
          for f in bash/bash_theme bash/bash_productivity bash/bash_git \
                   bash/bash_github bash/bash_github_tui; do
            # expand_aliases because that is how these files are really read.
            # Without it bash skips alias expansion entirely, which is a
            # different parser and hides a whole class of failure — see the
            # alias-to-function check below.
            out=$(bash -c "shopt -s expand_aliases; source $f" 2>&1)
            [ -z "$out" ] || { echo "$f is noisy when sourced:"; echo "$out"; bad=1; }
          done
          exit $bad

      # `reload` re-sources these files into a LIVE shell, so a name that used
      # to be an alias and is now a function breaks on upgrade: bash expands the
      # stale alias while parsing and `f() {` becomes a syntax error, reported
      # against a line with nothing wrong on it.
      #
      # This actually happened. `gb` was `alias gb='git branch --sort=...'`; it
      # became a function, and the first `reload` after pulling failed with
      # "syntax error near unexpected token `('" at `gb() {`. Nothing caught it:
      # `bash -n` and a non-interactive `source` do not expand aliases, so the
      # parse that fails is one CI never ran.
      #
      # The fix is an `unalias` before the definition — the same guard `bashrc`
      # already uses for `alert`, where the stale alias comes from Ubuntu's
      # default bashrc instead of from our own history. This asserts the guard
      # exists for every name that made that transition.
      - name: Aliases turned into functions are unaliased first
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null) || base=""
          if [ -z "$base" ]; then echo "no merge base; skipping"; exit 0; fi

          old_aliases=$(for f in $(git ls-tree -r --name-only "$base" -- bash/); do
                          git show "$base:$f" 2>/dev/null
                        done | grep -hE '^[[:space:]]*alias ' | sed 's/.*alias //;s/=.*//' | sort -u)
          bad=0
          for fn in $(grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' bash/bash_* | tr -d '()' | sort -u); do
            echo "$old_aliases" | grep -qx -- "$fn" || continue
            grep -qE "^[[:space:]]*unalias .*\b${fn}\b" bash/bash_* || {
              echo "'$fn' was an alias and is now a function, with no 'unalias $fn' guard"
              echo "  a reload in a shell running the older config will fail to parse it"
              bad=1
            }
          done
          exit $bad

      # gh-tui is the single public entry to the interactive layer. The five
      # screens behind it (gpr, gha-ui, ghsecrets, ghbranch, ghenv) used to sit
      # next to it as top-level commands, which left six names competing for
      # one job and meant the hub had to be discovered rather than being the
      # obvious door.
      #
      # This also keeps the prefix rule true: `__` is a helper shared across
      # files, `_` is private to this one. Every screen is now `_`-prefixed,
      # which is what stops the help check above from demanding an `h` entry
      # for something you cannot type.
      - name: bash_github_tui exposes only gh-tui
        run: |
          public=$(grep -oE '^[a-zA-Z][a-zA-Z0-9_-]*\(\)' bash/bash_github_tui | tr -d '()')
          if [ "$public" != "gh-tui" ]; then
            echo "bash_github_tui must define exactly one public function (gh-tui); found:"
            echo "$public"
            exit 1
          fi
          # Every double-underscore name it uses must come from another file.
          bad=0
          for n in $(grep -ohE '__[a-z_]+' bash/bash_github_tui | sort -u); do
            if grep -q "^$n()" bash/bash_github_tui; then
              echo "$n is private to bash_github_tui but uses the shared '__' prefix"; bad=1
            fi
          done
          exit $bad

      # The [bash] file split is a rule, not a preference: bash_github holds
      # plain gh commands and shared helpers, bash_github_tui holds everything
      # interactive. Keeping fzf on one side of that line is what lets the TUI
      # be deleted or replaced as a unit. `command -v fzf` is a probe, not an
      # invocation, so it does not count.
      # Comment lines are skipped: this file's own header documents the rule and
      # would otherwise match the pattern that enforces it.
      - name: bash_github invokes no fzf
        run: |
          awk '
            /^[[:space:]]*#/ { next }
            /\| *fzf|^[[:space:]]*fzf / { print FILENAME ":" FNR ": " $0; found = 1 }
            END { exit found ? 1 : 0 }
          ' bash/bash_github || {
            echo "bash_github must not invoke fzf — that belongs in bash_github_tui"
            exit 1
          }

      # The nvim-like menu contract (q and - go back, --disabled so plain keys
      # are commands) is defined once in __fzf_menu. It was previously spelled
      # out at 18 call sites as identical strings kept identical by hand; a
      # screen that hand-rolls it again is how the next one drifts. The wrapper
      # itself is the sole legitimate --disabled, so it is the only exemption.
      - name: fzf menus go through __fzf_menu
        run: |
          bad=0
          for f in bash/bash_git bash/bash_github bash/bash_github_tui; do
            awk -v file="$f" '
              /^[[:space:]]*#/ { next }
              /fzf .*--disabled|--disabled.*fzf/ { print file ":" FNR ": " $0; found = 1 }
              END { exit found ? 1 : 0 }
            ' "$f" || bad=1
          done
          if [ "$bad" -ne 0 ]; then
            echo "hand-rolled fzf menu — use __fzf_menu (bash_productivity)"
            exit 1
          fi
          grep -q '^__fzf_menu()' bash/bash_productivity || {
            echo "__fzf_menu is missing from bash_productivity"; exit 1; }

      # `h` is hand-maintained — the comment above it used to claim it read from
      # the file's own comments and was "always in sync", which was never true.
      # This is the check that makes the honest version safe: every public
      # command must be named somewhere in h's body, and h must not name a
      # command that no longer exists.
      #
      # Both directions had already failed in practice. h advertised `gh-tui`
      # while the function was called `gh-ui`, so the documented command did not
      # exist and the real one was undocumented; and h kept a full help page for
      # `lines` after the function was deleted.
      - name: Every command is documented in h, and h documents nothing missing
        run: |
          # Each `run:` is a fresh shell, so the parser has to be sourced here
          # even though earlier steps in this job already did it.
          source lib/manifest.sh

          defined=$( { grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         bash/bash_github_tui | tr -d '()'
                       grep -hE '^alias ' bash/bash_productivity bash/bash_git \
                         bash/bash_github_tui | sed 's/alias //;s/=.*//'
                     } | grep -vE '^_' | sort -u )
          hbody=$(sed -n '/^h() {/,/^}/p' bash/bash_productivity)
          bad=0
          for c in $defined; do
            echo "$hbody" | grep -qw -- "$c" || { echo "undocumented in h: $c"; bad=1; }
          done

          # ...and the reverse: h must not document something that no longer
          # exists anywhere.
          #
          # This is a STATIC check against the sources, not a runtime one.
          # Sourcing the configs and asking `type -t` looks more direct and is
          # wrong: half these commands are defined behind `command -v` guards
          # so the shell degrades gracefully on a machine without eza or bat,
          # which means a runner with neither legitimately has no `lt` and no
          # `catn`. Testing runtime presence would make this check assert that
          # the runner has every optional tool installed — a different, false
          # claim. What we actually want to know is whether the definition is
          # still in the repo.
          #
          # A documented command is legitimate if the configs define it (as a
          # function or an alias, at any indentation — the tool-dependent
          # aliases are nested inside their guards) or if deps.conf declares it
          # as a tool, which covers the external commands h explains, like fzf.
          defines=$( { grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         bash/bash_github_tui | tr -d '()'
                       grep -hE '^[[:space:]]*alias ' \
                         bash/bash_productivity bash/bash_git bash/bash_github_tui \
                         | sed 's/.*alias //;s/=.*//'
                       manifest_lines tool | cut -f3
                     } | sort -u )

          # Scoped to the QUICK REFERENCE (the no-args heredoc), not the whole
          # function: the detailed pages are prose, and an indented sentence
          # starting with a lowercase word is indistinguishable from a command
          # column entry. Two spaces after the name separates the command
          # column from a sentence.
          quickref=$(sed -n '/^h() {/,/^    return$/p' bash/bash_productivity)
          listed=$(echo "$quickref" | sed -n 's/^    \([a-z][a-z0-9-]*\)  \+.*/\1/p' | sort -u)
          for c in $listed; do
            echo "$defines" | grep -qx -- "$c" \
              || { echo "h documents '$c', which nothing defines or declares"; bad=1; }
          done
          exit $bad

      # mise.toml is generated from deps.conf and mise.lock is generated from
      # mise.toml, so all three can disagree. Before this existed, lib/pkg.sh
      # installed `@latest` and the resolved versions lived only in
      # ~/.config/mise/config.toml — untracked, machine-local, and different on
      # every box provisioned on a different day.
      #
      # Registry-free on purpose: this runner has no mise, and the question is
      # whether the two files describe the same tool set, not what the current
      # upstream version is.
      - name: mise.toml and mise.lock match deps.conf
        run: ./tools/gen-mise.sh --check

      # A generator whose output the parser rejects is worse than no generator,
      # so assert the round trip rather than just that it runs.
      - name: "tools/adopt.sh emits lines the parser accepts"
        run: |
          ./tools/adopt.sh git make tar > /tmp/adopt.txt
          grep -q '^tool ' /tmp/adopt.txt || { echo "adopt emitted no tool lines"; cat /tmp/adopt.txt; exit 1; }
          mkdir -p /tmp/rt
          { echo "[roundtrip]"; grep '^tool ' /tmp/adopt.txt; } > /tmp/rt/deps.conf
          source lib/manifest.sh
          n_in=$(grep -c '^tool ' /tmp/rt/deps.conf)
          n_out=$(MANIFEST_FILE=/tmp/rt/deps.conf manifest_lines tool | wc -l)
          echo "generated $n_in line(s), parsed back $n_out"
          [ "$n_in" -eq "$n_out" ] || { echo "round trip lost lines"; exit 1; }

      - name: Links report in sync right after `make link`
        run: |
          make link
          source lib/status.sh
          # Only the link half — tools legitimately aren't installed in this job.
          status_links
          if [ "$STATUS_DRIFT" -ne 0 ]; then
            echo "links drifted immediately after make link"; exit 1
          fi

  # ── Links only: the locked-down-machine path ───────────────────────────────
  # No sudo, no network, nothing installed. Must work everywhere.
  link-only:
    # The name is a stable literal, NOT ${{ matrix.os }}. Required status checks
    # match by exact name: if the name embedded the runner label and that label
    # ever changed (pinning to ubuntu-24.04, GitHub retiring a label), the
    # required check would never report — and a check that never reports doesn't
    # fail a PR, it blocks it indefinitely waiting for a status that won't come.
    name: link only (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: make link
        run: make link
      - name: Config is symlinked into the repo
        run: |
          test -L "$HOME/.bashrc"
          test -L "$HOME/.config/nvim"
          test -L "$HOME/.config/wezterm/wezterm.lua"
      - name: Idempotent — second run changes nothing
        run: |
          make link | tee /tmp/second.txt
          if grep -qE "linked |backed up " /tmp/second.txt; then
            echo "second run was not idempotent"; exit 1
          fi

      # prune_orphans deletes files, so its blast radius is tested rather than
      # reasoned about. The two negative cases are the ones that matter: a dead
      # link this repo did not create, and a live one.
      - name: Orphan pruning removes only this repo's dead links
        run: |
          ln -s "$PWD/bash/retired_name" "$HOME/.bash_orphan"       # dead, ours
          ln -s /nonexistent/elsewhere "$HOME/.unrelated_dead_link" # dead, not ours
          test -L "$HOME/.bashrc"                                   # live, ours

          make link

          fail=0
          if [ -L "$HOME/.bash_orphan" ]; then
            echo "FAIL: dead link into the repo was not pruned"; fail=1
          fi
          if [ ! -L "$HOME/.unrelated_dead_link" ]; then
            echo "FAIL: pruned a dead link that does not point into this repo"; fail=1
          fi
          if [ ! -L "$HOME/.bashrc" ]; then
            echo "FAIL: pruned a link whose target still exists"; fail=1
          fi
          rm -f "$HOME/.unrelated_dead_link"
          [ $fail -eq 0 ] && echo "ok: pruned exactly the repo's own dead link"
          exit $fail

  # ── Full install per platform ──────────────────────────────────────────────
  install:
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu / apt
            runs-on: ubuntu-latest
            container: ''
          - name: macos / brew
            runs-on: macos-latest
            container: ''
          - name: fedora / dnf
            runs-on: ubuntu-latest
            container: fedora:latest
    steps:
      - name: Bootstrap container prerequisites
        if: matrix.container != ''
        run: dnf install -y git make sudo findutils

      - uses: actions/checkout@v7

      - name: Install the bash section
        run: make install bash

      - name: Verify the bash section
        run: |
          # `make check` exits 0 even when tools are missing, so the summary
          # always prints for a human. Assert on the output instead.
          make check bash | tee /tmp/check.txt
          if grep -q MISSING /tmp/check.txt; then
            echo "bash section incomplete"; exit 1
          fi

  # ── the neovim floor holds on the platform that can't meet it ──────────────
  # Ubuntu is the only platform where the distro package cannot satisfy the 0.12
  # floor (24.04 ships 0.9.5), so it is the only platform where the mise fallback
  # actually runs — and until this job existed, nothing exercised it. The other
  # install jobs run `make install bash`, which never touches neovim.
  #
  # This drives the real lib/ code rather than re-implementing the decision, but
  # stops short of `make install nvim` on purpose: that would clone 26 plugins
  # and compile tree-sitter parsers, minutes of work that proves nothing about
  # provider selection. What's asserted is exactly the claim — one nvim, and it
  # meets the floor.
  nvim-floor:
    name: neovim floor (ubuntu, mise fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reports what apt offers; deliberately does NOT fail when that improves.
      # This job is a required check, and Ubuntu shipping a newer neovim is good
      # news — blocking every PR on it would mean an upstream improvement stops
      # unrelated work until someone edits CI. The assertion that matters is the
      # one below: one nvim, at or above the floor. That holds either way.
      - name: What apt offers (informational)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          cand=$(apt-cache policy neovim | awk '/Candidate:/ {print $2}')
          echo "apt candidate: $cand"
          case "$cand" in
            0.9.*|0.1[01].*)
              echo "below 0.12 — the mise fallback is doing real work here" ;;
            *)
              echo "::notice::apt now offers neovim $cand. If that is >= 0.12 the"
              echo "::notice::mise||pkg ordering in deps.conf may no longer be needed." ;;
          esac

      - name: Resolve nvim through the real provider chain
        run: |
          set -euo pipefail
          source lib/manifest.sh
          source lib/providers.sh
          pkg_detect
          # Read the provider spec from the manifest rather than hardcoding it,
          # so flipping deps.conf back to pkg||mise fails this job instead of
          # silently passing against a stale copy of the intent.
          spec=$(manifest_lines tool nvim | awk -F'\t' '$3=="nvim" {print $2}')
          echo "declared provider chain: $spec"
          [ "$spec" = "mise||pkg" ] || { echo "expected mise||pkg"; exit 1; }
          provider_install "$spec" nvim neovim
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exactly one nvim, and it meets the floor
        run: |
          set -euo pipefail
          command -v nvim
          nvim --version | head -1
          v=$(nvim --version | awk 'NR==1 { sub(/^v/,"",$2); print $2 }')
          maj=${v%%.*}; rest=${v#*.}; min=${rest%%.*}
          [ "$maj" -gt 0 ] || [ "$min" -ge 12 ] || { echo "nvim $v is below the 0.12 floor"; exit 1; }
          # The point of mise-first: apt's 0.9.5 was never installed, so there is
          # nothing to be second.
          n=$(which -a nvim | sort -u | wc -l)
          echo "nvim binaries on PATH: $n"
          which -a nvim
          [ "$n" -eq 1 ] || { echo "expected exactly one nvim, found $n"; exit 1; }
          dpkg -s neovim >/dev/null 2>&1 && { echo "apt's neovim got installed after all"; exit 1; } || true
          echo "one nvim, $v, no apt package — mise-first held"

  # ── transitive advisories: the coverage Dependabot cannot give us ──────────
  # This job is not redundant with Dependabot, and deleting it would silently
  # remove the only transitive coverage in the repo. The full reasoning is in
  # .github/dependabot.yml; the short version is that the dependency graph has
  # no bun.lock parser, so it reads package.json, sees the 5 declared servers,
  # and is blind to the ~70 packages underneath — which is where advisories
  # actually land. `bun audit` resolves the installed tree instead, and it found
  # three high-severity minimatch ReDoS advisories (GHSA-3ppc-4f35-3m26,
  # -7r86-cg39-jmmj, -23c5-xmqv-rm74) reached via
  # bash-language-server › editorconfig › minimatch, none of which GitHub
  # reported. That is what the `overrides` block in package.json pins past.
  audit:
    name: bun audit (transitive advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-bun rather than `curl https://bun.com/install | bash`. This job's
      # whole purpose is objecting to unreviewed code entering the build, so
      # piping an unpinned remote script into bash to bootstrap it was the one
      # inconsistency worth removing. The action is pinned and watched by the
      # github-actions ecosystem in dependabot.yml; the curl script is neither.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so the audit describes the committed tree rather than
      # whatever resolves today. An audit of a lockfile CI just rewrote is an
      # audit of something that was never reviewed.
      - name: Install the language servers
        run: bun install --cwd nvim/lsp-servers --frozen-lockfile

      # Fails the build on any advisory. When one turns out to be unfixable —
      # a transitive exact-pin with no upstream release, which is precisely the
      # minimatch situation — the escape hatch is `--ignore=<GHSA-id>` with a
      # comment saying why, not deleting this step. An accepted risk should be
      # written down in the same place the repo writes down its other accepted
      # costs.
      - name: No known advisories in the language server tree
        run: bun audit --cwd nvim/lsp-servers

      # yarn.lock is a GENERATED artifact whose only job is to be readable by
      # GitHub's dependency graph, which has no bun.lock parser. bun.lock stays
      # the source of truth; this proves the two agree. `bun install --yarn` is
      # deterministic, so a diff here means someone changed deps without
      # regenerating, and the dependency graph would be describing a tree that
      # no longer exists — which is worse than not having the file at all.
      - name: yarn.lock matches bun.lock
        run: |
          set -euo pipefail
          bun install --cwd nvim/lsp-servers --yarn --frozen-lockfile
          if ! git diff --exit-code -- nvim/lsp-servers/yarn.lock; then
            echo
            echo "yarn.lock is stale. Regenerate it:"
            echo "    bun install --cwd nvim/lsp-servers --yarn"
            exit 1
          fi

      # Socket's scanner runs DURING install and can abort it on a malicious or
      # typosquatted package — prevention, where bun audit and Dependabot are
      # both detection-after-disclosure. It is the only layer here that can act
      # on a package no advisory database has heard of yet.
      #
      # bunfig.toml is written here rather than committed, and that is the whole
      # design. The scanner fails CLOSED: with Socket's API unreachable,
      # `bun install` exits 1 even with a frozen lockfile and a warm cache
      # (verified). Committing bunfig.toml would put Socket's availability on the
      # critical path of `make install`, and this repo's entire premise is
      # bootstrapping locked-down and offline machines — `make link` exists
      # precisely for machines with no network. So the scan lives where a new
      # dependency actually enters the repo: CI. A fresh machine installing an
      # already-pinned lockfile with integrity hashes is fetching bytes that were
      # scanned when they were introduced.
      - name: Scan for malicious packages (Socket, CI only)
        run: |
          set -euo pipefail
          cat > nvim/lsp-servers/bunfig.toml <<'TOML'
          [install.security]
          scanner = "@socketsecurity/bun-security-scanner"
          TOML
          # Free mode — no SOCKET_API_KEY, no account, no secret to leak.
          rm -rf nvim/lsp-servers/node_modules
          bun install --cwd nvim/lsp-servers --frozen-lockfile
          rm -f nvim/lsp-servers/bunfig.toml

  # ── the toolchain is bun and uv, and stays that way ────────────────────────
  # Not "nvim without node" any more — nvim never wants node now, so there is no
  # special mode to exercise. What needs guarding is the invariant: that nothing
  # quietly reintroduces node, npm, pip or a shim, and that the servers really do
  # run under bun.
  toolchain:
    name: bun-only toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and Dependabot-watched, rather than piping an unpinned installer
      # script into bash. Note this puts bun somewhere other than ~/.bun/bin, so
      # the handshake step below resolves it with `command -v` rather than
      # assuming a path.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: deps.conf declares no node, npm or pip
        run: |
          fail=0
          source lib/manifest.sh
          # provider column
          if manifest_lines tool | grep -qP '\tnpm\t'; then
            echo "npm provider reintroduced in deps.conf"; fail=1
          fi
          # command column — node itself, and pip under any provider
          while IFS=$'\t' read -r section provider cmd pkg; do
            case "$cmd" in
              node|npm|npx|pip|pip3) echo "[$section] '$cmd' reintroduced"; fail=1 ;;
            esac
          done < <(manifest_lines tool)
          [ $fail -eq 0 ] && echo "clean: no node, npm or pip in the manifest"
          exit $fail

      - name: No node shim anywhere in the repo
        run: |
          # Aliasing node to bun would make incompatibilities surface as errors
          # blaming the wrong tool. If someone adds one, this should fail.
          if grep -rnE '(ln -s.*\bbun\b.*/node|exec bun "\$@")' \
               --include='*.sh' --include='*.lua' --include='*.conf' . ; then
            echo "a node->bun shim was introduced — see lsp_servers.lua for why not"
            exit 1
          fi
          echo "clean: no node shim"

      # Server definitions live in lua/external/lsp_servers.lua rather than inline
      # in the plugin spec precisely so they can be tested like this: `--clean`
      # loads no plugins, so there's no 26-repo clone and no treesitter compile
      # standing between the assertion and the cmd lines it's about.
      # NOT `apt-get install neovim`. Ubuntu 24.04 ships 0.9.5, and this config
      # documents 0.10+ — lsp_servers.lua uses vim.fs.joinpath, added in 0.10.
      # So the apt version failed every run with "attempt to call field
      # 'joinpath' (a nil value)", which read as a broken config rather than as
      # CI testing against a version the config never claimed to support.
      #
      # Pinned and sha256-verified, the same treatment lemminx gets in
      # nvim/deps.sh. Bump both the version and the hash together; a mismatch
      # should stop the job, not be worked around.
      - name: Install neovim (pinned)
        env:
          NVIM_VERSION: v0.12.4
          NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
        run: |
          set -euo pipefail
          url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/nvim.tar.gz "$url"
          echo "${NVIM_SHA256}  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Unit-test the language server definitions
        run: |
          nvim --version | head -1
          make test

      # The language servers must work with no node and no npm anywhere — that
      # is the entire point of moving them out of Mason. Asserted with a real
      # LSP initialize handshake, because weaker checks (--version, exit codes)
      # give false readings on several of these servers.
      - name: LSP servers handshake under bun, with node/npm absent
        run: |
          bun install --cwd nvim/lsp-servers --frozen-lockfile
          MIN=$(mktemp -d)
          for b in sh bash env timeout bun; do ln -sf "$(command -v $b)" "$MIN/$b"; done
          ! PATH=$MIN command -v node
          ! PATH=$MIN command -v npm
          PATH=$MIN bun nvim/lsp-servers/verify.ts | tee /tmp/lsp.txt
          grep -q "ALL PASS" /tmp/lsp.txt

      # Integration signal, deliberately advisory: this boots the real plugin
      # stack, so a failure is as likely to be a flaky clone or an upstream
      # plugin change as a bug here. The steps above are what gate the build.
      #
      # No PATH stripping — that made sense when node-absent was a special case.
      # It is now the only case, so this just checks the editor boots and every
      # server is registered.
      - name: nvim boots and registers its servers (advisory)
        continue-on-error: true
        run: |
          make link nvim
          timeout 600 nvim --headless -c "lua
            local names = vim.tbl_keys(require('external.lsp_servers').build())
            table.sort(names)
            print('configured: ' .. table.concat(names, ', '))
            print('mason loaded: ' .. tostring(package.loaded['mason'] ~= nil))
          " -c "qa!" 2>&1 | tee /tmp/nvim.txt
          grep -q "mason loaded: false" /tmp/nvim.txt
          for s in clangd lua_ls lemminx ts_ls cssls html jsonls yamlls bashls; do
            grep -q "$s" /tmp/nvim.txt || { echo "server $s not configured"; exit 1; }
          done

  # ── Windows host ───────────────────────────────────────────────────────────
  # The only job that executes the PowerShell entry point. Every other job here
  # runs on Linux or macOS, where windows/install.ps1 is unreachable — so
  # without this, a syntax error in it ships and is discovered by whoever next
  # bootstraps a Windows machine, which is the worst possible time.
  windows:
    name: windows (link only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # `shell: powershell` is Windows PowerShell 5.1, deliberately, NOT pwsh 7.
      # 5.1 is what a fresh box runs when the bootstrap line is pasted, and it
      # is where the syntax these scripts avoid (ternaries, ??, $IsWindows,
      # multi-arg Join-Path) would actually blow up.
      - name: PowerShell parses under 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @('bootstrap.ps1', 'windows\install.ps1', 'windows\deps.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref] $null, [ref] $errors)
            if ($errors) {
              # Line and column, not just the message. A parse error reported
              # without a position is nearly useless when the only machine that
              # can reproduce it is this runner.
              foreach ($e in $errors) {
                Write-Host ('{0}({1},{2}): {3}' -f $f,
                  $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
                Write-Host ('    >>> ' + $e.Extent.Text)
              }
              $bad = 1
            }
          }
          exit $bad

      - name: install.ps1 -LinkOnly
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\install.ps1 -LinkOnly

      - name: The Windows config is in place and matches the repo
        shell: powershell
        run: |
          $dest = Join-Path $env:USERPROFILE '.config\wezterm\wezterm.lua'
          if (-not (Test-Path -LiteralPath $dest)) { throw "not installed: $dest" }
          # Accept either a symlink or the copy fallback: whether symlink
          # creation is permitted depends on the runner's privileges, and both
          # outcomes are correct behaviour. What must hold is the CONTENT.
          $got  = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash
          $want = (Get-FileHash -LiteralPath '.\wezterm\wezterm-windows.lua' -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "content differs from wezterm/wezterm-windows.lua" }
          Write-Host "ok: $dest"

      # This used to guard a parser: the bash side reads a section with no
      # `platform` line as "every platform", and a PowerShell parser inheriting
      # that reading would link bashrc into %USERPROFILE%. There is no second
      # parser now, so the failure it caught cannot happen the same way.
      #
      # Kept because the risk moved rather than left. install.ps1's $Links
      # table is hand-written, and a Linux destination pasted into it would be
      # installed without anything else objecting.
      - name: install.ps1 links only Windows destinations
        shell: powershell
        run: |
          # Asserts on what install.ps1 REPORTED, not on whether these paths
          # exist. The runner image ships its own %USERPROFILE%\.gitconfig, so
          # "must not exist" would fail for a reason that has nothing to do
          # with this repo.
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\install.ps1 -LinkOnly | Out-String
          Write-Host $out
          foreach ($leaked in @('.bashrc', '.gitconfig', 'nvim')) {
            if ($out -match [regex]::Escape($leaked)) {
              throw "install.ps1 touched a non-windows destination: $leaked"
            }
          }
          if ($out -notmatch 'wezterm\.lua') { throw 'install.ps1 did not link the wezterm config' }
          Write-Host 'ok: only windows sections were linked'

      - name: Re-running is idempotent
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\install.ps1 -LinkOnly
          if ($LASTEXITCODE -ne 0) { throw "second run exited $LASTEXITCODE" }
          $dest = Join-Path $env:USERPROFILE '.config\wezterm\wezterm.lua'
          $got  = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash
          $want = (Get-FileHash -LiteralPath '.\wezterm\wezterm-windows.lua' -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "second run left the wrong content in place" }
          Write-Host 'ok: idempotent'
