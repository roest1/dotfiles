name: portability

# The point of this workflow is to make "clone and get running on any platform"
# provable rather than claimed. The previous Makefile promised WSL support in its
# README while `make deps` hard-exited on apt — a bug that survived because
# nothing ever ran it on Ubuntu.
#
# Every job is a fresh machine, which is the only honest test of a bootstrap.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # For the `audit` job below: an advisory published on a Tuesday is not
  # discovered by a workflow that only runs when someone pushes. A dotfiles repo
  # can sit untouched for a month, which is exactly how long the gap would be.
  # GitHub only runs schedules on the default branch, so this starts working
  # once this lands on main.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # macOS ships bash 3.2 as /bin/bash, and that is what runs install.sh and
      # everything it sources -- the Makefile calls `bash install.sh`, which
      # resolves through PATH, and on a fresh Mac that is 3.2. So the whole
      # lib/ + install path is 3.2 territory, however modern the shell you
      # develop in.
      #
      # This is not hypothetical and it is not caught reliably by the macos
      # jobs. `mapfile` sat in run_hooks on main for months without failing,
      # because `make install bash` passes an argument and the branch holding
      # it was never reached; a bare `make install` on a Mac would have hit it.
      # A construct that only breaks on the untested path is exactly what a
      # grep is for.
      #
      # bash/bashrc is deliberately NOT scanned: it guards its bash 4 features
      # behind BASH_VERSINFO, which is the correct pattern and would trip this.
      - name: No bash 4+ constructs where /bin/bash 3.2 must run
        run: |
          set -uo pipefail
          bad=$(grep -rnE '^[^#]*(local -n |[^_[:alnum:]]mapfile |[^_[:alnum:]]readarray |declare -A )' \
                  lib/*.sh install.sh bootstrap.sh */deps.sh 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo ""
            echo "bash 4+ construct on a path macOS's /bin/bash 3.2 must run."
            echo "Use a fixed global + read loop instead of 'local -n' + mapfile."
            exit 1
          fi
          echo "ok: nothing on the 3.2 path needs bash 4"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # No file list here. tools/lint.sh holds the one definition of what this
      # repo lints and how strictly, and .githooks/pre-commit calls that same
      # script with the staged files. A list in both places is a list that
      # drifts — the same reason .githooks/secret-patterns is a shared file
      # rather than a pattern copied into the step below.
      #
      # With no arguments it sweeps the whole tree, which is the half a hook
      # cannot do: hooks are skippable with --no-verify, absent until
      # install.sh has run once, and never run for a commit made through the
      # web UI. A whole-tree sweep also catches a file nobody touched failing
      # because shellcheck itself gained a rule.
      - name: Lint shell sources
        run: ./tools/lint.sh

      # The remote half of the secret guard. .githooks/pre-commit is the local
      # half and shares this pattern file, but a hook is bypassable with
      # --no-verify and absent entirely until install.sh has run once. This
      # catches what got through, before it reaches main.
      #
      # It cannot un-publish a secret that is already pushed — that is why the
      # real defence is keeping those files outside the work tree, where git
      # cannot see them at all.
      - name: No secret or machine-local files are tracked
        run: |
          patterns=$(grep -vE '^\s*(#|$)' .githooks/secret-patterns | paste -sd '|' -)
          echo "patterns: $patterns"
          if bad=$(git ls-files | grep -E "$patterns"); then
            echo ""
            echo "tracked files matching .githooks/secret-patterns:"
            echo "$bad"
            exit 1
          fi
          echo "ok: nothing matching is tracked"

      # Runs here rather than on the Windows runner so it fails in seconds,
      # but the reason is pure Windows PowerShell 5.1.
      - name: PowerShell sources are ASCII-only
        run: |
          # 5.1 reads a .ps1 with no BOM as ANSI (cp1252), not UTF-8. An em
          # dash (E2 80 94) then decodes as three cp1252 characters ending in
          # 0x94 — which in cp1252 is RIGHT DOUBLE QUOTATION MARK, and
          # PowerShell treats that as a string delimiter. One em dash inside a
          # COMMENT opened a string that swallowed the rest of the file, and
          # the reported error was a bogus "invalid variable reference" 200
          # lines further down.
          #
          # A UTF-8 BOM also fixes it. ASCII-only is the fix that survives an
          # editor helpfully stripping the BOM.
          if bad=$(grep -rnP '[^\x00-\x7F]' --include='*.ps1' . 2>/dev/null); then
            echo "non-ASCII in PowerShell sources:"
            echo "$bad"
            echo ""
            echo "Windows PowerShell 5.1 mis-parses these. Use ASCII punctuation."
            exit 1
          fi
          echo "ok: all .ps1 sources are ASCII"

  # ── Manifest sanity ────────────────────────────────────────────────────────
  # Cheap guard against a typo in deps.conf taking down every other job.
  manifest:
    name: manifest parses
    runs-on: ubuntu-latest
    steps:
      # Full history: the alias-to-function check below compares against the
      # merge base, which a shallow clone doesn't have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Regression guard: ARGS was once a blocklist, so any goal not in it got a
      # stub rule that silently overrode the real target — `make help` printed
      # "overriding recipe for target 'help'" and ran the wrong recipe.
      - name: No target overrides its own recipe
        run: |
          fail=0
          # A throwaway HOME because the list includes `link`, and this step is
          # only reading make's warnings — it has no business installing
          # symlinks into the runner's home where a later step can trip on
          # them. Which is exactly what it used to do.
          tmphome=$(mktemp -d); export HOME="$tmphome"
          for t in help sections status check test sync link lint; do
            if make $t 2>&1 | grep -qE "warning: (overriding|ignoring old) recipe"; then
              echo "make $t triggers a recipe override"; fail=1
            fi
          done
          # section args must still be accepted, and still not warn
          if make check nvim 2>&1 | grep -qE "warning:"; then
            echo "make check nvim warns"; fail=1
          fi
          exit $fail

      # lib/sgr.sh emits SGR 6 to move `make` output into Science Gothic Mono.
      # On any terminal without wezterm's font_rules, SGR 6 means what it
      # actually says: RAPID BLINK. In a pipe it is plain corruption, and CI
      # itself does `make check bash | tee /tmp/check.txt` and greps it.
      #
      # Every direction is asserted because a regression in any of them is
      # invisible to the author, who is always in wezterm, always on a tty and
      # always linked.
      - name: make output carries escapes only on a wezterm tty
        run: |
          fail=0
          esc=$'\033['       # any escape at all
          carrier=$'\033[6'  # the carrier specifically: SGR 6, plain or bold
          for t in help status check; do
            if make $t 2>/dev/null | grep -qF "$esc"; then
              echo "make $t leaked escapes into a pipe"; fail=1
            fi
          done
          if ! command -v script >/dev/null 2>&1; then
            echo "no script(1) here; the tty cases below were skipped"; exit $fail
          fi

          # What follows is a truth table over the guard's three inputs, so
          # every row states its own preconditions in its own fixture home.
          # Reading $HOME would make the answer depend on whether some earlier
          # step in this job had run `make link` — and the result would be a
          # test that passes or fails on step ORDER, which is not a property
          # anyone editing lib/sgr.sh is thinking about.
          #
          # The linked home is built by the real installer rather than a
          # hand-written `ln -s`, so changing deps.conf's destination cannot
          # leave this asserting against a path nothing installs any more.
          unlinked=$(mktemp -d)
          linked=$(mktemp -d)
          HOME="$linked" make link wezterm >/dev/null

          # $1 home, $2 TERM_PROGRAM, $3 pattern — true when $3 reaches the tty
          on_tty() {
            HOME="$1" XDG_CONFIG_HOME= TERM_PROGRAM="$2" \
              script -qec "make help" /dev/null | grep -qF "$3"
          }

          # In wezterm, but the config isn't linked: being in wezterm does not
          # mean wezterm has the font_rules.
          if on_tty "$unlinked" WezTerm "$esc"; then
            echo "escapes on a wezterm tty before the config was linked"; fail=1
          fi
          # A tty, but not wezterm: here SGR 6 would mean rapid blink.
          if on_tty "$linked" xterm "$esc"; then
            echo "escapes on a non-wezterm tty"; fail=1
          fi
          # All three hold, so the carrier itself must appear — grepping for
          # any escape would keep passing if SGR 6 were swapped for something
          # else, such as the italic that rose-pine already spends on nvim's
          # comments.
          if ! on_tty "$linked" WezTerm "$carrier"; then
            echo "carrier missing on a linked wezterm tty"; fail=1
          fi
          # The rows above go through the $HOME/.config fallback; this one
          # proves the XDG_CONFIG_HOME half of the guard is live too.
          if ! HOME="$unlinked" XDG_CONFIG_HOME="$linked/.config" TERM_PROGRAM=WezTerm \
               script -qec "make help" /dev/null | grep -qF "$carrier"; then
            echo "carrier missing when XDG_CONFIG_HOME names the config"; fail=1
          fi
          exit $fail

      # The .ttf files are generated by wezterm/mkmono.py and committed, so the
      # thing that breaks is them going missing while the config still names
      # them — which degrades silently to 0xProto rather than erroring.
      - name: Science Gothic Mono ships with the config that names it
        run: |
          fail=0
          for f in wezterm/fonts/ScienceGothicMono.ttf wezterm/fonts/ScienceGothicMono-Bold.ttf; do
            [ -s "$f" ] || { echo "missing or empty: $f"; fail=1; }
          done
          grep -q 'wezterm/fonts' deps.conf || { echo "deps.conf does not link wezterm/fonts"; fail=1; }
          # OFL 1.1 section 2 requires the notice and licence to travel with the
          # font, and section 5 forbids relicensing it -- so the standalone copy
          # and the carve-out in LICENSE are both compliance, not tidiness.
          [ -s wezterm/fonts/OFL.txt ] || { echo "wezterm/fonts/OFL.txt is missing"; fail=1; }
          grep -q 'Open Font License' LICENSE || { echo "LICENSE lost the OFL carve-out"; fail=1; }
          # The carrier moved into wezterm/shared.lua, which both entry points
          # dofile(). Asserting it per-entry-point would now fail for a config
          # that is entirely correct -- but dropping the assertion would let the
          # 0 disappear silently, and wezterm's renderer only skips the blink
          # animation when text_blink_rate_rapid is exactly 0
          # (screen_line.rs: `if blink_rate != 0`). Without it every line of
          # `make` output flashes on every platform.
          #
          # So: assert it once where it lives, and separately that each entry
          # point still picks the body up. An entry point that stopped loading
          # shared.lua would have no carrier and no font rules at all.
          grep -q 'text_blink_rate_rapid = 0' wezterm/shared.lua \
            || { echo "shared.lua: SGR 6 would blink without text_blink_rate_rapid = 0"; fail=1; }
          grep -q 'Science Gothic Mono' wezterm/shared.lua \
            || { echo "shared.lua: no font_rule for the carrier"; fail=1; }
          for cfg in wezterm/wezterm.lua wezterm/wezterm-windows.lua; do
            grep -q 'shared.lua' "$cfg" \
              || { echo "$cfg: does not load shared.lua, so it has no lanes at all"; fail=1; }
          done

          # Both carriers live in shared.lua now, which both entry points
          # dofile(). Asserting them per-entry-point would fail for a correct
          # pair; asserting them nowhere would let a rate silently vanish, and
          # wezterm only skips the blink animation when the rate is exactly 0
          # (screen_line.rs: `if blink_rate != 0`). A missing 0 is a terminal
          # that flashes.
          #
          # Both, including on the Windows side: nvim runs in the WSL guest but
          # wezterm.exe on the host is what draws what it emits, so a lane
          # missing out there is a source file that BLINKS.
          grep -q 'text_blink_rate_rapid = 0' wezterm/shared.lua \
            || { echo "shared.lua: SGR 6 would blink without text_blink_rate_rapid = 0"; fail=1; }
          grep -q 'text_blink_rate = 0' wezterm/shared.lua \
            || { echo "shared.lua: SGR 5 would blink without text_blink_rate = 0"; fail=1; }
          grep -q 'Science Gothic Mono' wezterm/shared.lua \
            || { echo "shared.lua: no font_rule for the SGR 6 carrier"; fail=1; }

          # Four, not "at least one": a font_rule REPLACES the face for a
          # matching cell, so the lane needs {bold, regular} x {italic, upright}
          # or the missing combination is silently flattened. The one that bites
          # is italic -- rose-pine italicizes comments, so dropping it takes the
          # slant off every comment in every file, which is exactly the kind of
          # thing nobody notices for a month.
          #
          # Comment lines stripped first: shared.lua quotes `{ blink = "Slow" }`
          # while explaining why the four exist, and counting that would make
          # the check pass with one rule missing.
          n=$(grep -vE '^[[:space:]]*--' wezterm/shared.lua | grep -cE "blink = ['\"]Slow['\"]")
          [ "$n" -eq 4 ] \
            || { echo "shared.lua: expected 4 SGR 5 font_rules (bold/regular x italic/upright), found $n"; fail=1; }

          # The writer half. Without this the lane is configured and nothing
          # ever emits into it.
          grep -q "require('external.altfont')" nvim/init.lua \
            || { echo "nvim/init.lua does not load external.altfont"; fail=1; }
          exit $fail

      # ~/.config/dotfiles/sections narrows what a bare `make install` sweeps.
      # Every row here is a way it could go wrong quietly rather than loudly.
      - name: A machine's section file narrows, and never widens
        run: |
          source lib/manifest.sh
          fail=0
          tmp=$(mktemp -d)

          # Absent is the normal case and must stay "everything".
          all=$(manifest_sections | tr '\n' ' ')
          got=$(DOTFILES_SECTIONS_FILE=$tmp/none manifest_scope | tr '\n' ' ')
          [ "$got" = "$all" ] || { echo "no file should mean every section: '$got'"; fail=1; }

          printf 'bash\n# nvim\n' > "$tmp/some"
          got=$(DOTFILES_SECTIONS_FILE=$tmp/some manifest_scope | tr '\n' ' ')
          [ "$got" = "bash " ] || { echo "expected 'bash ', got '$got'"; fail=1; }

          # Naming one always wins: opting out is a default, not a lock.
          got=$(DOTFILES_SECTIONS_FILE=$tmp/some manifest_scope nvim | tr '\n' ' ')
          [ "$got" = "nvim " ] || { echo "explicit args must win, got '$got'"; fail=1; }

          # A typo that installs nothing is the failure this file prevents.
          printf 'bash\nnvimm\n' > "$tmp/typo"
          # Captured, not piped into `grep -q`. grep -q exits at first match and
          # SIGPIPEs manifest_scope mid-write -- three "printf: write error:
          # Broken pipe" lines in the log, and under pipefail it would be a
          # false failure. Same trap manifest_has_section documents.
          warn=$(DOTFILES_SECTIONS_FILE=$tmp/typo manifest_scope 2>&1 >/dev/null)
          case "$warn" in
            *nvimm*) ;;
            *) echo "a name that is not a section must warn, got: '$warn'"; fail=1 ;;
          esac

          # THE trap: manifest_lines with no arguments means EVERY section, so a
          # fully commented file must refuse rather than expand to nothing and
          # sweep the lot.
          printf '# bash\n# nvim\n' > "$tmp/empty"
          if DOTFILES_SECTIONS_FILE=$tmp/empty bash -c \
               'source lib/manifest.sh; manifest_scope_into' 2>/dev/null; then
            echo "an all-commented file must refuse, not fall through to all"; fail=1
          fi

          # ...and it must leave the scope EMPTY, not merely return non-zero.
          # A caller that checked the array instead of the return would still be
          # wrong, but this asserts the array agrees with the status.
          n=$(DOTFILES_SECTIONS_FILE=$tmp/empty bash -c \
                'source lib/manifest.sh; manifest_scope_into >/dev/null 2>&1; echo ${#MANIFEST_SCOPE[@]}')
          [ "$n" = "0" ] || { echo "refused but left $n section(s) in MANIFEST_SCOPE"; fail=1; }

          # The array takes a section name, NOT an array name. The nameref
          # signature was retired for bash 3.2, and passing a variable name
          # would now be read as a section -- silently non-empty, which is the
          # exact failure this whole step exists to prevent.
          got=$(DOTFILES_SECTIONS_FILE=$tmp/empty bash -c \
                  'source lib/manifest.sh; manifest_scope_into bash >/dev/null 2>&1; echo "${MANIFEST_SCOPE[*]}"')
          [ "$got" = "bash" ] || { echo "expected scope 'bash', got '$got'"; fail=1; }

          exit $fail

      - name: Sections are discoverable
        run: |
          source lib/manifest.sh
          sections=$(manifest_sections | tr '\n' ' ')
          echo "sections: $sections"
          for want in bash nvim wezterm; do
            echo "$sections" | grep -qw "$want" || { echo "missing section: $want"; exit 1; }
          done
      - name: Every tool line has a known provider
        run: |
          source lib/manifest.sh
          bad=0
          while IFS=$'\t' read -r section provider cmd pkg; do
            for p in ${provider//||/ }; do
              case "$p" in
                pkg|uv|cargo|mise|manual) ;;
                # No windows entry point reads this file any more, so winget
                # here would install nothing and report nothing. Name it
                # explicitly rather than letting it fall into "unknown".
                winget) echo "[$section] winget is not installable from this manifest — declare it in windows/install.ps1"; bad=1 ;;
                *) echo "[$section] unknown provider '$p' for $cmd"; bad=1 ;;
              esac
            done
          done < <(manifest_lines tool)
          exit $bad
      - name: Every link source exists in the repo
        run: |
          source lib/manifest.sh
          bad=0
          while IFS=$'\t' read -r section src dest; do
            [ -e "$src" ] || { echo "[$section] missing link source: $src"; bad=1; }
          done < <(manifest_lines link)
          # windows/install.ps1 declares its own payload, so manifest_lines
          # cannot see it. Read the Source values straight out of its $Links
          # table: without this, deleting wezterm-windows.lua would only be
          # caught on the windows runner, or by whoever next ran the bootstrap.
          while read -r src; do
            [ -n "$src" ] || continue
            [ -e "$src" ] || { echo "[windows] missing link source: $src"; bad=1; }
          done < <(grep -oP "Source\s*=\s*'\K[^']+" windows/install.ps1 | tr '\\' '/')
          exit $bad

      # The reverse of the check above, and the direction that breaks new
      # machines rather than CI. "Every declared link exists" catches a deleted
      # file; it cannot catch a file that exists, is sourced by bashrc, and was
      # never declared — that install links bashrc, bashrc sources a path that
      # was never created, and every interactive shell reports it.
      #
      # Only UNGUARDED sources are required to be declared. `~/.bash_local` and
      # `~/.bash_password_commands` are deliberately absent from the manifest
      # (they are machine-local and live outside the work tree), and they are
      # sourced behind a `[[ -f ... ]]` guard, which is exactly what makes them
      # distinguishable here.
      - name: Every unguarded source in bashrc is declared
        run: |
          source lib/manifest.sh
          declared=$(manifest_lines link | cut -f3 | xargs -r -n1 basename | sort -u)
          bad=0
          while read -r path; do
            base=$(basename "$path")
            echo "$declared" | grep -qx "$base" || {
              echo "bashrc sources $path with no link line in deps.conf"; bad=1; }
          done < <(grep -oE '^source[[:space:]]+~/\.[A-Za-z0-9_.-]+' bash/bashrc | awk '{print $2}')
          exit $bad

      # A stray line that lost its leading `#` parses fine and only shows up as
      # noise at runtime — bash_github_tui once ran `-` and `q` as commands from
      # inside a comment block, printing three "command not found" errors on
      # every interactive shell. `bash -n` cannot see this; only running it can.
      - name: Bash configs source without emitting output
        run: |
          bad=0
          for f in bash/bash_theme bash/bash_productivity bash/bash_git \
                   bash/bash_github bash/bash_github_tui; do
            # expand_aliases because that is how these files are really read.
            # Without it bash skips alias expansion entirely, which is a
            # different parser and hides a whole class of failure — see the
            # alias-to-function check below.
            out=$(bash -c "shopt -s expand_aliases; source $f" 2>&1)
            [ -z "$out" ] || { echo "$f is noisy when sourced:"; echo "$out"; bad=1; }
          done
          exit $bad

      # `reload` re-sources these files into a LIVE shell, so a name that used
      # to be an alias and is now a function breaks on upgrade: bash expands the
      # stale alias while parsing and `f() {` becomes a syntax error, reported
      # against a line with nothing wrong on it.
      #
      # This actually happened. `gb` was `alias gb='git branch --sort=...'`; it
      # became a function, and the first `reload` after pulling failed with
      # "syntax error near unexpected token `('" at `gb() {`. Nothing caught it:
      # `bash -n` and a non-interactive `source` do not expand aliases, so the
      # parse that fails is one CI never ran.
      #
      # The fix is an `unalias` before the definition — the same guard `bashrc`
      # already uses for `alert`, where the stale alias comes from Ubuntu's
      # default bashrc instead of from our own history. This asserts the guard
      # exists for every name that made that transition.
      - name: Aliases turned into functions are unaliased first
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null) || base=""
          if [ -z "$base" ]; then echo "no merge base; skipping"; exit 0; fi

          old_aliases=$(for f in $(git ls-tree -r --name-only "$base" -- bash/); do
                          git show "$base:$f" 2>/dev/null
                        done | grep -hE '^[[:space:]]*alias ' | sed 's/.*alias //;s/=.*//' | sort -u)
          bad=0
          for fn in $(grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' bash/bash_* | tr -d '()' | sort -u); do
            echo "$old_aliases" | grep -qx -- "$fn" || continue
            grep -qE "^[[:space:]]*unalias .*\b${fn}\b" bash/bash_* || {
              echo "'$fn' was an alias and is now a function, with no 'unalias $fn' guard"
              echo "  a reload in a shell running the older config will fail to parse it"
              bad=1
            }
          done
          exit $bad

      # gh-tui is the single public entry to the interactive layer. The five
      # screens behind it (gpr, gha-ui, ghsecrets, ghbranch, ghenv) used to sit
      # next to it as top-level commands, which left six names competing for
      # one job and meant the hub had to be discovered rather than being the
      # obvious door.
      #
      # This also keeps the prefix rule true: `__` is a helper shared across
      # files, `_` is private to this one. Every screen is now `_`-prefixed,
      # which is what stops the help check above from demanding an `h` entry
      # for something you cannot type.
      - name: bash_github_tui exposes only gh-tui
        run: |
          public=$(grep -oE '^[a-zA-Z][a-zA-Z0-9_-]*\(\)' bash/bash_github_tui | tr -d '()')
          if [ "$public" != "gh-tui" ]; then
            echo "bash_github_tui must define exactly one public function (gh-tui); found:"
            echo "$public"
            exit 1
          fi
          # Every double-underscore name it uses must come from another file.
          bad=0
          for n in $(grep -ohE '__[a-z_]+' bash/bash_github_tui | sort -u); do
            if grep -q "^$n()" bash/bash_github_tui; then
              echo "$n is private to bash_github_tui but uses the shared '__' prefix"; bad=1
            fi
          done
          exit $bad

      # The [bash] file split is a rule, not a preference: bash_github holds
      # plain gh commands and shared helpers, bash_github_tui holds everything
      # interactive. Keeping fzf on one side of that line is what lets the TUI
      # be deleted or replaced as a unit. `command -v fzf` is a probe, not an
      # invocation, so it does not count.
      # Comment lines are skipped: this file's own header documents the rule and
      # would otherwise match the pattern that enforces it.
      - name: bash_github invokes no fzf
        run: |
          awk '
            /^[[:space:]]*#/ { next }
            /\| *fzf|^[[:space:]]*fzf / { print FILENAME ":" FNR ": " $0; found = 1 }
            END { exit found ? 1 : 0 }
          ' bash/bash_github || {
            echo "bash_github must not invoke fzf — that belongs in bash_github_tui"
            exit 1
          }

      # The nvim-like menu contract (q and - go back, --disabled so plain keys
      # are commands) is defined once in __fzf_menu. It was previously spelled
      # out at 18 call sites as identical strings kept identical by hand; a
      # screen that hand-rolls it again is how the next one drifts. The wrapper
      # itself is the sole legitimate --disabled, so it is the only exemption.
      - name: fzf menus go through __fzf_menu
        run: |
          bad=0
          for f in bash/bash_git bash/bash_github bash/bash_github_tui; do
            awk -v file="$f" '
              /^[[:space:]]*#/ { next }
              /fzf .*--disabled|--disabled.*fzf/ { print file ":" FNR ": " $0; found = 1 }
              END { exit found ? 1 : 0 }
            ' "$f" || bad=1
          done
          if [ "$bad" -ne 0 ]; then
            echo "hand-rolled fzf menu — use __fzf_menu (bash_productivity)"
            exit 1
          fi
          grep -q '^__fzf_menu()' bash/bash_productivity || {
            echo "__fzf_menu is missing from bash_productivity"; exit 1; }

      # `h` is hand-maintained — the comment above it used to claim it read from
      # the file's own comments and was "always in sync", which was never true.
      # This is the check that makes the honest version safe: every public
      # command must be named somewhere in h's body, and h must not name a
      # command that no longer exists.
      #
      # Both directions had already failed in practice. h advertised `gh-tui`
      # while the function was called `gh-ui`, so the documented command did not
      # exist and the real one was undocumented; and h kept a full help page for
      # `lines` after the function was deleted.
      - name: Every command is documented in h, and h documents nothing missing
        run: |
          # Each `run:` is a fresh shell, so the parser has to be sourced here
          # even though earlier steps in this job already did it.
          source lib/manifest.sh

          defined=$( { grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         bash/bash_github_tui | tr -d '()'
                       grep -hE '^alias ' bash/bash_productivity bash/bash_git \
                         bash/bash_github_tui | sed 's/alias //;s/=.*//'
                     } | grep -vE '^_' | sort -u )
          hbody=$(sed -n '/^h() {/,/^}/p' bash/bash_productivity)
          bad=0
          for c in $defined; do
            echo "$hbody" | grep -qw -- "$c" || { echo "undocumented in h: $c"; bad=1; }
          done

          # ...and the reverse: h must not document something that no longer
          # exists anywhere.
          #
          # This is a STATIC check against the sources, not a runtime one.
          # Sourcing the configs and asking `type -t` looks more direct and is
          # wrong: half these commands are defined behind `command -v` guards
          # so the shell degrades gracefully on a machine without eza or bat,
          # which means a runner with neither legitimately has no `lt` and no
          # `catn`. Testing runtime presence would make this check assert that
          # the runner has every optional tool installed — a different, false
          # claim. What we actually want to know is whether the definition is
          # still in the repo.
          #
          # A documented command is legitimate if the configs define it (as a
          # function or an alias, at any indentation — the tool-dependent
          # aliases are nested inside their guards) or if deps.conf declares it
          # as a tool, which covers the external commands h explains, like fzf.
          defines=$( { grep -hoE '^[a-zA-Z_][a-zA-Z0-9_-]*\(\)' \
                         bash/bash_productivity bash/bash_git bash/bash_github \
                         bash/bash_github_tui | tr -d '()'
                       grep -hE '^[[:space:]]*alias ' \
                         bash/bash_productivity bash/bash_git bash/bash_github_tui \
                         | sed 's/.*alias //;s/=.*//'
                       manifest_lines tool | cut -f3
                     } | sort -u )

          # Scoped to the QUICK REFERENCE (the no-args heredoc), not the whole
          # function: the detailed pages are prose, and an indented sentence
          # starting with a lowercase word is indistinguishable from a command
          # column entry. Two spaces after the name separates the command
          # column from a sentence.
          quickref=$(sed -n '/^h() {/,/^    return$/p' bash/bash_productivity)
          listed=$(echo "$quickref" | sed -n 's/^    \([a-z][a-z0-9-]*\)  \+.*/\1/p' | sort -u)
          for c in $listed; do
            echo "$defines" | grep -qx -- "$c" \
              || { echo "h documents '$c', which nothing defines or declares"; bad=1; }
          done
          exit $bad

      # mise.toml is generated from deps.conf and mise.lock is generated from
      # mise.toml, so all three can disagree. Before this existed, lib/pkg.sh
      # installed `@latest` and the resolved versions lived only in
      # ~/.config/mise/config.toml — untracked, machine-local, and different on
      # every box provisioned on a different day.
      #
      # Registry-free on purpose: this runner has no mise, and the question is
      # whether the two files describe the same tool set, not what the current
      # upstream version is.
      - name: mise.toml and mise.lock match deps.conf
        run: ./tools/gen-mise.sh --check

      # A generator whose output the parser rejects is worse than no generator,
      # so assert the round trip rather than just that it runs.
      - name: "tools/adopt.sh emits lines the parser accepts"
        run: |
          ./tools/adopt.sh git make tar > /tmp/adopt.txt
          grep -q '^tool ' /tmp/adopt.txt || { echo "adopt emitted no tool lines"; cat /tmp/adopt.txt; exit 1; }
          mkdir -p /tmp/rt
          { echo "[roundtrip]"; grep '^tool ' /tmp/adopt.txt; } > /tmp/rt/deps.conf
          source lib/manifest.sh
          n_in=$(grep -c '^tool ' /tmp/rt/deps.conf)
          n_out=$(MANIFEST_FILE=/tmp/rt/deps.conf manifest_lines tool | wc -l)
          echo "generated $n_in line(s), parsed back $n_out"
          [ "$n_in" -eq "$n_out" ] || { echo "round trip lost lines"; exit 1; }

      - name: Links report in sync right after `make link`
        run: |
          make link
          source lib/status.sh
          # Only the link half — tools legitimately aren't installed in this job.
          status_links
          if [ "$STATUS_DRIFT" -ne 0 ]; then
            echo "links drifted immediately after make link"; exit 1
          fi

      # shared.lua only works if BOTH entry points can find it next to
      # themselves, and the two link declarations live in different files that
      # nothing else cross-checks. Declaring it on one side only is silent: the
      # pcall in the other entry point degrades to an unstyled terminal rather
      # than erroring, so the platform you did not test just quietly looks wrong.
      - name: shared.lua is linked on both platforms
        run: |
          set -euo pipefail
          source lib/manifest.sh
          bad=0

          manifest_lines link wezterm | awk -F'\t' '{print $2}' | grep -qx 'wezterm/shared.lua' || {
            echo "deps.conf [wezterm] does not link wezterm/shared.lua"; bad=1; }

          grep -oP "Source\s*=\s*'\K[^']+" windows/install.ps1 | tr '\\' '/' \
            | grep -qx 'wezterm/shared.lua' || {
            echo "windows/install.ps1 \$Links does not carry wezterm/shared.lua"; bad=1; }

          # And both entry points must actually load it, or the link is dead weight.
          for f in wezterm/wezterm.lua wezterm/wezterm-windows.lua; do
            grep -q 'shared.lua' "$f" || { echo "$f does not load shared.lua"; bad=1; }
          done

          [ $bad -eq 0 ] && echo "ok: shared.lua linked and loaded on both platforms"
          exit $bad

      # No runner here is WSL, so every direction of this is invisible to
      # whoever writes the code — the same problem the SGR 6 guard has. Assert
      # both, by overriding the predicate rather than by faking /proc/version.
      #
      # It matters in both directions. If tool_applies_here wrongly said "not
      # here" on a normal Linux box, wezterm would silently stop installing and
      # `make check` would report n/a for a tool that genuinely is missing.
      - name: wezterm is skipped under WSL, and only under WSL
        run: |
          set -euo pipefail
          source lib/pkg.sh

          # Real predicate, real runner: CI is not WSL, so nothing is suppressed.
          if is_wsl; then echo "runner reports WSL — it isn't"; exit 1; fi
          tool_applies_here wezterm || { echo "wezterm suppressed on plain Linux"; exit 1; }

          # Forced off: wezterm still installs, on every platform CI does run.
          is_wsl() { return 1; }
          tool_applies_here wezterm || { echo "not-WSL: wezterm must apply"; exit 1; }
          tool_applies_here rg      || { echo "not-WSL: rg must apply"; exit 1; }

          # Forced on: wezterm is the ONLY thing that drops out. A predicate that
          # started suppressing rg would break the shell inside every WSL guest.
          is_wsl() { return 0; }
          if tool_applies_here wezterm; then echo "WSL: wezterm must not apply"; exit 1; fi
          tool_applies_here rg || { echo "WSL: rg must still apply"; exit 1; }
          for t in fzf bat eza gh jq nvim bun uv; do
            tool_applies_here "$t" || { echo "WSL: $t must still apply"; exit 1; }
          done
          echo "ok: WSL suppresses wezterm and nothing else"

      # The links are NOT part of that skip, and the reason is easy to lose:
      # wezterm.lua declares the `mux` unix domain on a guest socket path, so a
      # wezterm-mux-server running inside WSL reads it. Only the tool drops out.
      # Named rather than counted. A bare count told you the number was wrong
      # and nothing else -- it fired when shared.lua was added, which was a
      # correct change, while a swap that kept the count would have passed
      # silently. Each of these three has a different failure if it goes
      # missing, so each is asserted by name.
      - name: '[wezterm] still declares its links'
        run: |
          set -euo pipefail
          source lib/manifest.sh
          links=$(manifest_lines link wezterm | awk -F'\t' '{print $2}')
          bad=0
          # the config itself: without it the guest has no wezterm.lua at all
          grep -qx 'wezterm/wezterm.lua' <<<"$links" || {
            echo "[wezterm] no longer links wezterm.lua"; bad=1; }
          # the shared body: both entry points dofile() it, and its absence
          # degrades silently through the pcall rather than erroring
          grep -qx 'wezterm/shared.lua' <<<"$links" || {
            echo "[wezterm] no longer links shared.lua — the config would load unstyled"; bad=1; }
          # the fonts: font_dirs reads them out of the linked config dir, and
          # lib/sgr.sh uses this very link as its proxy for "config is live"
          grep -qx 'wezterm/fonts' <<<"$links" || {
            echo "[wezterm] no longer links the fonts directory"; bad=1; }
          [ $bad -eq 0 ] && echo "ok: [wezterm] links config, shared body and fonts"
          exit $bad

  # ── Links only: the locked-down-machine path ───────────────────────────────
  # No sudo, no network, nothing installed. Must work everywhere.
  # ── the Rust TUIs ─────────────────────────────────────────────────────────
  # tui/ is the repo's first compiled tree, so it is also the first thing here
  # that can be broken by a dependency rather than by an edit. fmt and clippy
  # are gates rather than suggestions for the same reason tools/lint.sh runs at
  # --severity=warning: a warning nobody fails on is a warning nobody reads.
  tui:
    name: tui (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        working-directory: tui
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: tui
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: tui
        run: cargo test --locked
      - name: Release build
        working-directory: tui
        run: cargo build --release --locked

      # `font` is a name someone else owns on crates.io. The cargo provider
      # installs BY NAME, so declaring `tool cargo font` would fetch a
      # stranger's crate and report success — the manifest has to say `manual`
      # and let tui/deps.sh install from the local path.
      - name: The tui section installs from a path, not from crates.io
        run: |
          source lib/manifest.sh
          fail=0
          while IFS=$'\t' read -r _section provider cmd _; do
            [ "$provider" = manual ] || { echo "[tui] $cmd is '$provider'; must be manual"; fail=1; }
          done < <(manifest_lines tool tui)
          grep -q -- '--path' tui/deps.sh \
            || { echo "tui/deps.sh does not install from a local path"; fail=1; }
          exit $fail

      # lib/pkg.sh holds the only implementation of "install a tool", and the
      # rustup bootstrap is one of those. A copy in tui/deps.sh would be a
      # second place deciding what a missing cargo means.
      - name: The tui section bootstraps cargo through lib/pkg.sh
        run: |
          fail=0
          grep -q '^ensure_cargo()' lib/pkg.sh \
            || { echo "lib/pkg.sh lost ensure_cargo"; fail=1; }
          grep -q 'ensure_cargo' tui/deps.sh \
            || { echo "tui/deps.sh does not require cargo"; fail=1; }
          if grep -q 'rustup.rs' tui/deps.sh; then
            echo "tui/deps.sh has its own rustup bootstrap; use ensure_cargo"
            fail=1
          fi
          source lib/manifest.sh
          manifest_lines tool tui | cut -f3 | grep -qx cargo \
            || { echo "[tui] does not declare cargo"; fail=1; }
          exit $fail

      # The shell specimen renders this repo's real PS1, and its test pins the
      # exact string. A test pinned to a string nobody re-checks is a test that
      # passes while describing a prompt that no longer exists.
      - name: The PS1 the specimen test pins is the PS1 bash_theme ships
        run: |
          shipped=$(sed -n "s/^PS1='\(.*\)'$/\1/p" bash/bash_theme)
          [ -n "$shipped" ] || { echo "no PS1= line in bash/bash_theme"; exit 1; }
          # The Rust literal doubles every backslash; undo that to compare.
          pinned=$(sed -n 's/^[[:space:]]*const REAL: &str = "\(.*\)";$/\1/p' \
            tui/font/src/theme.rs | sed 's/\\\\/\\/g')
          [ -n "$pinned" ] || { echo "no REAL const in tui/font/src/theme.rs"; exit 1; }
          if [ "$shipped" != "$pinned" ]; then
            echo "bash_theme PS1 and the specimen test have drifted:"
            echo "  shipped: $shipped"
            echo "  pinned : $pinned"
            exit 1
          fi
          echo "ok: $shipped"

      # The binary shadows nothing and nothing shadows it. A bash function named
      # `font` would win over the binary on PATH, silently reinstating the fzf
      # picker this replaced.
      - name: No bash function shadows a tui binary
        run: |
          fail=0
          for b in font; do
            if grep -qE "^$b\(\) \{" bash/*; then
              echo "a bash function named '$b' would shadow the tui binary"; fail=1
            fi
          done
          exit $fail

  link-only:
    # The name is a stable literal, NOT ${{ matrix.os }}. Required status checks
    # match by exact name: if the name embedded the runner label and that label
    # ever changed (pinning to ubuntu-24.04, GitHub retiring a label), the
    # required check would never report — and a check that never reports doesn't
    # fail a PR, it blocks it indefinitely waiting for a status that won't come.
    name: link only (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: make link
        run: make link
      - name: Config is symlinked into the repo
        run: |
          test -L "$HOME/.bashrc"
          test -L "$HOME/.config/nvim"
          test -L "$HOME/.config/wezterm/wezterm.lua"
          test -L "$HOME/.claude/settings.json"

      # The [claude] hooks and wezterm's format-tab-title are two halves of one
      # feature — the hooks publish claude_state as an OSC user var, the tab bar
      # reads it to pick a per-tab glyph — so this checks the payload, not just
      # that a link exists.
      #
      # Worth asserting rather than assuming, because BOTH failure modes here
      # are silent. A malformed settings.json disables every setting in the file
      # instead of erroring, and a hook that stops publishing just degrades the
      # tab bar to "stopped" forever, which looks like a working config until
      # you notice no tab ever says otherwise.
      - name: Claude user settings parse and carry the wezterm hooks
        run: |
          jq -e . "$HOME/.claude/settings.json" >/dev/null \
            || { echo "FAIL: ~/.claude/settings.json is not valid JSON"; exit 1; }
          for ev in Notification Stop; do
            jq -e --arg ev "$ev" \
              '.hooks[$ev][0].hooks[0].command | test("SetUserVar=claude_state")' \
              "$HOME/.claude/settings.json" >/dev/null \
              || { echo "FAIL: $ev hook missing or no longer publishes claude_state"; exit 1; }
          done

      # `claude/`, not `.claude/`, is load-bearing: Claude Code reads a
      # `.claude/settings.json` in the working repo as PROJECT settings on top
      # of the user settings this section links. Storing it under the dotted
      # name would feed one file to both scopes inside this repo, and hook
      # arrays MERGE across scopes rather than override — so every hook would
      # register twice and fire twice, here and nowhere else.
      - name: Claude settings are not also project-scoped
        run: |
          if [ -e .claude/settings.json ]; then
            echo "FAIL: .claude/settings.json would double-load as project settings"
            echo "      move it to claude/settings.json (see [claude] in deps.conf)"
            exit 1
          fi

      - name: Idempotent — second run changes nothing
        run: |
          make link | tee /tmp/second.txt
          if grep -qE "linked |backed up " /tmp/second.txt; then
            echo "second run was not idempotent"; exit 1
          fi

      # prune_orphans deletes files, so its blast radius is tested rather than
      # reasoned about. The two negative cases are the ones that matter: a dead
      # link this repo did not create, and a live one.
      - name: Orphan pruning removes only this repo's dead links
        run: |
          ln -s "$PWD/bash/retired_name" "$HOME/.bash_orphan"       # dead, ours
          ln -s /nonexistent/elsewhere "$HOME/.unrelated_dead_link" # dead, not ours
          test -L "$HOME/.bashrc"                                   # live, ours

          make link

          fail=0
          if [ -L "$HOME/.bash_orphan" ]; then
            echo "FAIL: dead link into the repo was not pruned"; fail=1
          fi
          if [ ! -L "$HOME/.unrelated_dead_link" ]; then
            echo "FAIL: pruned a dead link that does not point into this repo"; fail=1
          fi
          if [ ! -L "$HOME/.bashrc" ]; then
            echo "FAIL: pruned a link whose target still exists"; fail=1
          fi
          rm -f "$HOME/.unrelated_dead_link"
          [ $fail -eq 0 ] && echo "ok: pruned exactly the repo's own dead link"
          exit $fail

  # ── Full install per platform ──────────────────────────────────────────────
  install:
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu / apt
            runs-on: ubuntu-latest
            container: ''
          - name: macos / brew
            runs-on: macos-latest
            container: ''
          - name: fedora / dnf
            runs-on: ubuntu-latest
            container: fedora:latest
    steps:
      - name: Bootstrap container prerequisites
        if: matrix.container != ''
        run: dnf install -y git make sudo findutils

      - uses: actions/checkout@v7

      - name: Install the bash section
        run: make install bash

      - name: Verify the bash section
        run: |
          # `make check` exits 0 even when tools are missing, so the summary
          # always prints for a human. Assert on the output instead.
          make check bash | tee /tmp/check.txt
          if grep -q MISSING /tmp/check.txt; then
            echo "bash section incomplete"; exit 1
          fi

  # ── the neovim floor holds on the platform that can't meet it ──────────────
  # Ubuntu is the only platform where the distro package cannot satisfy the 0.12
  # floor (24.04 ships 0.9.5), so it is the only platform where the mise fallback
  # actually runs — and until this job existed, nothing exercised it. The other
  # install jobs run `make install bash`, which never touches neovim.
  #
  # This drives the real lib/ code rather than re-implementing the decision, but
  # stops short of `make install nvim` on purpose: that would clone 26 plugins
  # and compile tree-sitter parsers, minutes of work that proves nothing about
  # provider selection. What's asserted is exactly the claim — one nvim, and it
  # meets the floor.
  nvim-floor:
    name: neovim floor (ubuntu, mise fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reports what apt offers; deliberately does NOT fail when that improves.
      # This job is a required check, and Ubuntu shipping a newer neovim is good
      # news — blocking every PR on it would mean an upstream improvement stops
      # unrelated work until someone edits CI. The assertion that matters is the
      # one below: one nvim, at or above the floor. That holds either way.
      - name: What apt offers (informational)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          cand=$(apt-cache policy neovim | awk '/Candidate:/ {print $2}')
          echo "apt candidate: $cand"
          case "$cand" in
            0.9.*|0.1[01].*)
              echo "below 0.12 — the mise fallback is doing real work here" ;;
            *)
              echo "::notice::apt now offers neovim $cand. If that is >= 0.12 the"
              echo "::notice::mise||pkg ordering in deps.conf may no longer be needed." ;;
          esac

      - name: Resolve nvim through the real provider chain
        run: |
          set -euo pipefail
          source lib/manifest.sh
          source lib/providers.sh
          pkg_detect
          # Read the provider spec from the manifest rather than hardcoding it,
          # so flipping deps.conf back to pkg||mise fails this job instead of
          # silently passing against a stale copy of the intent.
          spec=$(manifest_lines tool nvim | awk -F'\t' '$3=="nvim" {print $2}')
          echo "declared provider chain: $spec"
          [ "$spec" = "mise||pkg" ] || { echo "expected mise||pkg"; exit 1; }
          provider_install "$spec" nvim neovim
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exactly one nvim, and it meets the floor
        run: |
          set -euo pipefail
          command -v nvim
          nvim --version | head -1
          v=$(nvim --version | awk 'NR==1 { sub(/^v/,"",$2); print $2 }')
          maj=${v%%.*}; rest=${v#*.}; min=${rest%%.*}
          [ "$maj" -gt 0 ] || [ "$min" -ge 12 ] || { echo "nvim $v is below the 0.12 floor"; exit 1; }
          # The point of mise-first: apt's 0.9.5 was never installed, so there is
          # nothing to be second.
          n=$(which -a nvim | sort -u | wc -l)
          echo "nvim binaries on PATH: $n"
          which -a nvim
          [ "$n" -eq 1 ] || { echo "expected exactly one nvim, found $n"; exit 1; }
          dpkg -s neovim >/dev/null 2>&1 && { echo "apt's neovim got installed after all"; exit 1; } || true
          echo "one nvim, $v, no apt package — mise-first held"

      # The nvim half of the alternate-font carrier, and the mirror image of
      # "make output carries escapes only on a wezterm tty" in the manifest job.
      #
      # nvim/lua/external/altfont.lua emits SGR 5 over the text of a file buffer
      # so wezterm's font_rules can draw it in another font. Everywhere else SGR
      # 5 means what it says -- BLINK -- so getting the guard wrong sets an
      # entire source file flashing over ssh, in GNOME Terminal, on a Mac. The
      # author never sees it: they are always in wezterm and always linked.
      #
      # Runtime rather than a grep, because what is being asserted is what
      # reaches the terminal, and the path from a `blink = true` highlight to an
      # SGR 5 byte runs through nvim's TUI and its terminfo. A grep would keep
      # passing if that path changed.
      - name: nvim emits the alternate-font carrier only under wezterm
        run: |
          set -uo pipefail
          fail=0
          command -v script >/dev/null 2>&1 || { echo "no script(1) here"; exit 0; }

          # Matches SGR 5 exactly: ESC[5m or ESC[<params>;5m. Deliberately not
          # ESC\[[0-9;]*5m, which also matches ESC[25m -- blink OFF -- and would
          # make the negative rows below pass for the wrong reason.
          carrier=$'\033\\[([0-9;]*;)?5m'

          # Same fixture strategy as the sgr.sh truth table: a home built by the
          # real installer, so a change to deps.conf's destination cannot leave
          # this asserting against a path nothing installs.
          linked=$(mktemp -d)
          unlinked=$(mktemp -d)
          HOME="$linked" make link wezterm >/dev/null

          work=$(mktemp -d)
          printf 'local x = 1\n' > "$work/probe.lua"
          # Only altfont, on the repo's real runtimepath -- loading the full
          # config here would clone 26 plugins to test one module. printf rather
          # than a heredoc: a heredoc terminator has to sit at column 0, which
          # is not a thing a YAML block scalar can contain.
          printf "vim.opt.runtimepath:prepend('%s/nvim')\nrequire('external.altfont').setup()\n" \
            "$PWD" > "$work/init.lua"

          # $1 home, $2 TERM_PROGRAM -- true when the carrier reaches the tty
          emits() {
            HOME="$1" XDG_CONFIG_HOME= TERM_PROGRAM="$2" \
              script -qec "nvim --clean -u '$work/init.lua' -c 'redraw!' -c 'sleep 300m' -c 'q!' '$work/probe.lua'" \
                /dev/null 2>/dev/null | grep -aqE "$carrier"
          }

          if emits "$linked" xterm; then
            echo "carrier emitted outside wezterm — this is literally blinking text"; fail=1
          fi
          if emits "$unlinked" WezTerm; then
            echo "carrier emitted in wezterm before the config was linked"; fail=1
          fi
          if ! emits "$linked" WezTerm; then
            echo "carrier missing on a linked wezterm tty"; fail=1
          fi

          # oil is the whole point of doing this per-cell rather than per-window,
          # so assert the exclusion rather than trusting the buftype list. oil
          # sets buftype=acwrite (oil.nvim view.lua); this stands in for it
          # without pulling the plugin in.
          {
            printf "vim.opt.runtimepath:prepend('%s/nvim')\n" "$PWD"
            printf "require('external.altfont').setup()\n"
            printf "local b = vim.api.nvim_create_buf(true, false)\n"
            printf "vim.api.nvim_buf_set_name(b, 'oil:///tmp/')\n"
            printf "vim.bo[b].buftype = 'acwrite'\n"
            printf "vim.api.nvim_buf_set_lines(b, 0, -1, false, { 'oilrow' })\n"
            printf "vim.api.nvim_set_current_buf(b)\n"
          } > "$work/oil.lua"
          if HOME="$linked" XDG_CONFIG_HOME= TERM_PROGRAM=WezTerm \
             script -qec "nvim --clean -u '$work/oil.lua' -c 'redraw!' -c 'sleep 300m' -c 'qa!'" \
               /dev/null 2>/dev/null | grep -aqE "$carrier"; then
            echo "carrier reached an oil-style buffer — it must be files only"; fail=1
          fi
          exit $fail

  # ── transitive advisories: the coverage Dependabot cannot give us ──────────
  # This job is not redundant with Dependabot, and deleting it would silently
  # remove the only transitive coverage in the repo. The full reasoning is in
  # .github/dependabot.yml; the short version is that the dependency graph has
  # 2parquet/2feather/2pickle are the only commands in this repo that shell out
  # to a second language runtime, and nothing else here would notice them
  # breaking: the install jobs prove the tools exist, never that a conversion is
  # correct. The failure this guards against is silent — a frame that converts
  # without error but comes back subtly wrong.
  #
  # The id column is the specific regression. Excel stores every number as a
  # double, and a naive reader turns ids into 1.0, 2.0; the same class of bug is
  # why 2csv routes through qsv rather than duckdb. Asserting the dtype survives
  # is cheaper than discovering it in a dataset a year from now.
  #
  # uv is installed the way bash/deps.sh installs it. Whether that installer
  # runs correctly is the install job's question, not this one — this job needs
  # uv present so it can test what runs on top.
  #
  # Excel input is deliberately not covered: it needs qsv, and the qsv half of
  # that path is exercised by 2csv already. What is new here is the python
  # engine.
  conversions:
    name: 2* conversions (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # _dotfiles_dir finds tabular.py by resolving ~/.bashrc's symlink, so the
      # config has to be linked before any of these commands can work. That the
      # resolution happens at all is part of what this job checks.
      - name: Link config
        run: make link bash

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # qsv only, not a bare `mise install`, which would pull neovim, bun and
      # the rest of mise.toml for a job that needs one binary. The version still
      # comes from the repo's pin, so this exercises the lockfile too.
      #
      # PATH gets the resolved bin directory, NOT the shim directory. The steps
      # below run in a temp dir, where this repo's mise.toml is not active, and
      # a shim outside its config errors with "No version is set for shim: qsv"
      # — the same mise-shim-without-an-active-version failure `make status`
      # reports as a stale pin. Resolving the real path here, while still in the
      # repo, sidesteps cwd entirely.
      - name: Install qsv
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" install qsv
          dirname "$("$HOME/.local/bin/mise" which qsv)" >> "$GITHUB_PATH"

      # 2csv and 2txt had no coverage either — this job was originally only
      # about the python engine, and the older half of the family turned out to
      # be just as untested. The xlsx fixture is built here rather than
      # committed: a binary blob in the tree is a thing nobody can review, and
      # generating it costs one uv call.
      - name: 2csv / 2txt round-trip, including a real workbook
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          cat > src.csv <<'CSV'
          id,name,note,score
          1,"alpha, inc",plain,1.5
          2,"quote""d",café,2.5
          3,gamma,tab-free,3.5
          CSV

          cat > mkxlsx.py <<'PY'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = ["polars>=1.0", "xlsxwriter>=3"]
          # ///
          import polars as pl
          pl.read_csv("src.csv").write_excel("book.xlsx")
          PY
          uv run --quiet mkxlsx.py

          shopt -s expand_aliases
          source ~/.bash_productivity

          2csv book.xlsx          # workbook -> csv, via qsv excel
          2txt src.csv            # csv -> tab-delimited, via qsv fmt
          test -f book.csv && test -f src.txt

          cat > check.py <<'PY'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = ["polars>=1.0"]
          # ///
          import sys
          import polars as pl

          src = pl.read_csv("src.csv")
          book = pl.read_csv("book.csv")
          txt = pl.read_csv("src.txt", separator="\t")

          bad = 0
          if not book.equals(src):
              print("FAIL: xlsx -> csv != source"); bad = 1
          if not txt.equals(src):
              print("FAIL: csv -> txt != source"); bad = 1
          # Excel stores every number as a double. If the workbook path ever
          # stops going through calamine, ids come back as 1.0 and this fires.
          if not str(book["id"].dtype).lower().startswith("int"):
              print(f"FAIL: xlsx id dtype is {book['id'].dtype}, expected int"); bad = 1
          print("ALL PASS" if not bad else "FAILURES")
          sys.exit(bad)
          PY
          uv run --quiet check.py

          # The exact re-quoting bash_productivity claims for `qsv fmt`, which is
          # the reason csv->txt is not `tr ',' '\t'`: a comma needs no quoting
          # once the delimiter is a tab, but an embedded quote still does.
          grep -q $'\talpha, inc\t' src.txt || {
            echo "FAIL: quoted comma should lose its quotes in tab output"; cat src.txt; exit 1; }
          grep -q 'quote""d' src.txt || {
            echo "FAIL: embedded quote should stay quoted in tab output"; cat src.txt; exit 1; }
          echo "ALL PASS"

      - name: Round-trip csv -> parquet/feather and back
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          # Quoted comma, an embedded quote, unicode, a float and an integer id.
          # The quoted comma is the case a naive `tr , \t` would corrupt, and the
          # id is the case a naive reader turns into 1.0.
          cat > t.csv <<'CSV'
          id,name,note,score
          1,"alpha, inc",plain,1.5
          2,"quote""d",café,2.5
          3,gamma,"multi
          line",3.5
          CSV

          shopt -s expand_aliases
          source ~/.bash_productivity

          2parquet t.csv
          2feather t.csv
          2pickle  t.csv
          test -f t.parquet && test -f t.feather && test -f t.pkl

          cat > check.py <<'PY'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = ["polars>=1.0", "pandas>=2.0", "pyarrow>=15"]
          # ///
          import sys
          import pandas as pd
          import polars as pl

          csv = pl.read_csv("t.csv")
          par = pl.read_parquet("t.parquet")
          fea = pl.read_ipc("t.feather")
          pkl = pd.read_pickle("t.pkl")

          bad = 0
          if not par.equals(csv):
              print("FAIL: parquet != csv"); bad = 1
          if not fea.equals(csv):
              print("FAIL: feather != csv"); bad = 1
          if len(pkl) != len(csv):
              print("FAIL: pickle row count"); bad = 1
          # The regression this exists for: ids must stay integral, not 1.0.
          if not str(par["id"].dtype).lower().startswith("int"):
              print(f"FAIL: parquet id dtype is {par['id'].dtype}, expected int"); bad = 1
          if not str(pkl["id"].dtype).lower().startswith("int"):
              print(f"FAIL: pickle id dtype is {pkl['id'].dtype}, expected int"); bad = 1
          # The quoted comma must survive as one field, not two.
          if csv["name"][0] != "alpha, inc" or par["name"][0] != "alpha, inc":
              print("FAIL: quoted comma did not survive"); bad = 1
          print("ALL PASS" if not bad else "FAILURES")
          sys.exit(bad)
          PY
          uv run --quiet check.py

      - name: Codec flag changes the output, and bad codecs are refused
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          seq 1 20000 | awk 'BEGIN{print "id,val"} {print $1 "," $1*3}' > big.csv

          shopt -s expand_aliases
          source ~/.bash_productivity

          2feather -c uncompressed big.csv && mv big.feather plain.feather
          2feather -c zstd         big.csv && mv big.feather small.feather
          plain=$(wc -c < plain.feather); small=$(wc -c < small.feather)
          echo "uncompressed=$plain zstd=$small"
          [ "$small" -lt "$plain" ] || { echo "FAIL: -c zstd did not shrink the file"; exit 1; }

          # Each of these must fail, and the shell must not treat that as success.
          if 2parquet -f -c bogus big.csv 2>/dev/null; then
            echo "FAIL: bogus parquet codec was accepted"; exit 1
          fi
          if 2feather -f -c gzip big.csv 2>/dev/null; then
            echo "FAIL: gzip was accepted as an IPC codec"; exit 1
          fi
          if 2pickle -f -c zstd big.csv 2>/dev/null; then
            echo "FAIL: pickle accepted a compression flag"; exit 1
          fi
          echo "ALL PASS"

      # The one path with two engines in it: qsv flattens the workbook to a
      # temp CSV, python reads that. Worth its own step because a leaked or
      # mis-cleaned temp file would not show up anywhere else.
      - name: Excel -> parquet, the two-engine path
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          cat > src.csv <<'CSV'
          id,name
          1,"alpha, inc"
          2,beta
          CSV
          cat > mk.py <<'PY'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = ["polars>=1.0", "xlsxwriter>=3"]
          # ///
          import polars as pl
          pl.read_csv("src.csv").write_excel("book.xlsx")
          PY
          uv run --quiet mk.py

          shopt -s expand_aliases
          source ~/.bash_productivity
          2parquet book.xlsx
          test -f book.parquet

          cat > check.py <<'PY'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = ["polars>=1.0"]
          # ///
          import sys
          import polars as pl
          src, got = pl.read_csv("src.csv"), pl.read_parquet("book.parquet")
          if not got.equals(src):
              print("FAIL: xlsx -> parquet != source"); sys.exit(1)
          if not str(got["id"].dtype).lower().startswith("int"):
              print(f"FAIL: id dtype is {got['id'].dtype}, expected int"); sys.exit(1)
          print("ALL PASS")
          PY
          uv run --quiet check.py

          # _sheet_convert makes the temp CSV with mktemp; it must clean up
          # after itself whether the conversion succeeded or failed.
          leaked=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name '2col.*' 2>/dev/null | wc -l)
          [ "$leaked" -eq 0 ] || { echo "FAIL: $leaked temp file(s) leaked"; exit 1; }
          echo "ALL PASS"

  # no bun.lock parser, so it reads package.json, sees the 5 declared servers,
  # and is blind to the ~70 packages underneath — which is where advisories
  # actually land. `bun audit` resolves the installed tree instead, and it found
  # three high-severity minimatch ReDoS advisories (GHSA-3ppc-4f35-3m26,
  # -7r86-cg39-jmmj, -23c5-xmqv-rm74) reached via
  # bash-language-server › editorconfig › minimatch, none of which GitHub
  # reported. That is what the `overrides` block in package.json pins past.
  audit:
    name: bun audit (transitive advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-bun rather than `curl https://bun.com/install | bash`. This job's
      # whole purpose is objecting to unreviewed code entering the build, so
      # piping an unpinned remote script into bash to bootstrap it was the one
      # inconsistency worth removing. The action is pinned and watched by the
      # github-actions ecosystem in dependabot.yml; the curl script is neither.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so the audit describes the committed tree rather than
      # whatever resolves today. An audit of a lockfile CI just rewrote is an
      # audit of something that was never reviewed.
      - name: Install the language servers
        run: bun install --cwd nvim/lsp-servers --frozen-lockfile

      # Fails the build on any advisory. When one turns out to be unfixable —
      # a transitive exact-pin with no upstream release, which is precisely the
      # minimatch situation — the escape hatch is `--ignore=<GHSA-id>` with a
      # comment saying why, not deleting this step. An accepted risk should be
      # written down in the same place the repo writes down its other accepted
      # costs.
      - name: No known advisories in the language server tree
        run: bun audit --cwd nvim/lsp-servers

      # yarn.lock is a GENERATED artifact whose only job is to be readable by
      # GitHub's dependency graph, which has no bun.lock parser. bun.lock stays
      # the source of truth; this proves the two agree. `bun install --yarn` is
      # deterministic, so a diff here means someone changed deps without
      # regenerating, and the dependency graph would be describing a tree that
      # no longer exists — which is worse than not having the file at all.
      - name: yarn.lock matches bun.lock
        run: |
          set -euo pipefail
          bun install --cwd nvim/lsp-servers --yarn --frozen-lockfile
          if ! git diff --exit-code -- nvim/lsp-servers/yarn.lock; then
            echo
            echo "yarn.lock is stale. Regenerate it:"
            echo "    bun install --cwd nvim/lsp-servers --yarn"
            exit 1
          fi

      # Socket's scanner runs DURING install and can abort it on a malicious or
      # typosquatted package — prevention, where bun audit and Dependabot are
      # both detection-after-disclosure. It is the only layer here that can act
      # on a package no advisory database has heard of yet.
      #
      # bunfig.toml is written here rather than committed, and that is the whole
      # design. The scanner fails CLOSED: with Socket's API unreachable,
      # `bun install` exits 1 even with a frozen lockfile and a warm cache
      # (verified). Committing bunfig.toml would put Socket's availability on the
      # critical path of `make install`, and this repo's entire premise is
      # bootstrapping locked-down and offline machines — `make link` exists
      # precisely for machines with no network. So the scan lives where a new
      # dependency actually enters the repo: CI. A fresh machine installing an
      # already-pinned lockfile with integrity hashes is fetching bytes that were
      # scanned when they were introduced.
      - name: Scan for malicious packages (Socket, CI only)
        run: |
          set -euo pipefail
          cat > nvim/lsp-servers/bunfig.toml <<'TOML'
          [install.security]
          scanner = "@socketsecurity/bun-security-scanner"
          TOML
          # Free mode — no SOCKET_API_KEY, no account, no secret to leak.
          rm -rf nvim/lsp-servers/node_modules
          bun install --cwd nvim/lsp-servers --frozen-lockfile
          rm -f nvim/lsp-servers/bunfig.toml

  # ── the toolchain is bun and uv, and stays that way ────────────────────────
  # Not "nvim without node" any more — nvim never wants node now, so there is no
  # special mode to exercise. What needs guarding is the invariant: that nothing
  # quietly reintroduces node, npm, pip or a shim, and that the servers really do
  # run under bun.
  toolchain:
    name: bun-only toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and Dependabot-watched, rather than piping an unpinned installer
      # script into bash. Note this puts bun somewhere other than ~/.bun/bin, so
      # the handshake step below resolves it with `command -v` rather than
      # assuming a path.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: deps.conf declares no node, npm or pip
        run: |
          fail=0
          source lib/manifest.sh
          # provider column
          if manifest_lines tool | grep -qP '\tnpm\t'; then
            echo "npm provider reintroduced in deps.conf"; fail=1
          fi
          # command column — node itself, and pip under any provider
          while IFS=$'\t' read -r section provider cmd pkg; do
            case "$cmd" in
              node|npm|npx|pip|pip3) echo "[$section] '$cmd' reintroduced"; fail=1 ;;
            esac
          done < <(manifest_lines tool)
          [ $fail -eq 0 ] && echo "clean: no node, npm or pip in the manifest"
          exit $fail

      - name: No node shim anywhere in the repo
        run: |
          # Aliasing node to bun would make incompatibilities surface as errors
          # blaming the wrong tool. If someone adds one, this should fail.
          if grep -rnE '(ln -s.*\bbun\b.*/node|exec bun "\$@")' \
               --include='*.sh' --include='*.lua' --include='*.conf' . ; then
            echo "a node->bun shim was introduced — see lsp_servers.lua for why not"
            exit 1
          fi
          echo "clean: no node shim"

      # Server definitions live in lua/external/lsp_servers.lua rather than inline
      # in the plugin spec precisely so they can be tested like this: `--clean`
      # loads no plugins, so there's no 26-repo clone and no treesitter compile
      # standing between the assertion and the cmd lines it's about.
      # NOT `apt-get install neovim`. Ubuntu 24.04 ships 0.9.5, and this config
      # documents 0.10+ — lsp_servers.lua uses vim.fs.joinpath, added in 0.10.
      # So the apt version failed every run with "attempt to call field
      # 'joinpath' (a nil value)", which read as a broken config rather than as
      # CI testing against a version the config never claimed to support.
      #
      # Pinned and sha256-verified, the same treatment lemminx gets in
      # nvim/deps.sh. Bump both the version and the hash together; a mismatch
      # should stop the job, not be worked around.
      - name: Install neovim (pinned)
        env:
          NVIM_VERSION: v0.12.4
          NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
        run: |
          set -euo pipefail
          url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/nvim.tar.gz "$url"
          echo "${NVIM_SHA256}  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Unit-test the language server definitions
        run: |
          nvim --version | head -1
          make test

      # The language servers must work with no node and no npm anywhere — that
      # is the entire point of moving them out of Mason. Asserted with a real
      # LSP initialize handshake, because weaker checks (--version, exit codes)
      # give false readings on several of these servers.
      - name: LSP servers handshake under bun, with node/npm absent
        run: |
          bun install --cwd nvim/lsp-servers --frozen-lockfile
          MIN=$(mktemp -d)
          for b in sh bash env timeout bun; do ln -sf "$(command -v $b)" "$MIN/$b"; done
          ! PATH=$MIN command -v node
          ! PATH=$MIN command -v npm
          PATH=$MIN bun nvim/lsp-servers/verify.ts | tee /tmp/lsp.txt
          grep -q "ALL PASS" /tmp/lsp.txt

      # Integration signal, deliberately advisory: this boots the real plugin
      # stack, so a failure is as likely to be a flaky clone or an upstream
      # plugin change as a bug here. The steps above are what gate the build.
      #
      # No PATH stripping — that made sense when node-absent was a special case.
      # It is now the only case, so this just checks the editor boots and every
      # server is registered.
      - name: nvim boots and registers its servers (advisory)
        continue-on-error: true
        run: |
          make link nvim
          timeout 600 nvim --headless -c "lua
            local names = vim.tbl_keys(require('external.lsp_servers').build())
            table.sort(names)
            print('configured: ' .. table.concat(names, ', '))
            print('mason loaded: ' .. tostring(package.loaded['mason'] ~= nil))
          " -c "qa!" 2>&1 | tee /tmp/nvim.txt
          grep -q "mason loaded: false" /tmp/nvim.txt
          for s in clangd lua_ls lemminx ts_ls cssls html jsonls yamlls bashls; do
            grep -q "$s" /tmp/nvim.txt || { echo "server $s not configured"; exit 1; }
          done

  # ── Windows host ───────────────────────────────────────────────────────────
  # The only job that executes the PowerShell entry point. Every other job here
  # runs on Linux or macOS, where windows/install.ps1 is unreachable — so
  # without this, a syntax error in it ships and is discovered by whoever next
  # bootstraps a Windows machine, which is the worst possible time.
  windows:
    name: windows (link only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The mklink fallback cannot be reached on this runner - CI runs elevated,
      # so New-Item succeeds and the catch block never executes. What IS worth
      # guarding is the invocation form, because the fragile part is quoting:
      # the real destination lives under %USERPROFILE%, which routinely contains
      # a space ("C:\Users\Riley Oest\..."), and building one command string
      # instead of passing each path as its own argument silently produces a
      # link with a truncated name.
      - name: mklink invocation survives a path with a space
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'a b c'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $target = Join-Path $dir 'the target.txt'
          Set-Content -LiteralPath $target -Value 'payload'
          $link = Join-Path $dir 'the link.txt'

          & cmd.exe /c mklink $link $target 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath $link)) { throw 'mklink reported success but made no link' }
          if ((Get-Content -LiteralPath $link) -ne 'payload') { throw 'link does not resolve to the target' }

          $srcDir = Join-Path $dir 'src dir'
          New-Item -ItemType Directory -Path $srcDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $srcDir 'f.txt') -Value 'in dir'
          $linkDir = Join-Path $dir 'link dir'
          & cmd.exe /c mklink /D $linkDir $srcDir 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /D failed (exit $LASTEXITCODE)" }
          if ((Get-Content -LiteralPath (Join-Path $linkDir 'f.txt')) -ne 'in dir') {
            throw 'directory link does not resolve'
          }
          Write-Host 'ok: mklink handles spaces for both a file and a directory'

      # `shell: powershell` is Windows PowerShell 5.1, deliberately, NOT pwsh 7.
      # 5.1 is what a fresh box runs when the bootstrap line is pasted, and it
      # is where the syntax these scripts avoid (ternaries, ??, $IsWindows,
      # multi-arg Join-Path) would actually blow up.
      - name: PowerShell parses under 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @('bootstrap.ps1', 'windows\install.ps1', 'windows\deps.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref] $null, [ref] $errors)
            if ($errors) {
              # Line and column, not just the message. A parse error reported
              # without a position is nearly useless when the only machine that
              # can reproduce it is this runner.
              foreach ($e in $errors) {
                Write-Host ('{0}({1},{2}): {3}' -f $f,
                  $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
                Write-Host ('    >>> ' + $e.Extent.Text)
              }
              $bad = 1
            }
          }
          exit $bad

      - name: install.ps1 -LinkOnly
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\install.ps1 -LinkOnly

      - name: The Windows config is in place and matches the repo
        shell: powershell
        run: |
          $dest = Join-Path $env:USERPROFILE '.config\wezterm\wezterm.lua'
          if (-not (Test-Path -LiteralPath $dest)) { throw "not installed: $dest" }
          # Accept either a symlink or the copy fallback: whether symlink
          # creation is permitted depends on the runner's privileges, and both
          # outcomes are correct behaviour. What must hold is the CONTENT.
          $got  = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash
          $want = (Get-FileHash -LiteralPath '.\wezterm\wezterm-windows.lua' -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "content differs from wezterm/wezterm-windows.lua" }
          Write-Host "ok: $dest"

      # This used to guard a parser: the bash side reads a section with no
      # `platform` line as "every platform", and a PowerShell parser inheriting
      # that reading would link bashrc into %USERPROFILE%. There is no second
      # parser now, so the failure it caught cannot happen the same way.
      #
      # Kept because the risk moved rather than left. install.ps1's $Links
      # table is hand-written, and a Linux destination pasted into it would be
      # installed without anything else objecting.
      - name: install.ps1 links only Windows destinations
        shell: powershell
        run: |
          # Asserts on what install.ps1 REPORTED, not on whether these paths
          # exist. The runner image ships its own %USERPROFILE%\.gitconfig, so
          # "must not exist" would fail for a reason that has nothing to do
          # with this repo.
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\install.ps1 -LinkOnly | Out-String
          Write-Host $out
          foreach ($leaked in @('.bashrc', '.gitconfig', 'nvim')) {
            if ($out -match [regex]::Escape($leaked)) {
              throw "install.ps1 touched a non-windows destination: $leaked"
            }
          }
          if ($out -notmatch 'wezterm\.lua') { throw 'install.ps1 did not link the wezterm config' }
          Write-Host 'ok: only windows sections were linked'

      - name: Re-running is idempotent
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\install.ps1 -LinkOnly
          if ($LASTEXITCODE -ne 0) { throw "second run exited $LASTEXITCODE" }
          $dest = Join-Path $env:USERPROFILE '.config\wezterm\wezterm.lua'
          $got  = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash
          $want = (Get-FileHash -LiteralPath '.\wezterm\wezterm-windows.lua' -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "second run left the wrong content in place" }
          Write-Host 'ok: idempotent'
