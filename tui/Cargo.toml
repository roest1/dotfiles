[workspace]
resolver = "2"
members = ["dots"]
# Submodules, each its own package pinned by its own Cargo.lock: roest1/theme-tui
# (font, which dots also uses by path) and roest1/github-tui.
exclude = ["font", "github"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
# The framework, roest1/tui-core. Cargo.lock pins the commit; every crate here uses
# this one spec, so they share one copy (dots pushes font's screen onto its stack).
tui-core = { git = "https://github.com/roest1/tui-core", branch = "main" }
crossterm = "0.29"
