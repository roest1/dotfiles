[package]
name = "github"
description = "GitHub for the machine you are on — your repos, then everything about one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "github"
path = "src/lib.rs"

[[bin]]
name = "github"
path = "src/main.rs"

[dependencies]
reticle = { path = "../reticle" }
libc = "0.2"
# The 67 jq programs the fzf implementation spent describing the Actions API,
# replaced by one set of typed structs. See the header of src/model.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
