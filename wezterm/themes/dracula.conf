# Dracula, from Mofiqul/dracula.nvim's palette, which is the plugin nvim loads:
# bg, black, purple, menu, selection, fg and comment.
#
# Two are not Dracula colors. `overlay` is a step lighter than the background,
# for hover. `subtle` is halfway between comment and foreground, for the one
# place the tab bar wants something quieter than text.
base = #282a36
tab_active = #191a21
accent = #bd93f9
surface = #21222c
overlay = #343746
highlight_med = #44475a
text = #f8f8f2
muted = #6272a4
subtle = #adb5cb
