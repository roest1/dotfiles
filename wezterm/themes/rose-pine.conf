# Rosé Pine (main). The default: wezterm.lua carries these same nine colors as
# a table, so the terminal has them before this directory is linked. CI holds
# the two to each other.
#
# A theme is these nine keys and nothing else. `theme` lists this directory for
# the shell lane and draws its preview from the file; wezterm.lua reads the one
# `shell.colors` names in ~/.config/dotfiles/theme.conf.
base = #191724
tab_active = #0c0b13
accent = #c4a7e7
surface = #1f1d2e
overlay = #26233a
highlight_med = #403d52
text = #e0def4
muted = #6e6a86
subtle = #908caa
