#####################################################################
# deps.conf — everything this repo installs or links, in one file.
#
# Toggling is commenting. There is no flag to remember and no profile
# vocabulary: to skip something, put a `#` in front of it.
#
#   make install              every section
#   make install nvim         one section (repeatable: `make install bash nvim`)
#   make link                 links only — no sudo, no network, no downloads
#   make check                verify what's enabled here is actually present
#
# Line types (whitespace-separated, `~` expands to $HOME):
#
#   link      <repo-path>           <dest>
#   tool      <provider>  <command>  [package]   package defaults to command
#   post      <shell command>                    run after the section's tools
#
# Every section here runs on every platform this file describes, which is
# Linux and macOS. There is no per-section platform restriction, because
# the only thing that ever needed one was the Windows host's wezterm —
# and that now lives in windows/install.ps1, which reads no manifest. See
# the note under [wezterm].
#
# Providers:
#   pkg     the system package manager (brew / apt / dnf)
#   mise    mise-en-place — for tools distros don't reliably carry
#   uv      uv tool install   (Python tools; replaces pip)
#   cargo   cargo install     (compiles from source — slow; prefer mise)
#   manual  not installable from here — declares that an official installer or
#           extracted build is an acceptable source. The real install goes in
#           the section's deps.sh. Use it so `make status` doesn't flag a
#           correct state as drift.
#
# There is no `winget` provider. Windows is installed by
# windows/install.ps1, which declares its own payload and never reads
# this file.
#
# A provider can declare a fallback with `||`, tried left to right:
#   tool  pkg||cargo  eza
#####################################################################



#####################################################################
# [bash] — the shell itself.
#
# `pkg` first, everywhere it can be: the fallbacks on eza and zoxide exist
# for distros that don't carry them, not as a preference. The point is that
# this section installs on a locked-down machine without needing node or a
# curl-piped installer.
#
# qsv is the one tool that has no `pkg` route at all — no distro ships it —
# so it is stated plainly rather than hidden behind a `||`. That is a real
# dent in the property above, and it is affordable for one reason:
# run_tools calls provider_install with `|| true`, so on a box where mise
# can't run, qsv warns and every other tool in this section still installs.
# The shell degrades rather than the install failing.
#####################################################################
[bash]

link  bash/bashrc             ~/.bashrc
link  bash/bash_theme         ~/.bash_theme
link  bash/bash_productivity  ~/.bash_productivity
link  bash/bash_git           ~/.bash_git
link  bash/bash_github        ~/.bash_github
link  git/gitconfig           ~/.gitconfig

# `pkg` first again, which is this file's usual preference. It was `mise||pkg`
# for a version floor: `github` needed fzf >= 0.65 for --listen, the
# start/focus events and --style/--footer, and apt carries 0.29 (22.04) and
# 0.44 (24.04). `github` is a Rust binary now (tui/github) and uses no fzf,
# and the menu wrappers in bash_productivity went with it. All that is left is
# fzf's own Ctrl+R / Ctrl+T / Alt+C integration, which works on any version --
# bash_productivity falls back to the packaged completion script on an fzf too
# old for `--bash`. So: one binary from the distro, mise only where pkg cannot
# serve. See bash/deps.sh for why the floor is not coming back.
tool  pkg||mise   fzf
tool  pkg         rg          ripgrep
tool  pkg         fd          fd-find
tool  pkg         bat
tool  pkg||cargo  eza
tool  pkg         gh
tool  pkg         jq
tool  pkg||manual  zoxide      # curl installer fallback in bash/deps.sh

# ── compress / extract (bash_productivity) ──────────────────────────
#
# tar is not declared: it is on every machine this repo targets, and a
# section that can't tar can't install anything either.
#
# zstd is the one that earns its line. On a 12M CSV, `zstd -3` is both
# smaller and 8x faster than `gzip -9` — .tar.zst is what compress
# reaches for by default, and extract needs zstd to read it back.
#
# pigz is pure speed on a format we'd support anyway (33ms vs gzip's
# 342ms on the same input); compress picks it up automatically when it
# is there and falls back to gzip when it isn't. zip is here for the
# format other people ask you for, not one you'd choose.
tool  pkg  zstd
tool  pkg  pigz
tool  pkg  zip

# ── 2csv / 2txt / 2xlsx (bash_productivity) ─────────────────────────
#
# qsv wraps the calamine parser, which is what makes one tool enough:
# xlsx, xlsm, xlsb, legacy BIFF .xls and ods all read through the same
# code path, with no Excel, no LibreOffice and no Python involved.
#
# mise resolves it through aqua as a checksum-verified prebuilt, so this
# is a download rather than the long compile `cargo install qsv` would be.
# cargo stays as the fallback for a machine mise can't serve.
tool  mise||cargo  qsv

# 2xlsx only. qsv reads .xls perfectly but cannot *write* xlsx — this
# build has no `to` subcommand — so producing a real .xlsx needs a second
# tool. ssconvert does a true conversion: multiple sheets, formatting and
# formulas survive, which a round-trip through CSV would flatten.
#
# Off by default because it is ~25MB of gnumeric for a direction you may
# never need: .xls already converts straight to csv/txt via qsv, and the
# usual reason to want .xlsx first — openpyxl and pandas cannot read .xls
# — does not apply here. Uncomment if you need to hand someone a real
# workbook. 2xlsx guards on `command -v` and says this if it's missing.
# tool  pkg  ssconvert  gnumeric

# ── 2parquet / 2feather / 2pickle (bash_productivity) ───────────────
#
# uv is NOT declared here. It has its own section below, and the move was
# forced by this section's own invariant: [bash] installs on a locked-down
# box without a curl-piped installer, and uv can no longer be a `pkg` line
# (see [uv] for why). Leaving it here as `manual` would have quietly made
# the shell section depend on curl, which is the one thing it may not do.
#
# So the three columnar commands degrade instead, the same way 2xlsx does
# without gnumeric: they guard on `command -v uv` and say what to install.
# That is a section boundary rather than a dent — a machine that leaves
# `uv` out of ~/.config/dotfiles/sections has chosen this, and every other
# thing in [bash] still installs.
#
# There is no line for polars or pandas anywhere, on purpose. bash/tabular.py
# carries its own dependencies in a PEP 723 header and `uv run` builds a
# cached environment from it, so the python packages are declared where
# they are used instead of in a manifest that would have to be kept in
# step by hand. Nothing is installed system-wide and there is still no
# pip in this repo.


#####################################################################
# [uv] — the Python toolchain, and the one tool this repo installs
# from its official installer BY PREFERENCE rather than as a fallback.
#
# Everywhere else `manual` means "pkg couldn't serve this". Here it means
# the distro package is the wrong artefact, and the difference is a
# capability rather than a version number:
#
#   $ uv self version
#   uv 0.11.32
#   $ uv self update
#   error: uv was installed through an external package manager and
#   cannot update itself.
#
# uv ships weekly and Astral treats `uv self update` as the supported
# path. A distro build has that compiled out, so the tool that is
# designed to keep itself current is pinned to the distro's cadence —
# Fedora 44 sat a full minor behind (0.11.32 vs 0.12.9) with no way to
# close the gap short of waiting for a package bump.
#
# This is the same exception [nvim] makes for neovim, one step further.
# There the distro was merely behind a floor, so `mise||pkg` sufficed.
# Here no provider in this repo's vocabulary produces the right binary,
# which is what `manual` is for. The install is uv/deps.sh -> ensure_uv
# (lib/pkg.sh), which curls astral.sh and falls back to `pkg` only when
# the network is unreachable — a stale uv beats no uv on a locked-down
# box, and that ordering is the whole reason the preference lives in a
# helper instead of a `||` chain. Chains are tried before any deps.sh
# runs, so `manual||pkg` would have installed the distro copy first and
# never reached the installer it is supposed to prefer.
#
# ensure_uv short-circuits on `command -v`, so it will NOT install a
# second copy over a distro one that is already there. That case is
# reported instead: two uvs on PATH is the failure in
# docs/decisions/tool-duplication.md, and removing a system package is
# not this repo's to do. uv/deps.sh prints the one command that fixes it.
#
# ── the config half ─────────────────────────────────────────────────
#
# uv.toml is here because of the same move. Both settings in it came
# from /etc/uv/uv.toml, which the Fedora RPM owns — so uninstalling that
# package to get a self-updatable uv also silently reverts
# python-downloads and python-preference to uv's defaults on that one
# machine. Tracking them at user level makes the behaviour a property of
# this repo instead of a property of whichever package manager happened
# to install uv, which is the point of the file you are reading.
#####################################################################
[uv]

link  uv/uv.toml   ~/.config/uv/uv.toml

tool  manual  uv    # official installer — see uv/deps.sh


#####################################################################
# [nvim] — editor config and toolchain.
#
# `nvim` is a symlink to this repo's nvim/ directory, so the config is
# version-controlled in place.
#####################################################################
[nvim]

link  nvim                    ~/.config/nvim

# mise FIRST, which is the opposite of this file's usual preference, and the
# reason is ordering rather than taste.
#
# With `pkg||mise`, a fresh Ubuntu installed apt's neovim 0.9.5, succeeded, and
# stopped — then nvim/deps.sh discovered 0.9.5 was below the 0.12 floor and
# installed a second neovim through mise. Two editors on the machine because the
# wrong one went first. Reversing the order means apt's 0.9.5 is never installed
# at all: mise provides 0.12.4 directly and there is only ever one.
#
# It also fixes the restricted-machine case. pkg_install shells out to
# `sudo apt install`; mise installs under ~/.local/share/mise and needs no root.
# On a box where you only have your own account, `pkg` cannot work, so having it
# first meant failing a sudo prompt before reaching the provider that would have
# worked. `make link` exists for exactly those machines; this matches it.
#
# And it follows this repo's own rule rather than breaking it — "prefer pkg for
# anything the distro ships, mise for tools distros don't reliably carry."
# Ubuntu 24.04 shipping 0.9.5 against a 0.12 floor is the definition of not
# reliably carried.
#
# Cost, stated plainly: on Fedora, whose dnf has 0.12.4, nvim now comes from mise
# even though the distro package would have been fine. One current editor from a
# checksum-verified source (mise's aqua backend) is worth more than distro
# provenance here. `pkg` is still the fallback if mise is unavailable.
tool  mise||pkg  nvim        neovim
tool  pkg   git
tool  pkg   make
tool  pkg   unzip
tool  pkg   rg          ripgrep
tool  pkg   fd          fd-find

tool  mise||cargo  stylua

# cargo sits ahead of mise here, which is the opposite of the preference
# everywhere else in this file, and glibc is the reason. RHEL 9 is on glibc 2.34;
# mise's prebuilt tree-sitter-cli is not guaranteed to run against it, whereas
# cargo compiles against whatever the machine has and therefore always works.
# It's also the state RHEL boxes are already in, so this stops `make status`
# reporting a working cargo install as drift. mise stays as the third option for
# machines with no distro package and no rust toolchain.
tool  pkg||cargo||mise  tree-sitter   tree-sitter-cli

tool  uv||pkg  ruff

# shellcheck is both halves of one job. CI lints every shell source in this repo
# with it, and bash-language-server picks it up from PATH automatically — so
# declaring it means the diagnostics you get while editing bashrc are the same
# ones that gate the merge, rather than a surprise at push time.
tool  pkg||mise  shellcheck

# ── Language servers ────────────────────────────────────────────────
# The JS-based ones aren't here: they're npm packages, declared in
# nvim/lsp-servers/package.json and installed by the post step below.
# These three are native binaries with no JS runtime involved.
tool  pkg     clangd        clang-tools-extra
tool  mise    lua-language-server
tool  manual  lemminx       # no package manager has it — nvim/deps.sh
                            # fetches it from redhat-developer/vscode-xml
                            # and verifies the published sha256

# ── formatters and linters ──────────────────────────────────────────
# prettierd and eslint_d were npm globals and are gone with node. prettier came
# back, but not as a global: it's declared in nvim/lsp-servers/package.json and
# run as `bun <path>`, exactly like the language servers. See formatter.lua —
# it must use --write rather than --stdin-filepath, because prettier's stdin
# mode silently produces nothing under bun.
# stylua (Lua) and ruff (Python) are declared above; both are native
# binaries from mise and uv respectively.
#
# If JS/TS formatting is wanted again, add it to
# nvim/lsp-servers/package.json and run it through bun — the same way the
# language servers work. Do NOT reintroduce npm.

# bun is the editor's runtime, not a project runtime: the six JS language
# servers and prettier are run as `bun <path>`, and the post step below is
# useless without it. Declaring it here is what makes `make install nvim` alone
# produce a working editor — run_post only warns when a post step fails, so a
# missing bun previously yielded a "successful" install with six silently dead
# language servers. Overlapping declarations are safe and already the norm here
# (rg and fd sit in both [bash] and [nvim]); every installer short-circuits on
# `command -v`.
tool  mise||manual  bun        # mise pins it; bun's own installer also fine

# --frozen-lockfile, because everything else assumes this tree is THE tree.
# bun.lock is what `bun audit` gates on, what the Socket scanner checks in CI,
# and what yarn.lock mirrors for GitHub's dependency graph. A non-frozen install
# is free to resolve something else on a fresh machine, which would quietly make
# all three describe a tree that isn't the one you're running. It also fails
# loudly when package.json and bun.lock disagree — the correct failure.
post  bun install --cwd nvim/lsp-servers --frozen-lockfile

post  make -C nvim sync


#####################################################################
# [wezterm] — terminal emulator.
#
# NOTE: wezterm.lua declares the `mux` unix domain that the Jarvis
# sidecar connects to (JARVIS_WEZTERM_DOMAIN defaults to 'mux' in
# jarvis-ui/server/workerSession.ts). Don't replace this config with a
# stock default — the GUI attach depends on that domain name.
#####################################################################
[wezterm]

link  wezterm/wezterm.lua     ~/.config/wezterm/wezterm.lua

# The half of the config that is identical on every platform: fonts, the SGR 6
# carrier, the rose-pine surfaces. wezterm.lua and wezterm-windows.lua each
# dofile() it out of their own config_dir, so it has to land NEXT TO them —
# which is why it is a link of its own rather than something either entry point
# reaches into the repo for. The Windows half is the matching $Links row in
# windows/install.ps1; drop either and that platform silently falls back to an
# unstyled terminal.
link  wezterm/shared.lua      ~/.config/wezterm/shared.lua

# Science Gothic Mono, which `make` output is rendered in. Linked as a
# directory (like nvim/) and read by wezterm.lua's font_dirs rather than
# installed into the system font path — that keeps one copy, on every OS,
# with no fc-cache and no ~/Library/Fonts vs ~/.local/share/fonts split.
# The .ttf files are generated by wezterm/mkmono.py and committed; nothing
# is built at install time. Regenerate with `make mono-font`.
link  wezterm/fonts           ~/.config/wezterm/fonts

tool  pkg||manual  wezterm     # not in Fedora/Ubuntu repos — see wezterm/deps.sh

# The Windows host's wezterm is NOT declared here. It lives in the
# `$Links` and `$WingetTools` tables at the top of windows/install.ps1.
#
# It used to be a `platform windows` section, which meant a second
# manifest parser in PowerShell — ~130 lines to describe one symlink and
# one winget package — plus a `platform` mechanism in lib/manifest.sh
# whose only job was keeping the two entry points from fighting over
# ~/.config/wezterm/wezterm.lua, which both sections named. Declaring
# the Windows payload where the Windows installer can read it directly
# retires the parser, the mechanism and the conflict together.
#
# The split between the two configs is still the shape of the machine
# rather than a workaround: the Windows host and the WSL guest are two
# environments, you edit code in one of them, and wezterm-windows.lua's
# whole job is getting you into it.


#####################################################################
# [tui] — the Rust terminal UIs.
#
# One crate per screen, one binary per command: `font` today, `github`
# and the `make it` console next. They share tui/reticle — the nav
# contract and the animated reticle — and nothing else, because nothing
# else is common between a font picker and a CI dashboard.
#
# `manual`, not `cargo`, and the difference is not cosmetic. The cargo
# provider runs `cargo install <name>`, which resolves against
# crates.io — and `font` is a name someone else already owns there. It
# would install a stranger's crate and report success. These are local
# paths, so the install lives in tui/deps.sh where a path can be said.
#
# Rust is also the repo's first compile-at-install dependency, which is
# a real cost and worth naming. It is affordable here for the reason it
# was not for tree-sitter: nothing else provides these binaries, so
# there is no faster route being passed over. If the compile becomes
# annoying, the way out is the lemminx pattern — build in CI, publish
# to releases, fetch and verify a sha256 — not a different language.
#####################################################################
[tui]

# cargo is REQUIRED here, not preferred. These binaries are built from the
# tree, so there is no route to them without a toolchain — and `make check tui`
# should say that BEFORE a build fails rather than after.
#
# A hard requirement is affordable because opting out is now a real, durable
# choice: leave `tui` out of ~/.config/dotfiles/sections and this section is
# never swept. An offline machine simply does not select it, and
# `make install bash nvim` keeps working exactly as before.
#
# `manual` and not `pkg`, which is this file's usual preference and the same
# exception [nvim] makes for the same reason: the workspace sets a rust-version
# floor, distro rust lags it, and a toolchain too old to build the tree fails
# at the end of a long install instead of the start. tui/deps.sh calls
# ensure_cargo (lib/pkg.sh), which installs rustup when it has to — the same
# route uv, mise and zoxide already take when no package manager serves them.
tool  manual  cargo

tool  manual  font        # cargo install --path tui/font — see tui/deps.sh

# The console. `manual` for the same reason font is -- cargo install resolves
# by crate NAME against crates.io, and this one builds from a path in the tree.
#
# Named for what it manages, like font: you run `dots` to manage your dotfiles.
# It is NOT a make target, deliberately. `make font` does not exist either, and
# a second name for one thing is the drift this repo keeps deleting -- `make
# help` points at it instead, which is the discoverability a bare binary would
# otherwise lose.
tool  manual  dots

# The github screens. `manual` for the same reason font and dots are, with one
# extra edge this time: `github` is also a name on crates.io that somebody else
# owns, so a `cargo` line here would fetch a stranger's crate and report
# success.
#
# It arrived last because it had a precondition rather than a schedule: the
# bash implementation it replaces was 2500 lines and seven screens, and
# "we won't lose any functionality" is not a claim anybody can check from
# memory. docs/decisions/github-parity.md holds the row-per-verb table that
# answered it.
tool  manual  github


#####################################################################
# [claude] — Claude Code USER scope: the settings and the memory file
# that apply on every machine, regardless of which repo you are in.
#
# The directory here is `claude/`, NOT `.claude/`, and the missing dot
# is load-bearing rather than cosmetic.
#
# Claude Code reads a `.claude/settings.json` sitting in the current
# repo as that repo's PROJECT settings, on top of the user settings in
# ~/.claude/settings.json. Storing this file at `.claude/settings.json`
# and also linking it to ~/.claude/settings.json would therefore feed
# the same file to both scopes whenever you are working inside this
# repo — and hook arrays MERGE across scopes rather than override, so
# every hook below would be registered twice and fire twice here and
# nowhere else. A no-op printf survives that; the next hook might not.
#
# `claude/` is invisible to that lookup, so the file is only ever user
# settings. It also matches every other line in this manifest: the repo
# side never carries the dot, the destination does.
#
# The hooks it carries publish Claude's session state to wezterm as an
# OSC 1337 user var, which wezterm/wezterm.lua reads in
# format-tab-title to pick the per-tab status glyph. That is why this
# section is next to [wezterm]: the two halves are one feature, and
# unlinking either one silently degrades the tab bar to "stopped".
#
# ── user-memory.md, and why it is not named CLAUDE.md ───────────────
#
# The destination IS ~/.claude/CLAUDE.md. The repo side deliberately
# is not, which breaks this file's usual naming (repo carries the
# undotted name, destination adds the dot) for the same reason the
# paragraph above drops the dot from the directory — a second scope
# would pick the file up.
#
# Claude Code loads a CLAUDE.md sitting in a SUBDIRECTORY as context
# whenever it reads files in that subtree. This repo relies on that:
# nvim/CLAUDE.md and tui/CLAUDE.md exist precisely so the docs sit
# next to the code they describe. So a `claude/CLAUDE.md` would load
# as directory memory every time you edited claude/settings.json — on
# top of the identical text already loaded as user memory, since the
# two are the same file through the symlink. Harmless the day it
# happens, and it would quietly make this repo the one place where
# your global prompt is stated twice.
#
# On macOS it is worse than a convention: APFS is case-insensitive by
# default, so even `claude/claude.md` would match the lookup. The name
# has to differ by more than its case. `user-memory.md` is what
# Claude Code's own docs call this scope.
#
# ── what is NOT here, and must not be added ─────────────────────────
#
# ~/.claude holds far more than config, and the split is by whether a
# path is the SAME on every machine, not by whether it looks useful:
#
#   portable, and fair game for a link line
#     CLAUDE.md, settings.json, agents/, commands/, output-styles/,
#     and skills you wrote (NOT skills/synced/, which is a cache).
#
#   machine-local or secret — never link, never track
#     .credentials.json, sessions/, history.jsonl, projects/ (your
#     transcripts and memory), session-env/, shell-snapshots/,
#     file-history/, backups/, plugins/*cache*, state/, statsig.
#
# That is why there is no `link claude ~/.claude` line, which looks
# like the tidy version of this section and would publish the whole
# second list into a PUBLIC repo on the first `make link`.
#
# The hooks block also carries SessionStart and SessionEnd, which call
# tools/refresh-claude-settings.sh. That is cosmetic rather than
# load-bearing -- it clears the false "modified" git reports on
# settings.json because the clean filter makes the worktree file and
# its blob different sizes -- but it is in this file rather than in a
# machine's git config because the writer is Claude Code, so only
# Claude Code knows when to run it.
#
# ── attribution: what is off, what is still on ──────────────────────
#
# settings.json carries `attribution.commit = ""`, which drops the
# Co-Authored-By trailer from commit messages, plus the deprecated
# `includeCoAuthoredBy: false` for a machine on an older build that
# knows only that key.
#
# The other two are deliberately LEFT ON. They are written here rather
# than next to the values because settings.json cannot hold a comment:
# the clean filter pipes it through `jq -S`, which exits 5 on a comment
# and so falls back to pass-through, and Claude Code rewrites the whole
# file on its own anyway. (A dummy "//" key would survive jq but not
# necessarily that rewrite -- and if it were stripped, settings.json
# would read dirty forever, which is the exact thing
# tools/refresh-claude-settings.sh exists to stop.)
#
#   attribution.pr         the "Generated with Claude Code" line at the
#                          bottom of pull request descriptions.
#                          Set to "" to drop it.
#
#   attribution.sessionUrl the Claude-Session trailer, and the matching
#                          PR-body link, on commits and PRs made from a
#                          web or Remote Control session. Defaults true.
#                          Set to false to drop it.
#
# Write the OBJECT form, never `"attribution": false`. Older Claude Code
# rejects a boolean there and then skips the ENTIRE settings file --
# taking the permission denies and the wezterm hooks above with it, for
# a cosmetic preference.
#
# This block is the doc home for claude/ because the section cannot have
# a CLAUDE.md of its own; see the naming note above.
#
# user-memory.md is also the one tracked file Claude Code rewrites
# WITHOUT you opening an editor — a `#` memory-add during any session,
# in any repo, lands here. tools/check-content.sh guards the half of
# that a program can prove; see its header for the half it cannot.
#####################################################################
[claude]

link  claude/settings.json     ~/.claude/settings.json
link  claude/user-memory.md    ~/.claude/CLAUDE.md
