#####################################################################
# deps.conf — everything this repo installs or links, in one file.
#
# Toggling is commenting. There is no flag to remember and no profile
# vocabulary: to skip something, put a `#` in front of it.
#
#   make install              every section
#   make install nvim         one section (repeatable: `make install bash nvim`)
#   make link                 links only — no sudo, no network, no downloads
#   make check                verify what's enabled here is actually present
#
# Line types (whitespace-separated, `~` expands to $HOME):
#
#   link  <repo-path>           <dest>
#   tool  <provider>  <command>  [package]     package defaults to command
#   post  <shell command>                      run after the section's tools
#
# Providers:
#   pkg     the system package manager (brew / apt / dnf)
#   mise    mise-en-place — for tools distros don't reliably carry
#   npm     npm -g            (requires node)
#   uv      uv tool install   (Python tools; replaces pip)
#   cargo   cargo install     (compiles from source — slow; prefer mise)
#   manual  not installable from here — declares that an official installer or
#           extracted build is an acceptable source. The real install goes in
#           the section's deps.sh. Use it so `make status` doesn't flag a
#           correct state as drift.
#
# A provider can declare a fallback with `||`, tried left to right:
#   tool  pkg||cargo  eza
#####################################################################



#####################################################################
# [bash] — the shell itself.
#
# Deliberately pure `pkg`: every tool here comes from the system package
# manager, so this section installs on a locked-down machine without
# needing mise, node, or any curl-piped installer.
#####################################################################
[bash]

link  bash/bashrc                   ~/.bashrc
link  bash/bash_roest_theme         ~/.bash_roest_theme
link  bash/bash_roest_productivity  ~/.bash_roest_productivity
link  bash/bash_roest_git           ~/.bash_roest_git
link  bash/bash_roest_github        ~/.bash_roest_github
link  git/gitconfig                 ~/.gitconfig

tool  pkg         fzf
tool  pkg         rg          ripgrep
tool  pkg         fd          fd-find
tool  pkg         bat
tool  pkg||cargo  eza
tool  pkg         gh
tool  pkg         jq
tool  pkg||manual  zoxide      # curl installer fallback in bash/deps.sh


#####################################################################
# [nvim] — editor config and toolchain.
#
# `nvim` is a symlink to this repo's nvim/ directory, so the config is
# version-controlled in place.
#####################################################################
[nvim]

link  nvim                    ~/.config/nvim
link  bash/bash_roest_nvim    ~/.bash_roest_nvim

tool  pkg   nvim        neovim
tool  pkg   git
tool  pkg   make
tool  pkg   unzip
tool  pkg   rg          ripgrep
tool  pkg   fd          fd-find

tool  mise||cargo  stylua
tool  pkg||mise  tree-sitter   tree-sitter-cli

tool  uv||pkg  ruff

# ── node-dependent block ────────────────────────────────────────────
# Comment out everything down to the next blank line on a machine where
# node isn't allowed. nvim still works; it degrades rather than breaking,
# because lsp.lua gates the npm-backed servers on `executable('node')`.
#
#   Keeps:  clangd (C/C++), lua_ls (Lua), lemminx (XML), stylua
#   Loses:  ts_ls, cssls, html, jsonls, yamlls, bashls, plus prettier,
#           prettierd and eslint_d
#
# The six servers are JavaScript, but node is only half the requirement:
#   * RUNTIME  — bun can run all six (verified: they start clean under
#                `bun <server> --stdio`, and report versions). node is not
#                strictly needed to execute them.
#   * INSTALL  — Mason shells out to `npm` specifically. There's no bun
#                backend, so npm is what actually pins this block.
#
# The shims Mason writes also carry `#!/usr/bin/env node`, so invoking a
# server by name resolves node even when bun could have run it.
tool  pkg   node        nodejs
tool  npm   prettierd   @fsouza/prettierd
tool  npm   prettier
tool  npm   eslint_d

post  make -C nvim sync


#####################################################################
# [wezterm] — terminal emulator.
#
# NOTE: wezterm.lua declares the `mux` unix domain that the Jarvis
# sidecar connects to (JARVIS_WEZTERM_DOMAIN defaults to 'mux' in
# jarvis-ui/server/workerSession.ts). Don't replace this config with a
# stock default — the GUI attach depends on that domain name.
#####################################################################
[wezterm]

link  wezterm/wezterm.lua     ~/.config/wezterm/wezterm.lua

tool  pkg||manual  wezterm     # not in Fedora/Ubuntu repos — see wezterm/deps.sh


#####################################################################
# [dev] — project runtimes.
#
# Not needed by the shell or the editor; your projects need them. Kept
# separate so a restricted machine can skip it entirely.
#
# bash/bashrc puts $BUN_INSTALL/bin on PATH behind a `[ -d ]` guard, so
# the shell config stays correct when this section was never installed.
#####################################################################
[dev]

tool  mise||manual  bun        # mise pins it; bun's own installer also fine
